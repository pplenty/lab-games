# Automated QA for the Tower-Defense subsystem — runs on every push/PR so a
# broken inline script or a runtime crash in the TD games is caught before
# deploy. Local equivalents: the same `node tools/*.mjs` commands.
#
# Scope note: deliberately does NOT run tools/check-site.mjs. That validates
# the whole site (brain games.json ↔ files) and currently fails on main because
# some brain games are referenced in games.json but their files aren't committed
# yet (WIP). This workflow gates only the TD games this tooling owns.
name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every inline <script> (+ td-core.js) must parse
      - name: Parse-check game scripts
        run: node tools/parse-check.mjs

      # Headless smoke: load each TD game, place towers, spawn enemies, pump the
      # RAF loop — fail on any thrown exception
      - name: Runtime smoke test
        run: node tools/runtime-check.mjs

      # Balance models must keep running (catches sim drift / data-shape breakage).
      # Informational output; non-zero exit only on a crash.
      - name: Balance sims
        run: |
          node tools/td-sim.mjs 20
          node tools/td-balance.mjs
          node tools/neon-balance.mjs
