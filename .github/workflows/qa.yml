# Automated QA — runs on every push/PR so a broken inline script, a runtime
# crash in the TD games, or a balance regression is caught before deploy.
# Local equivalents: the same `node tools/*.mjs` commands.
#
# check-site validates the whole site (games.json ↔ files, links, .html-URL
# exposure). It is now WIP-tolerant — a game listed in games.json whose file
# isn't committed yet is a non-fatal warning, not a failure — so it can gate
# the real problems without breaking on in-progress brain games.
name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Whole-site structure: required files, games.json schema, broken links,
      # .html-URL exposure (WIP-tolerant: missing game files only warn).
      - name: Site check
        run: node tools/check-site.mjs

      # Every inline <script> (+ td-core.js) must parse
      - name: Parse-check game scripts
        run: node tools/parse-check.mjs

      # Headless smoke: load each TD game, place towers, spawn enemies, pump the
      # RAF loop — fail on any thrown exception
      - name: Runtime smoke test
        run: node tools/runtime-check.mjs

      # Balance invariants as a hard gate: neon counter coverage + pulse-spam
      # dominance guard + roll combat-tower DPS spread. Fails CI if re-broken.
      - name: Balance invariants
        run: node tools/balance-check.mjs

      # Balance models must keep running (catches sim drift / data-shape breakage).
      # Informational output; non-zero exit only on a crash.
      - name: Balance sims
        run: |
          node tools/td-sim.mjs 20
          node tools/td-balance.mjs
          node tools/neon-balance.mjs
