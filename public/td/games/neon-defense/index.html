<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네온 디펜스 · 전략 디펜스</title>
<meta name="description" content="굽이치는 길목에 타워를 세우고 3단계 업그레이드하는 배치 전략 타워 디펜스. 적 상성(비행/장갑/실드/군집) 카운터, 인컴·이자 경제, 보스 웨이브, 15웨이브 후 무한.">
<link rel="canonical" href="https://games.jdgrid.com/td/games/neon-defense/">
<meta property="og:title" content="네온 디펜스">
<meta property="og:description" content="격자 위 본격 타워 디펜스">
<meta name="theme-color" content="#0a0518">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  /* 타워 선택 시 상세 패널이 나타나며 스크롤바가 생겨도 가로 위치가
     밀리지 않도록 스크롤바 폭을 항상 예약 (레이아웃 시프트 방지). */
  html{ scrollbar-gutter: stable; }
  body{
    background: radial-gradient(ellipse at top, #14063a 0%, #050214 70%, #02010a 100%);
    color: #d8d0ff;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", Inter, system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;   /* 모바일 탭 시 파란 플래시 제거 */
    min-height: 100vh;
  }
  a{ color: inherit; }
  .nav-back{
    position: fixed; top:14px; left:14px; z-index:50;
    background: rgba(20,10,50,.7); color:#d8d0ff;
    text-decoration: none; padding: 6px 12px; border-radius: 20px;
    font-size: 12px; border:1px solid rgba(200,180,255,.25);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .shell{
    max-width: 520px; margin: 0 auto;
    padding: 60px 14px 28px;
  }
  .hud{
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px; margin-bottom: 10px;
  }
  .stat{
    background: rgba(30,12,70,.55);
    border: 1px solid rgba(160,120,255,.22);
    border-radius: 10px;
    padding: 8px 6px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .stat .l{ display:block; font-size:10px; letter-spacing:.16em; color:#9a8cd6; font-weight: 700; }
  .stat .v{ display:block; font-size:18px; font-weight:800; color:#fff; line-height:1.1; }
  .stat.gold .v{ color:#ffd96b; }
  .stat.lives .v{ color:#ff7799; }
  .stat.wave .v{ color:#5cd6ea; }
  .stat.time .v{ color:#d8d0ff; }
  .stage-wrap{
    position: relative; width: 100%; max-width: 480px; margin: 0 auto;
    aspect-ratio: 480 / 640;
  }
  canvas{
    width:100%; height:100%; display:block;
    background:#040115;
    border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(140,100,255,.25), 0 24px 60px rgba(40,10,80,.5);
    touch-action: none;
    image-rendering: auto;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background: rgba(8,3,28,.78);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 12px;
    color:#fff; text-align:center; padding: 24px;
    pointer-events: none; z-index: 5;
  }
  .overlay:empty{ display:none; }
  .overlay.on{ pointer-events: auto; }
  .overlay h2{ font-size:24px; font-weight:900; margin-bottom:8px; letter-spacing:0.04em; }
  .overlay p{ opacity:.85; margin-bottom:16px; line-height:1.6; font-size:14px; max-width: 340px; }
  .palette{
    display:grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px; margin-top: 10px;
  }
  .tower-card{
    background: rgba(30,12,70,.55);
    border: 2px solid rgba(160,120,255,.22);
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center; cursor: pointer; user-select: none;
    transition: all .12s;
    position: relative;

  .tower-card:hover{ border-color: rgba(200,180,255,.5); }
  .tower-card.active{ border-color: #fff; box-shadow: 0 0 14px rgba(255,255,255,.5); }
  .tower-card.disabled{ opacity:.4; cursor: not-allowed; }
  .tower-card .icon{
    display:block; width: 28px; height: 28px; margin: 0 auto 4px;
    border-radius: 6px;
  }
  .tower-card .name{ display:block; font-size: 11px; font-weight: 800; letter-spacing:.04em; }
  .tower-card .price{ display:block; font-size: 11px; color: #ffd96b; font-weight: 700; margin-top: 2px; }
  .tower-card .hot{
    position: absolute; top: 3px; right: 5px;
    font-size: 9px; color: #9a8cd6; font-weight: 700;
  }
  .controls{
    display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  }
  .btn{
    background: rgba(40,18,90,.7);
    color: #d8d0ff;
    border: 1px solid rgba(160,120,255,.3);
    border-radius: 10px;
    padding: 9px 14px; font: inherit; font-weight: 800; font-size: 13px;
    cursor: pointer; transition: all .12s;
    letter-spacing: .04em;
    flex: 1; min-width: 70px;
  }
  .btn:hover:not(:disabled){ background: rgba(60,28,120,.85); border-color: rgba(200,180,255,.5); }
  .btn.primary{
    background: linear-gradient(180deg, #5cd6ea, #2a9aae);
    color: #04101a;
    border-color: #5cd6ea;
  }
  .btn.primary:hover:not(:disabled){ filter: brightness(1.1); }
  .btn:disabled{ opacity: .35; cursor: not-allowed; }
  .btn.danger{
    background: rgba(200,40,80,.5);
    border-color: rgba(255,120,150,.5);
  }
  .info{
    text-align:center; color:#9a8cd6; font-size:12px; margin-top: 10px; line-height: 1.5;
  }
  .tower-detail{
    background: rgba(20,8,50,.6);
    border: 1px solid rgba(160,120,255,.25);
    border-radius: 10px;
    padding: 10px;
    margin-top: 8px;
    display: none;
    font-size: 12px;

  .tower-detail.on{ display: block; }
  .tower-detail .tname{ font-weight: 800; color: #fff; letter-spacing:.05em; }
  .tower-detail .row{ display:flex; justify-content: space-between; margin-top: 4px; }
  .tower-detail .actions{ display:flex; gap:6px; margin-top:8px; }
  .tower-detail .actions .btn{ padding: 7px 8px; font-size:12px; min-width: 0; }
  /* Result */
  .result-card{
    background: rgba(30,12,70,.85);
    border: 1px solid rgba(160,120,255,.4);
    border-radius: 14px;
    padding: 26px 22px;
    text-align: center;
    margin-top: 14px;
    color:#fff;
  }
  .result-card h2{ font-size: 28px; margin-bottom: 6px; letter-spacing: .03em; }
  .result-card .big{
    font-size: 44px; font-weight: 900; color: #ffd96b;
    margin: 14px 0; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .result-card .sub{ color: #9a8cd6; font-size: 13px; margin-bottom: 14px; }
  .result-card .row{ display:flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .ribbon{
    display: inline-block; background: #ffd96b; color: #04101a;
    padding: 4px 14px; border-radius: 20px; font-weight: 800; font-size: 12px;
    letter-spacing: .1em; margin-top: 6px;
  }
  /* Title */
  #title{
    text-align: center; padding: 30px 0 12px;
  }
  #title .badge{
    display:inline-block; font-size:10px; letter-spacing:.3em; color:#9a8cd6; font-weight: 700;
  }
  #title h1{
    font-size: 36px; font-weight: 900; letter-spacing:-.01em; margin: 8px 0 6px;
    background: linear-gradient(90deg, #5cd6ea, #c98aff, #ff5b9c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title p{ color:#9a8cd6; font-size: 14px; line-height: 1.7; max-width: 380px; margin: 0 auto 16px; }
  .rules{
    background: rgba(20,8,50,.55);
    border: 1px solid rgba(160,120,255,.22);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 14px 0 18px;
    text-align: left;
    font-size: 12.5px; line-height: 1.8;
    color: #c0b8e4;
  }
  .rules h3{ font-size:11px; letter-spacing:.2em; color:#9a8cd6; margin-bottom: 6px; }
  .rules .row{ display: flex; gap: 8px; }
  .rules .sw{ width: 10px; height: 10px; border-radius: 3px; margin-top: 5px; flex-shrink: 0; }
  @media(max-width: 420px){
    .palette{ grid-template-columns: repeat(2, 1fr); }
    .controls{ flex-wrap: wrap; }
    #title h1{ font-size: 30px; }
  }
</style>
</head>

<script src="../../lib/td-core.js"></script>
<script>
'use strict';

/* ============================================================
 * Neon Defense — Phase 1 MVP
 * Single map, 4 towers, 3 enemies, 15 waves
 * ============================================================ */

const W = 480, H = 640;
const CELL = 32;
const COLS = W / CELL;   // 15
const ROWS = H / CELL;   // 20

const KEY = 'neon_defense_stats';

/* ---------- Map: 7-lane serpentine (SC2 랜타디풍) ----------
 * 굽이치는 7개 가로 레인 + 좌우 길목. 레인 사이 빈 띠 = 건설 포켓
 * (여러 레인을 동시에 사정권에 두는 고가치 자리).
 */
const LANE_Y = [1, 4, 6, 9, 11, 14, 16];   // 7 lanes
const LANE_XL = 1, LANE_XR = 13;
const PATH_CELLS = (() => {
  const cells = [];
  let dir = 1; // 1: L→R, -1: R→L
  for (let li = 0; li < LANE_Y.length; li++){
    const y = LANE_Y[li];
    if (dir === 1) for (let x = LANE_XL; x <= LANE_XR; x++) cells.push([x, y]);
    else            for (let x = LANE_XR; x >= LANE_XL; x--) cells.push([x, y]);
    const endX = dir === 1 ? LANE_XR : LANE_XL;
    const nextY = li < LANE_Y.length - 1 ? LANE_Y[li + 1] : ROWS - 1; // exit row 19
    for (let y2 = y + 1; y2 <= nextY; y2++) cells.push([endX, y2]);
    dir *= -1;
  }
  // 연속 중복 웨이포인트 제거 (코너 셀)
  const out = [];
  for (const c of cells){ const p = out[out.length - 1]; if (!p || p[0] !== c[0] || p[1] !== c[1]) out.push(c); }
  return out;
})();
const PATH_SET = new Set(PATH_CELLS.map(([x, y]) => `${x},${y}`));
// 건설 포켓: 길이 아닌 칸 중 상하좌우로 길에 2개 이상 접한 고가치 자리
const POCKET_SET = (() => {
  const s = new Set();
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++){
    if (PATH_SET.has(`${cx},${cy}`)) continue;
    let n = 0;
    if (PATH_SET.has(`${cx-1},${cy}`)) n++;
    if (PATH_SET.has(`${cx+1},${cy}`)) n++;
    if (PATH_SET.has(`${cx},${cy-1}`)) n++;
    if (PATH_SET.has(`${cx},${cy+1}`)) n++;
    if (n >= 2) s.add(`${cx},${cy}`);
  }
  return s;
})();
const PATH_POINTS = PATH_CELLS.map(([x, y]) => ({
  x: x * CELL + CELL / 2,
  y: y * CELL + CELL / 2
}));

/* ---------- Tower defs — 3 levels each (배치 전략 TD) ----------
 *  lv[1..3]: { damage, range, interval, ...special }, upCost = 그 레벨로 올리는 비용
 *  strongVs / weakVs: 적 종류 카운터 (×1.5 / ×0.6). antiAir: 비행 명중 가능.
 */
const TOWERS = {
  pulse: {
    id: 'pulse', name: 'PULSE', cost: 30, color: '#5cd6ea', fire: 'beam',
    antiAir: true, strongVs: ['runner', 'swarm'], weakVs: ['tank'],
    desc: '단일 속사 · 대공 가능 · 만능형',
    // 만능형이라 DPS/gold 효율 1위였음(전략성 저해) → Lv2/3 dmg 하향(18→16, 42→34)으로
    // 전문 타워(burst AoE) 아래 효율로 재조정. Lv1은 초반 의존도 높아 유지.
    lv: [null,
      { damage:  8, range:  96, interval: 0.50 },
      { damage: 16, range: 108, interval: 0.45, upCost: 35 },
      { damage: 34, range: 122, interval: 0.40, upCost: 75 }
    ]
  },
  burst: {
    id: 'burst', name: 'BURST', cost: 55, color: '#ff8a3c', fire: 'aoe',
    antiAir: false, strongVs: ['swarm', 'grunt'], weakVs: ['shield'],
    desc: '광역 폭발 · 군집 학살 · 지상만',
    lv: [null,
      { damage: 12, range:  80, interval: 1.20, aoeRadius: 48 },
      { damage: 26, range:  92, interval: 1.05, aoeRadius: 56, upCost: 60 },
      { damage: 58, range: 106, interval: 0.92, aoeRadius: 68, upCost: 120 }
    ]
  },
  frost: {
    id: 'frost', name: 'FROST', cost: 50, color: '#80e8ff', fire: 'slow',
    antiAir: false, strongVs: ['shield'], weakVs: [],
    desc: '슬로우 · 실드 카운터 · 길목 핵심',
    lv: [null,
      { damage:  3, range: 112, interval: 0.60, slowFactor: 0.55, slowDuration: 1.6 },
      { damage:  8, range: 124, interval: 0.55, slowFactor: 0.42, slowDuration: 2.0, upCost: 45 },
      { damage: 18, range: 138, interval: 0.50, slowFactor: 0.30, slowDuration: 2.5, upCost: 95 }
    ]
  },
  rail: {
    id: 'rail', name: 'RAIL', cost: 80, color: '#ff5b9c', fire: 'pierce',
    antiAir: true, strongVs: ['flyer', 'tank'], weakVs: ['swarm'],
    desc: '장거리 관통 · 대공 · 장갑 카운터',
    lv: [null,
      { damage: 14, range: 160, interval: 1.50 },
      { damage: 32, range: 180, interval: 1.35, upCost: 85 },
      { damage: 74, range: 200, interval: 1.20, upCost: 170 }
    ]
  }
};
const TOWER_ORDER = ['pulse', 'burst', 'frost', 'rail'];
const MAX_LEVEL = 3;
const COUNTER_STRONG = 1.5, COUNTER_WEAK = 0.6;

/* ---------- Enemy defs — 카운터/특성 ----------
 *  armored: rail/strongVs로 카운터 / shield N: 본체 앞 흡수막
 *  flying: antiAir 타워만 명중 / boss: 두꺼움
 */
const ENEMIES = {
  grunt:  { name:'GRUNT',  hp:  30, speed:  56, gold:  8, r: 10, color:'#86d6a8', desc:'기본 적' },
  runner: { name:'RUNNER', hp:  18, speed: 104, gold: 12, r:  8, color:'#ffd96b', desc:'빠르고 약함' },
  swarm:  { name:'SWARM',  hp:  12, speed:  80, gold:  4, r:  6, color:'#a4ff5c', desc:'싸고 떼로 · AoE에 약함' },
  tank:   { name:'TANK',   hp: 130, speed:  36, gold: 25, r: 13, color:'#ff7799', desc:'장갑 · 느리고 단단함', armored:true },
  shield: { name:'SHIELD', hp:  70, speed:  48, gold: 20, r: 12, color:'#bcc6ff', desc:'실드 60 먼저 · FROST 카운터', shield:60 },
  flyer:  { name:'FLYER',  hp:  72, speed:  70, gold: 22, r:  9, color:'#7cc4ff', desc:'비행 · PULSE·RAIL만 명중', flying:true },
  boss:   { name:'BOSS',   hp: 900, speed:  30, gold:120, r: 17, color:'#ff5577', desc:'매우 두꺼움 · 누수 시 -10', boss:true }
};

/* ---------- 15 Wave schedule (이후 무한) ----------
 *  entries: [type, count, interval_seconds, optional pre_delay]
 *  5·10·15 = 보스 웨이브.
 */
const WAVES = [
  [['grunt', 8, 0.7]],
  [['grunt', 10, 0.6], ['swarm', 8, 0.28, 1.5]],
  [['grunt', 10, 0.5], ['runner', 7, 0.45, 1.0]],
  [['shield', 5, 1.1], ['grunt', 12, 0.4, 1.0]],
  [['boss', 1, 0], ['swarm', 14, 0.3, 1.0]],
  [['flyer', 8, 0.7], ['runner', 10, 0.4, 1.0]],
  [['tank', 5, 1.3], ['swarm', 16, 0.26, 1.5]],
  [['shield', 8, 0.9], ['flyer', 8, 0.6, 2.0]],
  [['runner', 22, 0.28], ['tank', 4, 1.2, 2.0]],
  [['boss', 2, 6.0], ['flyer', 10, 0.5, 1.0], ['tank', 4, 1.1, 3.0]],
  [['swarm', 30, 0.18], ['shield', 8, 0.9, 2.0]],
  [['tank', 9, 0.9], ['flyer', 10, 0.5, 2.0]],
  [['shield', 10, 0.7], ['runner', 18, 0.3, 2.0], ['swarm', 18, 0.26, 4.0]],
  [['flyer', 16, 0.45], ['tank', 7, 1.0, 2.0], ['runner', 16, 0.3, 4.0]],
  [['boss', 3, 5.0], ['tank', 8, 0.9, 1.0], ['flyer', 14, 0.45, 4.0], ['swarm', 26, 0.22, 8.0]]
];

const START_GOLD = 90;       // 개막 빡빡하게 (맵 도배 방지)
const START_LIVES = 15;      // 누수 여유 축소
const BOSS_LEAK = 10;        // 보스 누수 시 -10 (일반은 -1)
const WAVE_BONUS = 16;       // 웨이브 클리어 기본 인컴 (24→16)
const INTEREST_RATE = 0.06;  // 보유 골드 이자 (8→6%)
const INTEREST_CAP = 25;     // 이자 상한 (40→25)
const HP_EXP = 1.13;         // 무한 모드 HP 지수 스케일 (1.10→1.13, 벽 앞당김)

/* ---------- Combat helpers ---------- */
function towerStat(t){ return TOWERS[t.type].lv[t.level]; }   // 현재 레벨 능력치
function counterMult(def, e){
  if (def.strongVs && def.strongVs.includes(e.type)) return COUNTER_STRONG;
  if (def.weakVs   && def.weakVs.includes(e.type))   return COUNTER_WEAK;
  return 1;
}
// 데미지 적용: 실드(shield) 먼저 차감 후 본체
function applyDamage(e, dmg){
  if (dmg <= 0) return;
  if (e.shield > 0){ const a = Math.min(e.shield, dmg); e.shield -= a; dmg -= a; }
  if (dmg > 0) e.hp -= dmg;
}
function canHit(def, e){ return !e.flying || def.antiAir; }   // 비행은 대공만

/* ---------- Audio — td-core.js tdAudio 컨트롤러 + neon SFX 셋 ---------- */
const AUDIO = tdAudio('neon_defense_muted');
let _lastKillSfx = 0;
function resumeAudio(){ AUDIO.resume(); }
const SFX = {
  place(){ AUDIO.tone(600, 0.08, 'square', 0.07, 880); },
  upgrade(){ AUDIO.tone(520, 0.14, 'triangle', 0.09, 980); },
  sell(){ AUDIO.tone(440, 0.12, 'sine', 0.07, 200); },
  kill(){ const n = performance.now(); if (n - _lastKillSfx < 45) return; _lastKillSfx = n; AUDIO.tone(300, 0.06, 'sine', 0.045, 160); },
  wave(){ AUDIO.tone(660, 0.10, 'square', 0.08); setTimeout(() => AUDIO.tone(990, 0.13, 'square', 0.08), 95); },
  leak(){ AUDIO.tone(170, 0.22, 'sawtooth', 0.10, 60); },
  win(){ AUDIO.tone(740, 0.16, 'triangle', 0.10, 1200); setTimeout(() => AUDIO.tone(1100, 0.22, 'triangle', 0.10, 1600), 120); },
  gameover(){ AUDIO.tone(440, 0.5, 'sawtooth', 0.13, 70); }
};

/* ============================================================
 * State + Rendering
 * ============================================================ */
let state = null;
let canvas = null, ctx = null, dpr = 1;
let rafId = null;
let lastFrameTs = 0;

let root = null;
let hudEls = null;
let paletteEls = null;
let detailEl = null;
let overlayEl = null;
let waveBtn = null;
// DOM 더티 체크(setText/setClass) + DPR/오프스크린 헬퍼(tdDpr/tdOffscreen/tdMakeSprite)는
// ../../lib/td-core.js 에서 전역 제공.

function init(){
  root = document.getElementById('root');
  showTitle();
}

function showTitle(){
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  const best = loadStats();
  root.innerHTML = `
    <section id="title">
      <span class="badge">전략 디펜스</span>
      <h1>네온 디펜스</h1>
      <p>굽이치는 길목에 타워를 세우고 <b>업그레이드</b>하라.<br>적 상성을 읽는 본격 배치 전략 TD.</p>
      ${best.bestScore > 0 ? `<div class="ribbon">B E S T &nbsp; ${best.bestScore}</div>

function loadStats(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign({ played:0, bestScore:0, bestWave:0 }, JSON.parse(raw));
  } catch(e) {}
  return { played:0, bestScore:0, bestWave:0 };
}
function saveStats(s){
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {}
}
let seenTutorial = (function(){ try { return localStorage.getItem('neon_defense_seen_tutorial') === '1'; } catch(e){ return false; } })();

function startGame(){
  resumeAudio();   // 사용자 제스처(출발 클릭)에서 오디오 컨텍스트 해제
  state = {
    gold: START_GOLD,
    lives: START_LIVES,
    waveIdx: 0,           // 다음 시작할 웨이브 (0..14)
    wavesCleared: 0,
    score: 0,
    time: 0,              // 게임 시간 (sec)
    phase: 'prepare',     // 'prepare' | 'wave' | 'won' | 'lost'
    paused: false,
    speed: 1,             // 1 or 2
    towers: [],
    enemies: [],
    beams: [],            // { x1, y1, x2, y2, color, life, maxLife }
    explosions: [],       // { x, y, r, maxR, life, maxLife, color }
    particles: [],
    floatTexts: [],       // 데미지/골드 표시
    spawnEntries: [],
    entryIdx: 0,
    placeMode: null,      // null | tower type id
    selectedTower: null,  // 배치된 타워 ref
    hoverCell: null
  };
  buildLayout();
  bindEvents();
  if (seenTutorial) showPrepareOverlay();
  else showTutorial();
  startLoop();
}

function showPrepareOverlay(){

  `, false);
}

function buildLayout(){
  root.innerHTML = `
    <div class="hud">
      <div class="stat gold"><span class="l">GOLD</span><span class="v" id="hud-gold">0</span></div>
      <div class="stat lives"><span class="l">LIVES</span><span class="v" id="hud-lives">0</span></div>
      <div class="stat wave"><span class="l">WAVE</span><span class="v" id="hud-wave">0/15</span></div>
      <div class="stat time"><span class="l">SPEED</span><span class="v" id="hud-speed">1×</span></div>
    </div>
    <div class="stage-wrap">
      <canvas id="stage" width="${W}" height="${H}"></canvas>
      <div class="overlay on" id="overlay"></div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="tower-detail" id="tower-detail"></div>
    <div class="controls">
      <button class="btn primary" id="btn-wave">다음 웨이브</button>
      <button class="btn" id="btn-pause">일시정지</button>
      <button class="btn" id="btn-speed">2×</button>
      <button class="btn" id="btn-mute" title="음소거">${AUDIO.muted ? '🔇' : '🔊'}</button>
      <button class="btn" id="btn-quit">그만</button>
    </div>
    <div class="info">1·2·3·4 타워 선택 · 빈 칸 배치 · 타워 클릭=업그레이드/판매/타깃 · P 일시 · F 배속 · Space 웨이브</div>
  `;

  hudEls = {
    gold: document.getElementById('hud-gold'),
    lives: document.getElementById('hud-lives'),
    wave: document.getElementById('hud-wave'),
    speed: document.getElementById('hud-speed')
  };
  overlayEl = document.getElementById('overlay');
  detailEl = document.getElementById('tower-detail');
  waveBtn = document.getElementById('btn-wave');

  // 팔레트
  const pal = document.getElementById('palette');
  pal.innerHTML = TOWER_ORDER.map((id, i) => {
    const t = TOWERS[id];
    return `
      <div class="tower-card" data-tower="${id}">
        <span class="hot">${i+1}</span>
        <span class="icon" style="background: linear-gradient(135deg, ${t.color}, ${shade(t.color, -25)});"></span>
        <span class="name">${t.name}</span>
        <span class="price">${t.cost}g</span>
      </div>
    `;
  }).join('');
  paletteEls = {};
  for (const id of TOWER_ORDER){
    paletteEls[id] = pal.querySelector(`.tower-card[data-tower="${id}"]`);
  }

  canvas = document.getElementById('stage');
  ctx = canvas.getContext('2d');
  // 성능: 스테이지 DPR 상한 1.5 (고해상도 화면 픽셀 처리량 ↓) — tdDpr: td-core.js
  dpr = tdDpr(1.5);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}

function bindEvents(){
  // 팔레트
  for (const id of TOWER_ORDER){
    paletteEls[id].addEventListener('click', () => selectPlaceTower(id));
  }
  // 컨트롤
  document.getElementById('btn-wave').onclick = startNextWave;
  document.getElementById('btn-pause').onclick = togglePause;
  document.getElementById('btn-speed').onclick = toggleSpeed;
  document.getElementById('btn-quit').onclick = () => { stopLoop(); showTitle(); };
  const muteBtn = document.getElementById('btn-mute');
  muteBtn.onclick = () => { resumeAudio(); muteBtn.textContent = AUDIO.toggleMute() ? '🔇' : '🔊'; };
  // 키보드
  document.addEventListener('keydown', onKey);
  // 캔버스
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseleave', () => { state.hoverCell = null; });
  canvas.addEventListener('click', onClick);
  // 터치: 드래그로 조준(사거리 미리보기) → 손 떼면 배치/선택 (td-core.js)
  tdBindTouch(canvas, clientToCell, {
    aim: (c) => { state.hoverCell = c; },
    commit: (c) => handleCellClick(c),
    end: () => { state.hoverCell = null; }
  });
}

function unbindEvents(){
  document.removeEventListener('keydown', onKey);
}

function onKey(e){
  if (e.code === 'Digit1' || e.code === 'Numpad1'){ selectPlaceTower('pulse'); e.preventDefault(); }
  else if (e.code === 'Digit2' || e.code === 'Numpad2'){ selectPlaceTower('burst'); e.preventDefault(); }
  else if (e.code === 'Digit3' || e.code === 'Numpad3'){ selectPlaceTower('frost'); e.preventDefault(); }
  else if (e.code === 'Digit4' || e.code === 'Numpad4'){ selectPlaceTower('rail'); e.preventDefault(); }
  else if (e.code === 'Escape'){ state.placeMode = null; state.selectedTower = null; refreshPalette(); refreshDetail(); }
  else if (e.code === 'KeyP'){ togglePause(); e.preventDefault(); }
  else if (e.code === 'KeyF'){ toggleSpeed(); e.preventDefault(); }
  else if (e.code === 'Space'){ startNextWave(); e.preventDefault(); }
}

function clientToCell(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  const x = (clientX - r.left) * (W / r.width);
  const y = (clientY - r.top) * (H / r.height);
  return { cx: Math.floor(x / CELL), cy: Math.floor(y / CELL), px: x, py: y };
}

function onMouseMove(e){
  const c = clientToCell(e.clientX, e.clientY);
  state.hoverCell = c;
}

function onClick(e){
  const c = clientToCell(e.clientX, e.clientY);
  handleCellClick(c);
}

function handleCellClick(c){
  if (state.phase === 'won' || state.phase === 'lost') return;
  // 1) 배치 모드: 빈 칸에 타워 배치
  if (state.placeMode){
    if (canPlace(c.cx, c.cy)){
      const t = TOWERS[state.placeMode];
      if (state.gold >= t.cost){
        placeTower(state.placeMode, c.cx, c.cy);
        state.gold -= t.cost;
        // 배치 모드 유지 (연속 배치). 골드 부족하면 해제.
        if (state.gold < t.cost){
          state.placeMode = null;
          refreshPalette();
        }
      }
    }
    return;
  }
  // 2) 배치된 타워 클릭 → 선택
  const t = state.towers.find(t => t.cx === c.cx && t.cy === c.cy);
  if (t){
    state.selectedTower = t;
    refreshDetail();
  } else {
    state.selectedTower = null;
    refreshDetail();
  }
}

function canPlace(cx, cy){
  if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return false;
  if (PATH_SET.has(`${cx},${cy}`)) return false;
  if (state.towers.some(t => t.cx === cx && t.cy === cy)) return false;
  return true;
}

function placeTower(typeId, cx, cy){
  const def = TOWERS[typeId];
  state.towers.push({
    id: 't' + (state.time * 1000 | 0) + Math.floor(Math.random() * 1000),
    type: typeId, cx, cy, level: 1,
    x: cx * CELL + CELL / 2,
    y: cy * CELL + CELL / 2,
    cooldown: 0,
    targetId: null,
    angle: -Math.PI / 2,
    spent: def.cost,           // 누적 투자 (판매 환불 기준)
    priority: 'first'          // first | strong | weak | close
  });
  SFX.place();
}

function selectPlaceTower(typeId){
  if (state.phase === 'won' || state.phase === 'lost') return;
  if (state.placeMode === typeId){ state.placeMode = null; }
  else if (state.gold >= TOWERS[typeId].cost){ state.placeMode = typeId; state.selectedTower = null; refreshDetail(); }
  refreshPalette();
}

function refreshPalette(){
  // 매 프레임 호출 — 더티 체크로 변경 시에만 classList 쓰기
  for (const id of TOWER_ORDER){
    const el = paletteEls[id];
    setClass(el, 'active', state.placeMode === id);
    setClass(el, 'disabled', state.gold < TOWERS[id].cost);
  }
}

const PRIORITY_ORDER = ['first', 'strong', 'weak', 'close'];
const PRIORITY_LABEL = { first: '선두', strong: '강한 적', weak: '약한 적', close: '근접' };

function upgradeCost(t){
  const next = TOWERS[t.type].lv[t.level + 1];
  return next ? next.upCost : null;
}
function refreshDetail(){
  if (state.selectedTower){
    const t = state.selectedTower;
    const def = TOWERS[t.type];
    const st = towerStat(t);
    const refund = Math.floor(t.spent * 0.6);
    const upCost = upgradeCost(t);
    const cs = (def.strongVs || []).map(k => ENEMIES[k].name).join(', ');
    const cw = (def.weakVs || []).map(k => ENEMIES[k].name).join(', ');
    detailEl.classList.add('on');
    detailEl.innerHTML = `
      <div class="tname" style="color:${def.color}">${def.name} <span style="font-size:11px; color:#ffd96b;">Lv.${t.level}${'★'.repeat(t.level)}</span>${def.antiAir ? ' <span style="font-size:9px;color:#7cc4ff;">AA</span>' : ''}</div>
      <div class="row"><span>사거리</span><span>${st.range}px</span></div>
      <div class="row"><span>데미지</span><span>${st.damage}${def.fire === 'aoe' ? ' (AoE ' + st.aoeRadius + ')' : def.fire === 'pierce' ? ' (관통)' : ''}</span></div>
      <div class="row"><span>발사 간격</span><span>${st.interval}s</span></div>
      ${def.fire === 'slow' ? `<div class="row"><span>슬로우</span><span>${Math.round((1 - st.slowFactor)*100)}% / ${st.slowDuration}s</span></div>` : ''}
      ${cs || cw ? `<div class="row" style="font-size:11px;"><span>상성</span><span>${cs ? '<span style="color:#86d6a8">💪' + cs + '</span> ' : ''}${cw ? '<span style="color:#ff7799">🔻' + cw + '</span>' : ''}</span></div>` : ''}
      <div class="row"><span>타깃</span><span><button class="btn" id="btn-prio" style="padding:2px 8px; font-size:11px;">${PRIORITY_LABEL[t.priority || 'first']}</button></span></div>
      <div class="actions">
        ${upCost != null
          ? `<button class="btn primary" id="btn-up" ${state.gold < upCost ? 'disabled' : ''}>업그레이드 Lv.${t.level + 1} · ${upCost}g</button>`
          : `<span style="font-size:11px; color:#ffd96b; align-self:center;">★ 최대 레벨</span>`}
        <button class="btn danger" id="btn-sell">판매 +${refund}g</button>
      </div>
    `;
    document.getElementById('btn-sell').onclick = sellSelected;
    document.getElementById('btn-prio').onclick = cyclePriority;
    const up = document.getElementById('btn-up');
    if (up) up.onclick = upgradeSelected;
  } else {
    detailEl.classList.remove('on');
    detailEl.innerHTML = '';
  }
}

function upgradeSelected(){
  const t = state.selectedTower;
  if (!t) return;
  const cost = upgradeCost(t);
  if (cost == null || state.gold < cost) return;
  state.gold -= cost;
  t.level += 1;
  t.spent += cost;
  SFX.upgrade();
  addExplosion(t.x, t.y, 22, TOWERS[t.type].color);
  addFloatText(t.x, t.y - 8, 'Lv.' + t.level, TOWERS[t.type].color);
  refreshDetail();
  refreshPalette();
}

function cyclePriority(){
  const t = state.selectedTower;
  if (!t) return;
  const cur = t.priority || 'first';
  t.priority = PRIORITY_ORDER[(PRIORITY_ORDER.indexOf(cur) + 1) % PRIORITY_ORDER.length];
  refreshDetail();
}

function sellSelected(){
  const t = state.selectedTower;
  if (!t) return;
  const refund = Math.floor(t.spent * 0.6);
  state.gold += refund;
  SFX.sell();
  addFloatText(t.x, t.y, '+' + refund + 'g', '#ffd96b');
  state.towers = state.towers.filter(x => x !== t);
  state.selectedTower = null;
  refreshDetail();
  refreshPalette();
}

function togglePause(){
  if (state.phase === 'won' || state.phase === 'lost') return;
  state.paused = !state.paused;
  document.getElementById('btn-pause').textContent = state.paused ? '재개' : '일시정지';
  if (state.paused){
    setOverlay(`<h2>일시정지</h2><p>P 또는 [재개] 버튼으로 계속</p>`, false);
  } else if (state.phase === 'prepare'){
    setOverlay(`
      <h2>준비 단계</h2>
      <p>타워를 배치하고 <b>다음 웨이브</b>를 누르세요.</p>
    `, false);
  } else {
    clearOverlay();
  }
}

function toggleSpeed(){
  state.speed = state.speed === 1 ? 2 : 1;
  document.getElementById('btn-speed').textContent = state.speed + '×';
  setText(hudEls.speed, state.speed + '×');
}

function getWave(idx){
  if (idx < WAVES.length) return WAVES[idx];
  return generateInfiniteWave(idx);
}
// 15웨이브 이후 무한 절차 생성. 5의 배수(subStep 4) = 보스 웨이브.
function generateInfiniteWave(idx){
  const cycle = idx - WAVES.length;
  const tier = Math.floor(cycle / 5);
  const sub = cycle % 5;
  if (sub === 4){
    const bossCount = 1 + Math.floor(tier / 2);
    return [
      ['boss',  bossCount,   4.5, 1.0],
      ['flyer', 8 + tier * 2, 0.5, 2.0],
      ['shield', 4 + tier,   1.0, 4.0]
    ];
  }
  const wts = {
    grunt: 22, runner: 20 + tier * 2, swarm: 18 + tier * 3,
    tank: 10 + tier * 3, shield: 8 + tier * 3, flyer: 6 + tier * 4
  };
  const numTypes = 2 + Math.floor(Math.random() * 3);
  const picked = new Set();
  let guard = 0;
  while (picked.size < numTypes && guard++ < 20) picked.add(weightedPick(wts));
  const entries = [];
  let delay = 0;
  for (const type of picked){
    const tough = ENEMIES[type].hp >= 70;
    const count = tough ? (4 + tier * 2) : (10 + tier * 3);
    const interval = Math.max(0.18, 0.5 - tier * 0.02 + Math.random() * 0.12);
    entries.push([type, count, interval, delay]);
    delay += 0.8 + Math.random() * 1.8;
  }
  return entries;
}
function weightedPick(weights){
  const tot = Object.values(weights).reduce((a, b) => a + b, 0);
  let r = Math.random() * tot;
  for (const k in weights){ if (r < weights[k]) return k; r -= weights[k]; }
  return Object.keys(weights)[0];
}

function startNextWave(){
  if (state.phase !== 'prepare') return;
  const wave = getWave(state.waveIdx);
  if (!wave) return;
  state.spawnEntries = wave.map(e => ({
    type: e[0],
    remaining: e[1],
    interval: e[2],
    timer: e[3] || 0   // pre delay
  }));
  state.entryIdx = 0;
  state.phase = 'wave';
  SFX.wave();
  waveBtn.disabled = true;
  clearOverlay();
}

function spawnEnemy(type){
  const def = ENEMIES[type];
  const start = PATH_POINTS[0];
  // 무한 모드 스케일링: 15웨이브 이후 HP·골드 증가
  const cycle = Math.max(0, state.waveIdx - WAVES.length);
  const hpMult = Math.pow(HP_EXP, cycle);
  // 무한 골드 증가율 0.04→0.02 (neon-balance "골드가 배치 추월" 후속: 엔드리스
  // 골드 잉여 완화. 설계 15웨이브는 cycle=0이라 무영향).
  const goldMult = 1 + 0.02 * cycle;
  const hp = Math.round(def.hp * hpMult);
  state.enemies.push({
    type, x: start.x, y: start.y,
    hp, maxHp: hp,
    shield: Math.round((def.shield || 0) * hpMult),
    maxShield: Math.round((def.shield || 0) * hpMult),
    speed: def.speed,
    pathIdx: 1,
    slowUntil: 0,
    slowFactor: 1,
    r: def.r,
    color: def.color,
    flying: !!def.flying,
    boss: !!def.boss,
    reward: Math.max(1, Math.round(def.gold * goldMult)),
    dead: false,
    escaped: false
  });
}

function tickSpawns(dt){
  if (state.entryIdx >= state.spawnEntries.length) return;
  const entry = state.spawnEntries[state.entryIdx];
  entry.timer -= dt;
  if (entry.timer <= 0){
    spawnEnemy(entry.type);
    entry.remaining -= 1;
    if (entry.remaining <= 0){
      state.entryIdx += 1;
    } else {
      entry.timer = entry.interval;
    }
  }
}

function step(dt){
  state.time += dt;

  // 적 이동
  for (const e of state.enemies){
    if (e.dead || e.escaped) continue;
    const target = PATH_POINTS[e.pathIdx];
    if (!target){
      e.escaped = true;
      state.lives -= e.boss ? BOSS_LEAK : 1;
      SFX.leak();
      addFloatText(e.x, e.y, '-' + (e.boss ? BOSS_LEAK : 1) + '♥', '#ff5577');
      if (state.lives <= 0){ state.lives = 0; return loseGame(); }
      continue;
    }
    const dx = target.x - e.x, dy = target.y - e.y;
    const d = Math.hypot(dx, dy);
    const slow = e.slowUntil > state.time ? e.slowFactor : 1;
    const step = e.speed * slow * dt;
    if (d <= step){
      e.x = target.x; e.y = target.y;
      e.pathIdx += 1;
    } else {
      e.x += (dx / d) * step;
      e.y += (dy / d) * step;
    }
  }

  // 사망/이탈 제거
  for (const e of state.enemies){
    if (!e.dead && !e.escaped && e.hp <= 0){
      e.dead = true;
      state.gold += e.reward;
      state.score += e.reward;
      SFX.kill();
      addFloatText(e.x, e.y, '+' + e.reward + 'g', '#ffd96b');
      spawnKillParticles(e);
    }
  }
  state.enemies = state.enemies.filter(e => !e.dead && !e.escaped);

  // 스폰
  tickSpawns(dt);

  // 타워 사격
  for (const t of state.towers){
    t.cooldown -= dt;
    const def = TOWERS[t.type];
    const st = towerStat(t);
    let target = null, bestVal = -Infinity;
    const pr = t.priority || 'first';
    for (const e of state.enemies){
      if (e.dead || e.escaped) continue;
      if (!canHit(def, e)) continue;           // 비행은 대공 타워만
      const dx = e.x - t.x, dy = e.y - t.y;
      const d2 = dx*dx + dy*dy;
      if (d2 > st.range * st.range) continue;
      let val;
      if (pr === 'strong')      val = e.hp + e.shield;
      else if (pr === 'weak')   val = -(e.hp + e.shield);
      else if (pr === 'close')  val = -d2;
      else                      val = e.pathIdx;   // first (가장 앞선 적)
      if (val > bestVal){ bestVal = val; target = e; }
    }
    if (target){
      t.angle = Math.atan2(target.y - t.y, target.x - t.x);
      if (t.cooldown <= 0){
        fire(t, target);
        t.cooldown = st.interval;
      }
    }
  }

  // beams / explosions / particles / floats 수명
  for (const b of state.beams) b.life -= dt;
  state.beams = state.beams.filter(b => b.life > 0);
  for (const x of state.explosions){
    const k = 1 - x.life / x.maxLife;
    x.r = x.maxR * Math.min(1, k * 2);
    x.life -= dt;
  }
  state.explosions = state.explosions.filter(x => x.life > 0);
  for (const p of state.particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= dt;
  }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const f of state.floatTexts){
    f.y -= 30 * dt;
    f.life -= dt;
  }
  state.floatTexts = state.floatTexts.filter(f => f.life > 0);

  // 웨이브 종료?
  if (state.phase === 'wave'){
    if (state.entryIdx >= state.spawnEntries.length && state.enemies.length === 0){
      endWave();
    }
  }
}

function fire(t, target){
  const def = TOWERS[t.type];
  const st = towerStat(t);
  if (def.fire === 'beam'){
    applyDamage(target, st.damage * counterMult(def, target));
    addBeam(t.x, t.y, target.x, target.y, def.color, 0.13);
  } else if (def.fire === 'aoe'){
    addBeam(t.x, t.y, target.x, target.y, def.color, 0.16);
    addExplosion(target.x, target.y, st.aoeRadius, def.color);
    for (const e of state.enemies){
      if (e.dead || e.escaped) continue;
      if (!canHit(def, e)) continue;
      const dx = e.x - target.x, dy = e.y - target.y;
      if (dx*dx + dy*dy <= st.aoeRadius * st.aoeRadius){
        applyDamage(e, st.damage * counterMult(def, e));
      }
    }
  } else if (def.fire === 'slow'){
    applyDamage(target, st.damage * counterMult(def, target));
    target.slowUntil = state.time + st.slowDuration;
    target.slowFactor = st.slowFactor;
    addBeam(t.x, t.y, target.x, target.y, def.color, 0.18);
  } else if (def.fire === 'pierce'){
    const dx = Math.cos(t.angle), dy = Math.sin(t.angle);
    const ex = t.x + dx * st.range;
    const ey = t.y + dy * st.range;
    addBeam(t.x, t.y, ex, ey, def.color, 0.28);
    for (const e of state.enemies){
      if (e.dead || e.escaped) continue;
      if (!canHit(def, e)) continue;
      const dist = pointSegDist(e.x, e.y, t.x, t.y, ex, ey);
      if (dist < e.r + 5){
        applyDamage(e, st.damage * counterMult(def, e));
      }
    }
  }
}

function endWave(){
  state.wavesCleared += 1;
  state.waveIdx += 1;
  state.score += 100;
  // 인컴 = 기본 보너스 + 보유 골드 이자 (저축 vs 투자 빌드오더 결정)
  const interest = Math.min(INTEREST_CAP, Math.floor(state.gold * INTEREST_RATE));
  const income = WAVE_BONUS + interest;
  state.gold += income;
  addFloatText(W/2, H/2 - 30, '+' + income + 'g' + (interest > 0 ? ' (이자 +' + interest + ')' : ''), '#ffd96b');
  // 15웨이브 마일스톤 — 이후 무한
  if (state.waveIdx === WAVES.length){
    state.gold += 80;
    state.score += 1000;
    addFloatText(W/2, H/2 - 52, '★ STAGE CLEAR · +80g · 무한 모드 ★', '#5cd6ea');
  }
  state.phase = 'prepare';
  waveBtn.disabled = false;
  const label = state.waveIdx >= WAVES.length ? ('웨이브 ' + (state.waveIdx + 1) + ' (∞)') : ('다음 웨이브: ' + (state.waveIdx + 1) + '/15');
  setOverlay(`
    <h2>웨이브 ${state.wavesCleared} 클리어</h2>
    <p>+${income}g${interest > 0 ? ' (이자 +' + interest + ')' : ''} · ${label}</p>
  `, false);
  setTimeout(() => {
    if (state.phase === 'prepare') {
      setOverlay(`<h2>준비 단계</h2><p>타워를 배치·업그레이드하고 <b>다음 웨이브</b>를 누르세요.</p>`, false);
    }
  }, 1500);
}

function winGame(){
  state.phase = 'won';
  state.score += state.lives * 30 + state.gold;
  SFX.win();
  finishUI(true);
}
function loseGame(){
  state.phase = 'lost';
  SFX.gameover();
  finishUI(false);
}

function finishUI(won){
  stopLoop();
  const best = loadStats();
  const isBest = state.score > best.bestScore;
  const next = {
    played: best.played + 1,
    bestScore: Math.max(best.bestScore, state.score),
    bestWave: Math.max(best.bestWave, state.wavesCleared)
  };
  saveStats(next);
  const reached = state.wavesCleared >= WAVES.length
    ? `웨이브 ${state.wavesCleared} 도달 ∞`
    : `웨이브 ${state.wavesCleared}/15`;
  setOverlay(`
    <h2>${won ? '🏆 클리어!' : '💥 게임 오버'}</h2>
    <p>${reached} · 라이프 ${Math.max(0, state.lives)} · 골드 ${state.gold}</p>
    <div class="big" style="font-size:48px; font-weight:900; color:${won ? '#5cd6ea' : '#ff7799'}; margin: 12px 0;">${state.score}</div>
    ${isBest ? '<div class="ribbon">NEW BEST</div>' : ''}
    <div style="margin-top: 16px;">
      <button class="btn primary" id="ov-again" style="margin-right: 6px;">다시</button>
      <button class="btn" id="ov-home">홈</button>
    </div>
  `, true);
  document.getElementById('ov-again').onclick = startGame;
  document.getElementById('ov-home').onclick = () => { unbindEvents(); showTitle(); };
}

/* ---------- Beams / explosions / particles / floats ---------- */
function addBeam(x1, y1, x2, y2, color, duration){
  state.beams.push({ x1, y1, x2, y2, color, life: duration, maxLife: duration });
}
function addExplosion(x, y, maxR, color){
  state.explosions.push({ x, y, r: 4, maxR, color, life: 0.35, maxLife: 0.35 });
}
function spawnKillParticles(e){
  for (let i = 0; i < 10; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 80;
    state.particles.push({
      x: e.x, y: e.y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      size: 1.5 + Math.random() * 2,
      color: e.color,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8
    });
  }
}
function addFloatText(x, y, text, color){
  state.floatTexts.push({ x, y, text, color, life: 1.0, maxLife: 1.0 });
}

/* ---------- Rendering ---------- */
// 정적 배경(그라데이션 + 격자 + 경로 채움/글로우 + 입출구) 오프스크린 캐시.
// 매 프레임 60여 개의 fillRect·18 격자선·글로우 스트로크를 그리던 것을 1회 blit로 대체.
let BG_CANVAS = null;
function buildBgCanvas(){
  const off = tdOffscreen(W, H, 1.5);   // td-core.js: DPR 캡 + ceil + 스케일 동일
  BG_CANVAS = off.canvas;
  const c = off.ctx;
  // 라디얼 그라데이션
  const bg = c.createRadialGradient(W/2, H/2, 40, W/2, H/2, 380);
  bg.addColorStop(0, '#1c0a3a');
  bg.addColorStop(0.55, '#0a0420');
  bg.addColorStop(1, '#02010a');
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);
  // 격자 라인 (한 번의 stroke로 묶음)
  c.strokeStyle = 'rgba(120,90,200,.08)';
  c.lineWidth = 1;
  c.beginPath();
  for (let x = 0; x <= COLS; x++){ c.moveTo(x * CELL, 0); c.lineTo(x * CELL, H); }
  for (let y = 0; y <= ROWS; y++){ c.moveTo(0, y * CELL); c.lineTo(W, y * CELL); }
  c.stroke();
  // 경로 셀 채움
  c.fillStyle = 'rgba(90,210,234,.10)';
  for (const [cx, cy] of PATH_CELLS) c.fillRect(cx * CELL + 1, cy * CELL + 1, CELL - 2, CELL - 2);
  // 경로 중심 글로우 라인 (shadowBlur은 1회 베이크라 비용 없음)
  c.save();
  c.shadowColor = '#5cd6ea';
  c.shadowBlur = 12;
  c.strokeStyle = 'rgba(140,230,250,.5)';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(PATH_POINTS[0].x, PATH_POINTS[0].y);
  for (let i = 1; i < PATH_POINTS.length; i++) c.lineTo(PATH_POINTS[i].x, PATH_POINTS[i].y);
  c.stroke();
  c.restore();
  // 입구/출구 마커 (정적)
  drawSpawnExit(c);
}

function render(){
  // 정적 배경 blit (한 번 빌드)
  if (!BG_CANVAS) buildBgCanvas();
  ctx.drawImage(BG_CANVAS, 0, 0, W, H);

  // 건설 포켓 힌트 (준비 단계에만 · 비어있는 고가치 자리)
  if (state.phase === 'prepare'){
    ctx.save();
    for (const key of POCKET_SET){
      const [cx, cy] = key.split(',').map(Number);
      if (state.towers.some(t => t.cx === cx && t.cy === cy)) continue;
      const px = cx * CELL + CELL / 2, py = cy * CELL + CELL / 2;
      ctx.fillStyle = 'rgba(124,255,196,.16)';
      ctx.beginPath();
      ctx.arc(px, py, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 호버 셀 + 사거리 미리보기
  if (state.placeMode && state.hoverCell){
    const c = state.hoverCell;
    const def = TOWERS[state.placeMode];
    const rng = def.lv[1].range;
    const valid = canPlace(c.cx, c.cy);
    ctx.save();
    ctx.fillStyle = valid ? 'rgba(90,210,234,.25)' : 'rgba(255,80,120,.25)';
    ctx.fillRect(c.cx * CELL, c.cy * CELL, CELL, CELL);
    ctx.strokeStyle = valid ? def.color : '#ff5577';
    ctx.lineWidth = 2;
    ctx.strokeRect(c.cx * CELL + 1, c.cy * CELL + 1, CELL - 2, CELL - 2);
    if (valid){
      ctx.beginPath();
      ctx.arc(c.cx * CELL + CELL/2, c.cy * CELL + CELL/2, rng, 0, Math.PI * 2);
      ctx.fillStyle = `${def.color}22`;
      ctx.fill();
      ctx.strokeStyle = `${def.color}88`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 선택된 타워 사거리
  if (state.selectedTower){
    const t = state.selectedTower;
    const def = TOWERS[t.type];
    ctx.save();
    ctx.beginPath();
    ctx.arc(t.x, t.y, towerStat(t).range, 0, Math.PI * 2);
    ctx.fillStyle = `${def.color}1a`;
    ctx.fill();
    ctx.strokeStyle = `${def.color}aa`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // 타워
  for (const t of state.towers){
    drawTower(t);
  }

  // 적
  for (const e of state.enemies){
    drawEnemy(e);
  }

  // beams (성능: shadowBlur 미사용 — 밝은 선 + 알파 페이드)
  for (const b of state.beams){
    const a = Math.max(0, b.life / b.maxLife);
    ctx.save();
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = 2.5 + a * 2;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
    ctx.restore();
  }

  // explosions (성능: shadowBlur 미사용)
  for (const x of state.explosions){
    const a = Math.max(0, x.life / x.maxLife);
    ctx.save();
    ctx.beginPath();
    ctx.arc(x.x, x.y, x.r, 0, Math.PI * 2);
    ctx.fillStyle = `${x.color}${Math.floor(a * 80).toString(16).padStart(2,'0')}`;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = x.color;
    ctx.globalAlpha = a;
    ctx.stroke();
    ctx.restore();
  }

  // particles (성능: shadowBlur 미사용)
  for (const p of state.particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    ctx.restore();
  }

  // float texts (성능: shadowBlur 미사용)
  for (const f of state.floatTexts){
    const a = Math.max(0, f.life / f.maxLife);
    ctx.save();
    ctx.font = '800 12px "Pretendard", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.globalAlpha = a;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  // HUD 업데이트 (더티 체크 — 같은 값 반복 쓰기 회피)
  setText(hudEls.gold, state.gold);
  setText(hudEls.lives, state.lives);
  {
    const cur = state.phase === 'wave' ? (state.waveIdx + 1) : state.wavesCleared;
    setText(hudEls.wave, state.wavesCleared >= WAVES.length ? (cur + ' ∞') : (cur + '/15'));
  }
  setText(hudEls.speed, state.paused ? '||' : state.speed + '×');
}

// 입구/출구 마커 — 배경 캐시 빌드 시 1회만 그려짐 (c = 오프스크린 컨텍스트)
function drawSpawnExit(c){
  // Spawn
  const s = PATH_POINTS[0];
  c.save();
  c.fillStyle = 'rgba(255,140,90,.6)';
  c.shadowColor = '#ff8a3c';
  c.shadowBlur = 14;
  c.beginPath();
  c.arc(s.x, s.y, 10, 0, Math.PI * 2);
  c.fill();
  c.restore();
  // Exit
  const e = PATH_POINTS[PATH_POINTS.length - 1];
  c.save();
  c.strokeStyle = '#ff5577';
  c.shadowColor = '#ff5577';
  c.shadowBlur = 14;
  c.lineWidth = 2;
  c.beginPath();
  c.arc(e.x, e.y, 10, 0, Math.PI * 2);
  c.stroke();
  c.beginPath();
  c.arc(e.x, e.y, 5, 0, Math.PI * 2);
  c.stroke();
  c.restore();
}

/* ---------- Tower sprite cache (type → offscreen, 포신 위쪽) ----------
 * 타워 본체(베이스+포신+중심점)는 종류별로 정적이라 1회 캐시 후 t.angle 회전 blit.
 * 레벨 점(본체 아래, 월드 정렬)은 동적으로 덧그림.
 */
const TOWER_S = 22;                              // 로컬 반경(포신 -20·베이스 ±11 여유)
const TOWER_SPRITES = {};
function getTowerSprite(type){
  const cached = TOWER_SPRITES[type];
  if (cached) return cached;
  const def = TOWERS[type];
  const d = Math.min(window.devicePixelRatio || 1, 1.5);
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(2 * TOWER_S * d);
  cv.height = Math.ceil(2 * TOWER_S * d);
  const c = cv.getContext('2d');
  c.scale(d, d);
  c.translate(TOWER_S, TOWER_S);
  const baseR = 11;
  // 베이스 (둥근 사각형) — 글로우는 1회 베이크
  c.shadowColor = def.color;
  c.shadowBlur = 10;
  c.fillStyle = '#1d0f3a';
  roundRect(c, -baseR, -baseR, baseR*2, baseR*2, 4);
  c.fill();
  c.strokeStyle = def.color;
  c.lineWidth = 1.5;
  roundRect(c, -baseR, -baseR, baseR*2, baseR*2, 4);
  c.stroke();
  c.shadowBlur = 0;
  // 포신 (위쪽)
  c.fillStyle = def.color;
  if (def.fire === 'beam')        c.fillRect(-2, -baseR - 6, 4, 8);
  else if (def.fire === 'aoe'){   c.beginPath(); c.arc(0, -baseR - 2, 4, 0, Math.PI * 2); c.fill(); }
  else if (def.fire === 'slow')   c.fillRect(-3, -baseR - 5, 6, 6);
  else if (def.fire === 'pierce') c.fillRect(-1.5, -baseR - 9, 3, 12);
  // 중심 점
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(0, 0, 2.5, 0, Math.PI * 2);
  c.fill();
  TOWER_SPRITES[type] = cv;
  return cv;
}

function drawTower(t){
  // 본체: 종류별 sprite를 조준 각도로 회전 blit
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.angle + Math.PI / 2);
  const spr = getTowerSprite(t.type);
  ctx.drawImage(spr, -TOWER_S, -TOWER_S, TOWER_S * 2, TOWER_S * 2);
  ctx.restore();

  // 레벨 표시 (본체 아래 작은 점 1~3개 · shadowBlur 미사용)
  if (t.level > 1){
    ctx.save();
    ctx.fillStyle = '#ffd96b';
    const gap = 4;
    const sx = t.x - ((t.level - 1) * gap) / 2;
    for (let i = 0; i < t.level; i++){
      ctx.beginPath();
      ctx.arc(sx + i * gap, t.y + 13, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- Enemy sprite cache (type → offscreen) ----------
 * neon-defense는 적 본체에 시간 애니메이션이 없어 7종 모두 정적 → 1회 캐시 후 blit.
 * runner만 이동 방향으로 회전 → +x 기준으로 캐시하고 blit 시 회전.
 * 동적 유지: 실드/HP 막대·슬로우 링(적 상태에 따라 가변).
 */
// 적 본체를 로컬 (0,0) 중심으로 그림 (caller가 translate). runner는 +x 화살표(회전은 blit 시).
function drawEnemyBodyLocal(c, type, r, color){
  c.save();
  c.shadowColor = color;
  c.shadowBlur = 10;              // 1회 베이크 → 글로우 유지
  c.fillStyle = color;
  if (type === 'grunt'){
    c.beginPath(); c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, r); c.lineTo(-r, 0); c.closePath(); c.fill();
  } else if (type === 'runner'){
    c.beginPath(); c.moveTo(r, 0); c.lineTo(-r * 0.8, r * 0.7); c.lineTo(-r * 0.3, 0); c.lineTo(-r * 0.8, -r * 0.7); c.closePath(); c.fill();
  } else if (type === 'tank' || type === 'boss'){
    c.beginPath();
    for (let i = 0; i < 6; i++){ const a = (i / 6) * Math.PI * 2; const x = Math.cos(a) * r, y = Math.sin(a) * r; if (i === 0) c.moveTo(x, y); else c.lineTo(x, y); }
    c.closePath(); c.fill();
    c.strokeStyle = '#fff'; c.globalAlpha = 0.6; c.lineWidth = type === 'boss' ? 2 : 1; c.stroke();
    if (type === 'boss'){ c.globalAlpha = 0.5; c.beginPath(); c.arc(0, 0, r + 4, 0, Math.PI * 2); c.stroke(); }
    c.globalAlpha = 1;
  } else if (type === 'swarm'){
    c.beginPath(); c.moveTo(0, -r); c.lineTo(r * 0.9, r * 0.7); c.lineTo(-r * 0.9, r * 0.7); c.closePath(); c.fill();
  } else if (type === 'shield'){
    roundRect(c, -r, -r, r * 2, r * 2, 4); c.fill();
  } else if (type === 'flyer'){
    c.save(); c.translate(0, -6);
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(-r - 3, 0); c.lineTo(r + 3, 0); c.stroke();   // 날개
    c.restore();
    c.shadowBlur = 0;            // 지면 그림자 (baked)
    c.fillStyle = 'rgba(0,0,0,.35)';
    c.beginPath(); c.ellipse(0, 4, r * 0.7, r * 0.3, 0, 0, Math.PI * 2); c.fill();
  } else {
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}
const ENEMY_SPRITES = {};
function getEnemySprite(type){
  const cached = ENEMY_SPRITES[type];
  if (cached) return cached;
  const def = ENEMIES[type];
  const r = def.r;
  const S = r + 8;                          // 반경 + 여유(보스 링 r+4 · 비행 본체 -(r+6))
  const d = Math.min(window.devicePixelRatio || 1, 1.5);
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(2 * S * d);
  cv.height = Math.ceil(2 * S * d);
  const c = cv.getContext('2d');
  c.scale(d, d);
  c.translate(S, S);
  drawEnemyBodyLocal(c, type, r, def.color);
  const rec = { canvas: cv, S };
  ENEMY_SPRITES[type] = rec;
  return rec;
}

function drawEnemy(e){
  const slowed = e.slowUntil > state.time;
  // 본체: 종류별 sprite blit (runner만 이동 방향으로 회전)
  const spr = getEnemySprite(e.type);
  if (e.type === 'runner'){
    const target = PATH_POINTS[e.pathIdx];
    const ang = target ? Math.atan2(target.y - e.y, target.x - e.x) : 0;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(ang);
    ctx.drawImage(spr.canvas, -spr.S, -spr.S, spr.S * 2, spr.S * 2);
    ctx.restore();
  } else {
    ctx.drawImage(spr.canvas, e.x - spr.S, e.y - spr.S, spr.S * 2, spr.S * 2);
  }

  // 실드 막대
  if (e.maxShield > 0 && e.shield > 0){
    const bw = e.r * 2.4, bh = 3;
    const bx = e.x - bw / 2, by = e.y - e.r - 11 - (e.flying ? 6 : 0);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#bcc6ff'; ctx.fillRect(bx, by, bw * (e.shield / e.maxShield), bh);
  }

  // 슬로우 표시
  if (slowed){
    ctx.save();
    ctx.strokeStyle = '#80e8ff';
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // HP 바
  if (e.hp < e.maxHp){
    const bw = e.r * 2.4;
    const bh = 3;
    const bx = e.x - bw / 2;
    const by = e.y - e.r - 7;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(bx, by, bw, bh);
    const f = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = f > 0.5 ? '#86d6a8' : f > 0.25 ? '#ffd96b' : '#ff7799';
    ctx.fillRect(bx, by, bw * f, bh);
  }
}

/* ---------- Loop ---------- */
function startLoop(){
  lastFrameTs = performance.now();
  rafId = requestAnimationFrame(loop);
}
function stopLoop(){
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
}
function loop(ts){
  rafId = requestAnimationFrame(loop);
  const dtRaw = Math.min(0.05, (ts - lastFrameTs) / 1000);
  lastFrameTs = ts;
  if (!state.paused && state.phase !== 'won' && state.phase !== 'lost'){
    const dt = dtRaw * state.speed;
    step(dt);
  }
  render();
  refreshPalette();
}

/* ---------- Overlay helpers ---------- */
function setOverlay(html, interactive){
  if (!overlayEl) return;
  overlayEl.innerHTML = html;
  overlayEl.classList.toggle('on', !!interactive);
}
function clearOverlay(){
  if (!overlayEl) return;
  overlayEl.innerHTML = '';
  overlayEl.classList.remove('on');
}

/* ---------- Utilities ---------- */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function pointSegDist(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const L2 = dx*dx + dy*dy || 0.0001;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L2));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function shade(hex, percent){
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  const f = percent / 100;
  const adj = (v) => Math.max(0, Math.min(255, Math.floor(v + (f >= 0 ? (255 - v) * f : v * f))));
  return '#' + [adj(r), adj(g), adj(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}

init();
window.__GAME__ = { KEY };
</script>
