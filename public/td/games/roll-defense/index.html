<!DOCTYPE html>

<head>

<style>
  *{ box-sizing:border-box; margin:0; padding:0; }

  /* 타워/슬롯 선택 시 패널이 나타나며 스크롤바가 생겨도 가로 위치가

    font-size: 12px; border:1px solid rgba(200,180,255,.25);

  }

  .stat .v{ display:block; font-size:17px; font-weight:800; color:#fff; line-height:1.1; }
  .stat.gold .v{ color:#ffd96b; }
  .stat.lives .v{ color:#ff7799; }
  .stat.wave .v{ color:#5cd6ea; }
  .stat.speed .v{ color:#c98aff; }
  .stage-wrap{
    position: relative; width: 100%; max-width: 480px; margin: 0 auto;

    width:100%; height:100%; display:block;

    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; align-items:center;

  .overlay.on{ pointer-events: auto; }
  .overlay h2{ font-size:24px; font-weight:900; margin-bottom:8px; letter-spacing:0.04em; }
  .overlay p{ opacity:.85; margin-bottom:16px; line-height:1.6; font-size:14px; max-width: 340px; }
  .controls{
    display:flex; gap:6px; margin-top:10px; flex-wrap: wrap;
  }
  .controls .btn{
    background: rgba(40,18,90,.7);
    color: #d8d0ff;
    border: 1px solid rgba(160,120,255,.3);
    border-radius: 10px;
    padding: 10px 12px; font: inherit; font-weight: 800; font-size: 13px;
    cursor: pointer; transition: all .12s;

  }
  .controls .btn.primary:hover:not(:disabled){ filter: brightness(1.12); }

  .enemy-card .stats{ color: #c0b8e4; font-size: 10px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .enemy-card .desc{ color: #9a8cd6; font-size: 10px; margin-top: 4px; line-height: 1.4; }
  .codex-close{

  .merge-panel{

  .merge-panel .sub{ font-size: 11px; color: #9a8cd6; margin-bottom: 6px; }
  .merge-preview{
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin: 8px 0 14px;

  .merge-preview-card{

  .merge-preview-card .stars{ font-size: 9px; color: #ffd96b; margin-top: 2px; }
  .merge-preview .arrow{ font-size: 18px; color: #ffd96b; font-weight: 800; padding: 0 4px; }
  .merge-option{
    display: block; width: 100%;
    background: rgba(40,18,90,.7);
    color: #d8d0ff;
    border: 1px solid rgba(200,180,255,.3);

    padding: 10px 12px;
    font: inherit; font-weight: 800;
    cursor: pointer;
    margin-bottom: 6px;

  .merge-option.convert .opt-label{ color: #c98aff; }
  .merge-option.refund  .opt-label{ color: #ffd96b; }
  .merge-cancel{

    border: 1px solid rgba(200,180,255,.3);
    border-radius: 10px; padding: 11px 12px; margin-bottom: 8px;
    cursor: pointer; font: inherit; text-align: left; transition: all .12s;
  }
  .mod-option:hover{ background: rgba(60,28,120,.95); }
  .mod-option.good{ border-color: rgba(124,200,140,.5); }
  .mod-option.risk{ border-color: rgba(255,120,150,.5); }

  .mod-icon{ font-size: 22px; flex-shrink: 0; width: 26px; text-align: center; }
  .mod-text{ flex: 1; min-width: 0; }
  .mod-text b{ display: block; color: #fff; font-size: 13px; }
  .mod-desc{ display: block; color: #c0b8e4; font-size: 11px; margin-top: 2px; }
  .mod-tag{ font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 10px; flex-shrink: 0; }
  .mod-tag-good{ background: rgba(124,200,140,.25); color: #86d6a8; }
  .mod-tag-risk{ background: rgba(255,120,150,.25); color: #ff7799; }
  .mod-tag-once{ background: rgba(255,217,107,.25); color: #ffd96b; }

  /* Tutorial guide */
  .guide-backdrop{
    position: fixed; inset: 0;
    background: rgba(0,0,0,.82);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);

  }
  .guide-backdrop.on{ display: flex; }
  .guide-panel{
    background: linear-gradient(180deg, rgba(40,18,90,.98), rgba(20,8,50,.98));

  .guide-nav{ display: flex; gap: 8px; }
  .guide-btn{

  /* Skill bar */

<a href="../../" class="nav-back">← TD</a>

<main class="shell">
  <div id="root"></div>
</main>

<div class="guide-backdrop" id="guide-backdrop">
  <div class="guide-panel" id="guide-panel"></div>

<script>
'use strict';

/* ============================================================
 * Roll Defense — Random Tower Defense
 * 8x8 slot grid, 4 kinds × 4 tiers, 3→1 merge, 15 waves
 *
 * 밸런싱은 아래 6개 객체만 손대면 됩니다:
 *   TOWER_STATS, KIND_WEIGHT, TIER_ROLL_PROB,
 *   ENEMY_STATS, WAVES, ECONOMY
 * ============================================================ */

const W = 480, H = 640;
const KEY = 'roll_defense_stats';
const META_KEY = 'roll_defense_meta';

/* ---------- Meta progression (permanent) ---------- */
const CORE_PER_SCORE = 80;   // score / 80 = cores earned
const UPGRADES = {

let audioCtx = null;
let MUTED = (function(){ try { return localStorage.getItem('roll_defense_muted') === '1'; } catch(e){ return false; } })();
let lastKillSfx = 0;

function ac(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function resumeAudio(){
  const c = ac();
  if (c && c.state === 'suspended') c.resume();
}
function toggleMute(){
  MUTED = !MUTED;
  try { localStorage.setItem('roll_defense_muted', MUTED ? '1' : '0'); } catch(e){}
  return MUTED;
}
// 단발 톤. slideTo 주면 주파수 슬라이드.
function tone(freq, dur, type, vol, slideTo){
  if (MUTED) return;
  const c = ac();
  if (!c) return;
  const t0 = c.currentTime;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
  g.gain.setValueAtTime(Math.max(0.0001, vol || 0.08), t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

function weightedPick(weights){
  const total = Object.values(weights).reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (const k in weights){
    if (r < weights[k]) return k;
    r -= weights[k];
  }
  return Object.keys(weights)[0];
}
function pickTierByProb(){
  // luck 업그레이드: 1성 확률에서 luck만큼 2성으로 이동
  const luck = (state && state.meta) ? upLevel(state.meta, 'luck') * 0.02 : 0;
  const p1 = Math.max(0, TIER_ROLL_PROB[0] - luck);
  const p2 = (TIER_ROLL_PROB[1] || 0) + luck;
  let r = Math.random();
  if (r < p1) return 1;
  r -= p1;
  if (r < p2) return 2;
  r -= p2;
  if (r < (TIER_ROLL_PROB[2] || 0)) return 3;
  return 1;
}
function statsFor(kind, tier){
  const def = TOWER_STATS[kind];
  return Object.assign({}, def.tiers[tier], {
    name: def.name, color: def.color, fire: def.fire,
    antiAir: !!def.antiAir,
    strongVs: def.strongVs || [],
    weakVs:   def.weakVs || [],
    kind, tier
  });
}

/* ---------- Counters (light) ---------- */
const COUNTER_STRONG = 1.45;   // ×1.45 데미지 (강함)
const COUNTER_WEAK   = 0.65;   // ×0.65 데미지 (약함)
function counterMult(source, enemy){
  if (!source || !enemy) return 1;
  if (source.strongVs && source.strongVs.includes(enemy.type)) return COUNTER_STRONG;
  if (source.weakVs   && source.weakVs.includes(enemy.type))   return COUNTER_WEAK;
  return 1;
}
function applyDmgVs(e, dmg, source){
  const final = dmg * counterMult(source, e);
  applyDamage(e, final);
  if (source && source.kind && state && state.stats){
    state.stats.dmgByKind[source.kind] = (state.stats.dmgByKind[source.kind] || 0) + final;
  }
}
function loadStats(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign({ played:0, bestScore:0, bestWave:0 }, JSON.parse(raw));
  } catch(e) {}
  return { played:0, bestScore:0, bestWave:0 };
}
function saveStats(s){
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {}
}
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function pointSegDist(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const L2 = dx*dx + dy*dy || 0.0001;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L2));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}

              <div class="up-icon">${u.icon}</div>
              <div class="up-info">
                <div class="up-name">${u.name} <span class="up-lv">Lv.${lv}/${u.max}</span></div>
                <div class="up-effect">${maxed ? '최대치 도달' : (lv > 0 ? u.fmt(lv) + ' → ' : '') + u.fmt(lv + 1)}</div>
              </div>
              <button class="up-buy" data-up="${key}" ${maxed || !afford ? 'disabled' : ''}>
                ${maxed ? 'MAX' : '◆ ' + cost}
              </button>
            </div>
          `;
        }).join('')}
      </div>
      <div style="color:#9a8cd6; font-size:11px; margin: 8px 0 14px; line-height:1.6;">
        코어는 게임 종료 시 점수 ÷ ${CORE_PER_SCORE} 만큼 적립됩니다. 강화는 영구 적용.
      </div>
      <button id="btn-back" style="
        background: rgba(40,18,90,.7); color:#d8d0ff;
        border: 1px solid rgba(160,120,255,.4); border-radius: 10px;
        padding: 12px; width: 100%; font-weight: 800; cursor: pointer; font-size: 13px;">
        ← 타이틀
      </button>
    </section>
  `;
  root.querySelectorAll('.up-buy[data-up]').forEach(b => {
    if (!b.disabled) b.onclick = () => buyUpgrade(b.dataset.up);
  });
  document.getElementById('btn-back').onclick = showTitle;
}

function buyUpgrade(key){
  const meta = loadMeta();
  const lv = upLevel(meta, key);
  const u = UPGRADES[key];
  if (lv >= u.max) return;
  const cost = upgradeCost(key, lv);
  if (meta.cores < cost) return;
  meta.cores -= cost;
  if (!meta.up) meta.up = {};
  meta.up[key] = lv + 1;
  saveMeta(meta);
  showUpgrades();
}

function startGame(){
  resumeAudio();
  const meta = loadMeta();
  state = {
    meta,
    gold: ECONOMY.startGold + upLevel(meta, 'gold') * 15,
    maxAlive: ECONOMY.maxAlive,
    lives: maxLivesFor(meta),
    maxLives: maxLivesFor(meta),
    leaks: 0,
    heroTokens: 0,
    legendsMade: 0,
    riftAlive: 0,
    riftBuff: null,
    riftSpeedMult: 1,
    heroPrompted: false,
    score: 0,
    waveIdx: 0,
    wavesCleared: 0,
    rollCount: 0,
    rollCost: ECONOMY.rollBaseCost,
    slots: new Array(GRID_COLS * GRID_ROWS).fill(null),
    enemies: [],
    beams: [],
    explosions: [],
    particles: [],
    floatTexts: [],
    projectiles: [],
    sweeps: [],
    spawnEntries: [],
    entryIdx: 0,
    waveState: 'between',
    betweenTimer: 2.0,
    paused: false,
    speed: 1,
    autoMerge: false,        // 기본 수동 — 합성이 진짜 결정이 되도록
    selectedSlot: -1,
    hoverSlot: -1,
    time: 0,
    codexOpen: false,
    mergeModalGroup: null,
    skillCd: { bomb: 0, freeze: 0, goldRush: 0, reroll: 0 },
    goldRushUntil: 0,
    freezeFlash: 0,
    stats: {
      kills: 0,
      dmgByKind: {},
      maxTier: 1,
      mergeCount: 0,
      skillUses: 0,
      peakField: 0
    },
    mods: { goldMult: 1, dmgMult: 1, synergyAdd: 0, skillCdMult: 1, enemyHpMult: 1, rollCostMult: 1, enemySpeedMult: 1 },
    pendingModifier: false,
    modifierPicks: null,
    modifierTimer: 0,
    activeModNames: []
  };
  buildLayout();
  bindEvents();
  startLoop();
}

function buildLayout(){
  root.innerHTML = `

      <div class="stat lives"><span class="l">LIVES</span><span class="v" id="hud-lives">20</span></div>
      <div class="stat wave"><span class="l">WAVE</span><span class="v" id="hud-wave">1/15</span></div>
      <div class="stat speed"><span class="l">SPEED</span><span class="v" id="hud-speed">1×</span></div>
    </div>
    <div class="stage-wrap">
      <canvas id="stage" width="${W}" height="${H}"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="selected-panel" id="panel"></div>
    <div class="skills" id="skill-bar"></div>
    <div class="controls">
      <button class="btn primary" id="btn-roll">뽑기 (12g)</button>
      <button class="btn" id="btn-rift" style="background:linear-gradient(180deg,#ff5577,#7a1d33); border-color:#ff5577; color:#fff; font-weight:900;">☄ 균열</button>
      <button class="btn" id="btn-hero" style="display:none; background:linear-gradient(180deg,#ffd96b,#c08a1a); border-color:#ffd96b; color:#1a0b30; font-weight:900;">👑 영웅</button>
      <button class="btn" id="btn-merge">자동합성 OFF</button>
      <button class="btn" id="btn-codex">도감</button>

    </div>
    <div class="info">
      슬롯 클릭=선택, 합성 가능 시 패널에서 분기 선택 · 단축키: R 뽑기 / M 자동합성 / P 일시 / F 배속 / C 도감 / Esc
    </div>

    </div>

  mergeBtn = document.getElementById('btn-merge');

  canvas = document.getElementById('stage');
  ctx = canvas.getContext('2d');

  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = W * dpr;
  canvas.height = H * dpr;

function buildSkillBar(){
  const bar = document.getElementById('skill-bar');
  if (!bar) return;
  bar.innerHTML = SKILL_ORDER.map(key => {
    const s = SKILLS[key];
    return `
      <button class="skill" data-skill="${key}" title="${s.desc}">
        <span class="icon">${s.icon}</span>
        <span class="lbl">${s.name}</span>
        <span class="cost">${s.cost}g</span>
        <span class="cd-overlay" id="cd-${key}" style="height:0%;"></span>
      </button>
    `;
  }).join('');
  // 성능: 매 프레임 querySelector 회피 — 빌드 시 DOM 캐시
  skillEls = {};
  for (const key of SKILL_ORDER){
    const btn = bar.querySelector(`.skill[data-skill="${key}"]`);
    btn.onclick = () => useSkill(key);
    skillEls[key] = { btn, overlay: btn.querySelector('.cd-overlay') };
  }
}

function refreshSkillBar(){
  if (!skillEls) return;
  for (const key of SKILL_ORDER){
    const s = SKILLS[key];
    const cd = state.skillCd[key] || 0;
    const refs = skillEls[key];
    if (!refs) continue;
    const ratio = cd > 0 ? cd / s.cooldown : 0;
    // 0.1% 단위로 양자화해 같은 값 반복 쓰기 방지
    setStyleProp(refs.overlay, 'height', (Math.round(ratio * 1000) / 10) + '%');
    setText(refs.overlay, cd > 0 ? cd.toFixed(1) : '');
    const ready = cd <= 0 && state.gold >= s.cost;
    setDisabled(refs.btn, !ready);
    setClass(refs.btn, 'ready', ready);
  }
}

function useSkill(key){
  if (state.paused || state.codexOpen || state.mergeModalGroup) return;
  if (state.waveState === 'won' || state.waveState === 'lost') return;
  const s = SKILLS[key];
  if (!s) return;
  if ((state.skillCd[key] || 0) > 0) return;
  if (state.gold < s.cost){
    floatAt(W/2, GRID_Y + GRID_H/2, '골드 부족', '#ff7799');
    return;
  }
  state.gold -= s.cost;
  state.skillCd[key] = s.cooldown * (1 - upLevel(state.meta, 'haste') * 0.10) * state.mods.skillCdMult;
  if (state.stats) state.stats.skillUses += 1;
  if (key === 'bomb')          { SFX.bomb(); fireBomb(); }
  else if (key === 'freeze')   { SFX.freeze(); fireFreeze(); }
  else if (key === 'goldRush') { SFX.gold(); startGoldRush(); }
  else if (key === 'reroll')   { SFX.reroll(); fireReroll(); }
}

function fireBomb(){
  const cx = (TX1 + TX2) / 2;
  const cy = (TY1 + TY2) / 2;
  addExplosion(cx, cy, BOMB_RADIUS, '#ff6b35');
  addExplosion(cx, cy, BOMB_RADIUS * 0.6, '#ffd96b');
  for (const e of state.enemies){
    if (e.dead) continue;
    const dx = e.x - cx, dy = e.y - cy;
    if (dx*dx + dy*dy < BOMB_RADIUS * BOMB_RADIUS){
      applyDamage(e, BOMB_DAMAGE);
    }
  }
  for (let i = 0; i < 40; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 50 + Math.random() * 160;
    state.particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      size: 2 + Math.random() * 4,
      color: i % 3 === 0 ? '#ffd96b' : '#ff6b35',
      life: 0.5 + Math.random() * 0.5,
      maxLife: 1.0
    });
  }
  floatAt(cx, cy - 10, '💣 BOMB', '#ff6b35');
}

function fireFreeze(){
  for (const e of state.enemies){
    if (e.dead) continue;
    e.slowUntil = state.time + FREEZE_DUR;
    e.slowFactor = FREEZE_FACTOR;
  }
  state.freezeFlash = 1.0;
  floatAt(W/2, GRID_Y + GRID_H/2, '❄ FREEZE', '#80e8ff');
}

function startGoldRush(){
  state.goldRushUntil = state.time + GOLDRUSH_DUR;
  floatAt(W/2, GRID_Y + GRID_H/2 - 20, '💰 GOLD RUSH', '#ffd96b');
}

function fireReroll(){
  const candidates = [];
  for (let i = 0; i < state.slots.length; i++){
    const t = state.slots[i];
    if (t && t.tier === 1) candidates.push(i);
  }
  let idx, oldKind = null;
  if (candidates.length > 0){
    idx = candidates[Math.floor(Math.random() * candidates.length)];
    oldKind = state.slots[idx].kind;
    state.slots[idx] = null;
  } else {
    const empties = emptySlots();
    if (empties.length === 0){
      // 환불 + cd 취소
      state.gold += SKILLS.reroll.cost;
      state.skillCd.reroll = 0;
      floatAt(W/2, GRID_Y + GRID_H/2, '대상 없음 · 환불', '#9a8cd6');
      return;
    }
    idx = empties[Math.floor(Math.random() * empties.length)];
  }
  const pool = oldKind ? KIND_ORDER.filter(k => k !== oldKind) : KIND_ORDER;
  const kind = pool[Math.floor(Math.random() * pool.length)];
  placeTowerIntoSlot(idx, kind, 1);
  state.slots[idx].flash = 0.9;
  addExplosion(state.slots[idx].x, state.slots[idx].y, 24, state.slots[idx].color);
  floatAt(state.slots[idx].x, state.slots[idx].y - 14, '→ ' + state.slots[idx].name, '#c98aff');
}

/* ============================================================
 * 균열 보스 (자발적 소환) + 영웅 토큰 — 랜타디 오마주
 * ============================================================ */
const RIFT_BUFFS = [
  { id:'frenzy',  name:'광란', desc:'모든 적 이동속도 +30%' },
  { id:'bulwark', name:'철벽', desc:'이후 등장 적 HP +40%' },
  { id:'leech',   name:'흡수', desc:'이후 등장 적 초당 회복' }
];
function canSummonRift(){
  return state && (state.waveState === 'wave' || state.waveState === 'between')
    && !state.paused && state.riftAlive < 1;
}
function summonRift(){
  if (state.waveState === 'won' || state.waveState === 'lost') return;
  if (!canSummonRift()){
    floatAt(W/2, GRID_Y + GRID_H/2, state.riftAlive >= 1 ? '균열 보스 처치 후 가능' : '지금은 불가', '#ff9bb0');
    return;
  }
  // 랜덤 광역 버프 선택
  const buff = RIFT_BUFFS[Math.floor(Math.random() * RIFT_BUFFS.length)];
  state.riftBuff = buff.id;
  state.riftSpeedMult = buff.id === 'frenzy' ? 1.3 : 1;
  state.riftAlive += 1;
  // 매우 두꺼운 보스 — 웨이브가 깊을수록 강하되 상한을 둬 후반에도 도전 가능
  const riftMult = Math.min(12, 3.2 + state.waveIdx * 0.2);
  const seg = Math.floor(Math.random() * TRACK_SEGS.length);
  spawnEnemy('boss', seg, TRACK_SEG_LEN[seg] * 0.5, { rift: true, hpMult: riftMult, rewardMult: 0 });
  SFX.bossSkill && SFX.bossSkill();
  floatAt(W/2, GRID_Y + GRID_H/2 - 14, '☄ 균열 보스 — ' + buff.name, '#ff5577');
  floatAt(W/2, GRID_Y + GRID_H/2 + 4, buff.desc, '#ff9bb0');
  refreshRiftBtn();
}
function onRiftCleanup(e){
  if (!e || !e.rift) return;
  state.riftAlive = Math.max(0, state.riftAlive - 1);
  if (state.riftAlive === 0){ state.riftBuff = null; state.riftSpeedMult = 1; }
  refreshRiftBtn();
}
function refreshRiftBtn(){
  if (!riftBtn) return;
  const active = state.riftAlive >= 1;
  const can = canSummonRift();
  setText(riftBtn, active ? '☄ 활성' : '☄ 균열');
  setDisabled(riftBtn, !can);
  setStyleProp(riftBtn, 'opacity', can ? '1' : '0.5');
}

function useHeroToken(){
  if (state.waveState === 'won' || state.waveState === 'lost') return;
  if ((state.heroTokens || 0) <= 0){
    floatAt(W/2, GRID_Y + GRID_H/2, '영웅 건설권 없음', '#9a8cd6');
    return;
  }
  const empties = emptySlots();
  if (empties.length === 0){
    floatAt(W/2, GRID_Y + GRID_H/2, '빈 슬롯 필요', '#ff7799');
    return;
  }
  state.heroTokens -= 1;
  // 확정 전설(4등급) 무작위 종류 — 좌상단 모서리부터
  const kind = weightedPick(KIND_WEIGHT);
  const idx = empties[0];
  placeTowerIntoSlot(idx, kind, LEGEND_GRADE);
  state.slots[idx].flash = 1.0;
  addExplosion(state.slots[idx].x, state.slots[idx].y, 40, gradeColor(LEGEND_GRADE));
  floatAt(state.slots[idx].x, state.slots[idx].y - 14, '👑 ' + state.slots[idx].name + ' ' + gradeName(LEGEND_GRADE), gradeColor(LEGEND_GRADE));
  SFX.merge && SFX.merge();
  refreshHeroBtn();
}
function refreshHeroBtn(){
  if (!heroBtn) return;
  const n = state.heroTokens || 0;
  setStyleProp(heroBtn, 'display', n > 0 ? '' : 'none');
  setText(heroBtn, '👑 영웅 ' + (n > 0 ? '×' + n : ''));
}

function bindEvents(){
  rollBtn.onclick = doRoll;
  mergeBtn.onclick = toggleAutoMerge;
  pauseBtn.onclick = togglePause;
  speedBtn.onclick = toggleSpeed;
  document.getElementById('btn-rift').onclick = summonRift;
  document.getElementById('btn-hero').onclick = useHeroToken;
  document.getElementById('btn-codex').onclick = openCodex;
  document.getElementById('btn-mute').onclick = () => {
    const m = toggleMute();
    document.getElementById('btn-mute').textContent = m ? '🔇' : '🔊';
  };
  document.getElementById('btn-quit').onclick = () => {
    document.removeEventListener('keydown', onKey);
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    showTitle();
  };
  document.getElementById('codex-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'codex-backdrop') closeCodex();
  });
  document.getElementById('merge-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'merge-backdrop') closeMergeModal();
  });

  document.addEventListener('keydown', onKey);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', () => { state.hoverSlot = -1; });
  canvas.addEventListener('click', onClick);
  canvas.addEventListener('touchstart', onTouch, { passive: false });
}

function onKey(e){
  if (e.code === 'KeyR'){ doRoll(); e.preventDefault(); }
  else if (e.code === 'KeyV'){ summonRift(); e.preventDefault(); }
  else if (e.code === 'KeyH'){ useHeroToken(); e.preventDefault(); }
  else if (e.code === 'KeyM'){ toggleAutoMerge(); e.preventDefault(); }
  else if (e.code === 'KeyP'){ togglePause(); e.preventDefault(); }
  else if (e.code === 'KeyF'){ toggleSpeed(); e.preventDefault(); }
  else if (e.code === 'KeyC'){ toggleCodex(); e.preventDefault(); }
  else if (e.code === 'Escape'){
    const mb = document.getElementById('merge-backdrop');
    if (mb && mb.classList.contains('on')){ closeMergeModal(); return; }
    const cb = document.getElementById('codex-backdrop');
    if (cb && cb.classList.contains('on')){ closeCodex(); return; }
    state.selectedSlot = -1;
    refreshPanel();
  }
}

function clientToLocal(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (W / r.width),
    y: (clientY - r.top) * (H / r.height)
  };
}
function localToSlot(x, y){
  if (x < GRID_X || x >= GRID_X + GRID_W || y < GRID_Y || y >= GRID_Y + GRID_H) return -1;
  const col = Math.floor((x - GRID_X) / CELL);
  const row = Math.floor((y - GRID_Y) / CELL);
  return row * GRID_COLS + col;
}

function onMove(e){
  const p = clientToLocal(e.clientX, e.clientY);
  state.hoverSlot = localToSlot(p.x, p.y);
}
function onClick(e){
  const p = clientToLocal(e.clientX, e.clientY);
  handleSlotClick(localToSlot(p.x, p.y));
}
function onTouch(e){
  if (!e.touches[0]) return;
  e.preventDefault();
  const t = e.touches[0];
  const p = clientToLocal(t.clientX, t.clientY);
  state.hoverSlot = localToSlot(p.x, p.y);
  handleSlotClick(state.hoverSlot);
}
function handleSlotClick(idx){
  if (idx < 0) return;
  if (state.waveState === 'won' || state.waveState === 'lost') return;

  if (state.selectedSlot === -1){
    // 선택 없음 → 슬롯에 타워 있으면 선택
    if (state.slots[idx]){
      state.selectedSlot = idx;
      refreshPanel();
    }
  } else {
    if (state.selectedSlot === idx){
      // 같은 슬롯 재선택 → 해제
      state.selectedSlot = -1;
    } else {
      // 다른 슬롯 → 이동 또는 스왑
      const src = state.slots[state.selectedSlot];
      const dst = state.slots[idx];
      state.slots[idx] = src;
      state.slots[state.selectedSlot] = dst;
      updateTowerPositions();
      recomputeSynergy();
      state.selectedSlot = -1;
      if (state.autoMerge) tryAutoMerge();
    }
    refreshPanel();
  }
}

/* ============================================================
 * Slot helpers
 * ============================================================ */
function slotCenter(idx){
  const col = idx % GRID_COLS;
  const row = Math.floor(idx / GRID_COLS);
  return { x: GRID_X + col * CELL + CELL / 2, y: GRID_Y + row * CELL + CELL / 2 };
}
function updateTowerPositions(){
  for (let i = 0; i < state.slots.length; i++){
    const t = state.slots[i];
    if (!t) continue;
    const c = slotCenter(i);
    t.x = c.x; t.y = c.y;
    t.slotIdx = i;
  }
}
function emptySlots(){
  const arr = [];
  for (let i = 0; i < state.slots.length; i++) if (!state.slots[i]) arr.push(i);
  return arr;
}
function placeTowerIntoSlot(idx, kind, tier){
  const c = slotCenter(idx);
  const s = statsFor(kind, tier);
  state.slots[idx] = {
    kind, tier,
    name: s.name, color: s.color, fire: s.fire,
    dmg: s.dmg, range: s.range, cd: s.cd,
    aoeRadius: s.aoeRadius, slowDur: s.slowDur, slowFactor: s.slowFactor,
    missileSpeed: s.missileSpeed,
    chains: s.chains, chainRange: s.chainRange, dmgFalloff: s.dmgFalloff,
    antiAir: !!s.antiAir,
    strongVs: s.strongVs || [], weakVs: s.weakVs || [],
    cooldown: 0,
    angle: 0,
    x: c.x, y: c.y,
    slotIdx: idx,
    flash: 0,
    synergy: 0,
    locked: false,
    priority: 'progress'
  };
  if (state && state.stats) state.stats.maxTier = Math.max(state.stats.maxTier, tier);
  recomputeSynergy();
}

/* 합성으로 등급이 오를 때 호출 — 천장(pity) 카운터.
 * 전설(4등급)을 만들 때마다 적립, LEGEND_PITY개마다 영웅 토큰 1개. */
const LEGEND_PITY = 3;   // 전설 3개 만들 때마다 확정 전설 건설권
function onTowerGradeUp(t){
  if (!t || !state) return;
  if (t.tier >= LEGEND_GRADE){
    state.legendsMade = (state.legendsMade || 0) + 1;
    if (state.legendsMade % LEGEND_PITY === 0){
      grantHeroToken('전설 ' + LEGEND_PITY + '개 달성');
    }
  }
}
function grantHeroToken(reason){
  state.heroTokens = (state.heroTokens || 0) + 1;
  floatAt(W / 2, GRID_Y + GRID_H / 2 - 30, '👑 영웅 건설권! (' + reason + ')', '#ffd96b');
  if (SFX.modifier) SFX.modifier();
  refreshHeroBtn();
}

function recomputeSynergy(){
  for (let i = 0; i < state.slots.length; i++){
    const t = state.slots[i];
    if (!t) continue;
    const col = i % GRID_COLS;
    const row = (i / GRID_COLS) | 0;
    let count = 0;
    const neighbors = [
      [col - 1, row], [col + 1, row], [col, row - 1], [col, row + 1]
    ];
    for (const [nc, nr] of neighbors){
      if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) continue;
      const n = state.slots[nr * GRID_COLS + nc];
      if (n && n.kind === t.kind) count += 1;
    }
    t.synergy = count;
  }
}

/* ============================================================
 * Roll / Merge
 * ============================================================ */
function doRoll(){
  if (state.waveState === 'won' || state.waveState === 'lost') return;
  const empties = emptySlots();
  if (empties.length === 0){
    floatAt(W/2, GRID_Y + GRID_H/2, '슬롯 가득 참', '#ff7799');
    return;
  }
  if (state.gold < state.rollCost){
    floatAt(W/2, GRID_Y + GRID_H/2, '골드 부족', '#ff7799');
    return;
  }
  state.gold -= state.rollCost;
  state.rollCount += 1;
  state.rollCost = Math.max(1, Math.floor(Math.min(
    ECONOMY.rollCostMax,
    ECONOMY.rollBaseCost + state.rollCount * ECONOMY.rollCostInc
  ) * state.mods.rollCostMult));
  const kind = weightedPick(KIND_WEIGHT);
  let tier = pickTierByProb();
  // 등급 상한 보장
  if (tier > MAX_GRADE) tier = MAX_GRADE;
  // 좌상단 모서리부터 순서대로 채움 (정렬된 배치)
  const idx = empties[0];
  placeTowerIntoSlot(idx, kind, tier);
  state.slots[idx].flash = 0.4;
  SFX.roll();
  refreshRollBtn();
  if (state.autoMerge) tryAutoMerge();
}

function findMergeGroup(kind, tier){
  // 랜타디 오마주: 같은 종류·등급 2개 → 1단 위
  const result = [];
  for (let i = 0; i < state.slots.length; i++){
    const t = state.slots[i];
    if (t && t.kind === kind && t.tier === tier && !t.locked){
      result.push(i);
      if (result.length >= 2) break;
    }
  }
  return result.length >= 2 ? result : null;
}

function canMergeTower(t){
  if (!t || t.tier >= MAX_GRADE) return false;
  return !!findMergeGroup(t.kind, t.tier);
}

function openMergeModal(kind, tier){
  const group = findMergeGroup(kind, tier);
  if (!group || tier >= MAX_GRADE) return;
  state.mergeModalGroup = { kind, tier, group };
  const def = TOWER_STATS[kind];

    <h2 style="color:${def.color};">${def.name} <span style="color:${gradeColor(tier)}">${gradeName(tier)}</span> · 합성 분기</h2>
    <div class="sub">${def.name} ${gradeName(tier)} 2장을 어떻게 처리할까?</div>
    <div class="merge-preview">
      <div class="merge-preview-card"><canvas data-prev="curr"></canvas><div class="stars">${gradeName(tier)} ×2</div></div>

    </button>

      <span class="opt-label">CONVERT — 무작위 다른 종류 ${nextName}</span>

function drawMergePreview(kind, tier){
  for (const cv of document.querySelectorAll('#merge-panel canvas[data-prev]')){
    const which = cv.dataset.prev;
    const def = TOWER_STATS[kind];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = 44 * dpr; cv.height = 44 * dpr;
    cv.style.width = '44px'; cv.style.height = '44px';
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    c.translate(22, 24);
    const useTier = which === 'curr' ? tier : (tier + 1);
    if (useTier === MAX_GRADE){
      c.save();
      c.strokeStyle = 'rgba(255,217,107,.6)';
      c.lineWidth = 1.2;
      c.shadowColor = '#ffd96b'; c.shadowBlur = 8;
      c.setLineDash([3, 3]);
      c.beginPath();
      c.arc(0, 0, 20, 0, Math.PI * 2);
      c.stroke();
      c.setLineDash([]);
      c.restore();
    }
    const t = { kind, tier: useTier, color: def.color };
    c.save();
    c.shadowColor = def.color;
    c.shadowBlur = 3 + useTier * 1.5;
    drawTowerBody(c, t);
    c.restore();
    drawTierPips(c, t);
  }
}

function closeMergeModal(){
  state.mergeModalGroup = null;
  const back = document.getElementById('merge-backdrop');
  if (back) back.classList.remove('on');
}

function performMergeAction(action){
  const m = state.mergeModalGroup;
  if (!m){ closeMergeModal(); return; }
  if (action === 'cancel'){ closeMergeModal(); return; }
  const { kind, tier, group } = m;
  const [a, b] = group;
  if (action === 'evolve'){
    state.slots[b] = null;
    placeTowerIntoSlot(a, kind, tier + 1);
    state.slots[a].flash = 0.7;
    addExplosion(state.slots[a].x, state.slots[a].y, 26, state.slots[a].color);
    floatAt(state.slots[a].x, state.slots[a].y - 10, gradeName(state.slots[a].tier), gradeColor(state.slots[a].tier));
    onTowerGradeUp(state.slots[a]);
    state.gold += ECONOMY.mergeBonusGold;
    floatAt(state.slots[a].x + 20, state.slots[a].y + 8, '+' + ECONOMY.mergeBonusGold + 'g', '#ffd96b');
  } else if (action === 'convert'){
    state.slots[b] = null;
    const others = KIND_ORDER.filter(k => k !== kind);
    const newKind = others[Math.floor(Math.random() * others.length)];
    placeTowerIntoSlot(a, newKind, tier + 1);
    state.slots[a].flash = 0.9;
    addExplosion(state.slots[a].x, state.slots[a].y, 32, state.slots[a].color);
    floatAt(state.slots[a].x, state.slots[a].y - 12, '→ ' + state.slots[a].name + ' ' + gradeName(tier + 1), '#c98aff');
    onTowerGradeUp(state.slots[a]);
    state.gold += ECONOMY.mergeBonusGold;
  } else if (action === 'refund'){
    const refund = Math.floor(towerCost(kind, tier) * 2 * refundRate(0.8));
    state.slots[a] = null;
    state.slots[b] = null;
    state.gold += refund;
    const sc = slotCenter(a);
    floatAt(sc.x, sc.y, '+' + refund + 'g', '#ffd96b');
  }
  if (action === 'evolve' || action === 'convert'){
    if (state.stats) state.stats.mergeCount += 1;
    SFX.merge();
  }
  recomputeSynergy();
  state.selectedSlot = -1;
  refreshPanel();
  closeMergeModal();
  // 자동 합성 모드면 후속 합성 시도
  if (state.autoMerge) tryAutoMerge();
}

function tryAutoMerge(){
  // 같은 kind + 같은 tier 가 2개 이상 모이면 자동 합성 (랜타디 오마주)
  let merged = false;
  let safety = 0;
  do {
    merged = false;
    // 카운트
    const buckets = {};
    for (let i = 0; i < state.slots.length; i++){
      const t = state.slots[i];
      if (!t || t.locked) continue;
      const key = t.kind + ':' + t.tier;
      if (!buckets[key]) buckets[key] = [];
      buckets[key].push(i);
    }
    for (const key in buckets){
      const idxs = buckets[key];
      if (idxs.length < 2) continue;
      const sample = state.slots[idxs[0]];
      if (sample.tier >= MAX_GRADE) continue;
      // 2개 사용 → 상위 1개
      const [a, b] = idxs;
      state.slots[b] = null;
      // 첫 슬롯 위치는 유지, 등급만 올림
      placeTowerIntoSlot(a, sample.kind, sample.tier + 1);
      state.slots[a].flash = 0.7;
      addExplosion(state.slots[a].x, state.slots[a].y, 26, state.slots[a].color);
      floatAt(state.slots[a].x, state.slots[a].y - 10, gradeName(state.slots[a].tier), gradeColor(state.slots[a].tier));
      onTowerGradeUp(state.slots[a]);
      state.gold += ECONOMY.mergeBonusGold;
      floatAt(state.slots[a].x + 20, state.slots[a].y + 8, '+' + ECONOMY.mergeBonusGold + 'g', '#ffd96b');
      if (state.stats) state.stats.mergeCount += 1;
      SFX.merge();
      merged = true;
      break; // 한 번에 한 그룹만 (다음 루프에서 다시 검사)
    }
    safety += 1;
  } while (merged && safety < 40);
  if (state.selectedSlot !== -1 && !state.slots[state.selectedSlot]){
    state.selectedSlot = -1;
    refreshPanel();
  }
}

    <div class="actions">

      <button class="btn" id="btn-lock" style="background:${t.locked ? 'rgba(255,217,107,.6)' : 'rgba(60,28,120,.7)'}; color:#fff; border-color:${t.locked ? '#ffd96b' : 'rgba(160,120,255,.4)'};">${t.locked ? '🔒 잠김' : '🔓 잠금'}</button>

  document.getElementById('btn-priority').onclick = () => {
    const cur = t.priority || 'progress';

function towerCost(kind, tier){
  // 2-merge 누적 비용: 한 등급 위 = 아래 등급 2장. base × 2^(tier-1)
  return Math.floor(ECONOMY.rollBaseCost * Math.pow(2, tier - 1));
}
function refundRate(base){
  return base + upLevel(state.meta, 'refund') * 0.08;
}
function sellSelected(){
  const idx = state.selectedSlot;
  if (idx < 0 || !state.slots[idx]) return;
  const t = state.slots[idx];
  const refund = Math.floor(towerCost(t.kind, t.tier) * refundRate(0.5));
  state.gold += refund;
  floatAt(t.x, t.y, '+' + refund + 'g', '#ffd96b');
  state.slots[idx] = null;
  state.selectedSlot = -1;
  recomputeSynergy();
  refreshPanel();
}

/* ============================================================
 * Wave / Enemy
 * ============================================================ */
function startWave(idx){
  const wave = getWaveSpec(idx);
  if (!wave) return;
  state.spawnEntries = wave.map(e => ({
    type: e[0],
    remaining: e[1],
    interval: e[2],
    timer: e[3] || 0
  }));
  state.entryIdx = 0;
  state.waveState = 'wave';
}

function getWaveSpec(idx){
  if (idx < WAVES.length) return WAVES[idx];
  return generateInfiniteWave(idx);
}

// 무한 웨이브 생성기 — WAVES 끝난 뒤 호출.
// idx = 15, 16, 17 ... 매 5번째 (subStep 4) 는 보스 wave.
// tier (5웨이브마다 ↑)로 적 수·강한 적 비율을 키운다.
function generateInfiniteWave(idx){
  const cycle = idx - WAVES.length;
  const tier  = Math.floor(cycle / 5);
  const subStep = cycle % 5;

  // 보스 웨이브 (5의 배수)
  if (subStep === 4){
    const bossCount = 1 + Math.floor(tier / 2);
    return [
      ['boss',    bossCount,       4.5, 1.0],
      ['flying',  8 + tier * 3,    0.5, 2.0],
      ['regen',   4 + tier,        1.4, 5.0]
    ];
  }

  // 일반 웨이브: 적 풀에서 가중치로 2~4종 mix
  // tier가 늘수록 강한 적 비율 상승
  const weights = {
    grunt:    30,
    runner:   25 + tier * 2,
    swift:    18 + tier * 3,
    tank:     12 + tier * 3,
    splitter:  8 + tier * 3,
    shielded:  6 + tier * 3,
    flying:    4 + tier * 4,
    regen:     3 + tier * 3
  };

  const numTypes = 2 + Math.floor(Math.random() * 3); // 2..4
  const picked = new Set();
  let safety = 0;
  while (picked.size < numTypes && safety++ < 20){
    picked.add(weightedPick(weights));
  }

  const entries = [];
  let delay = 0;
  for (const type of picked){
    const tough = ENEMY_STATS[type].hp >= 110;
    const baseCount = tough ? (4 + tier * 2) : (10 + tier * 3);
    const intervalBase = 0.55 - tier * 0.025;
    const interval = Math.max(0.18, intervalBase + Math.random() * 0.15);
    entries.push([type, baseCount, interval, delay]);
    delay += 0.8 + Math.random() * 2.2;
  }
  return entries;
}

function tickSpawns(dt){
  if (state.entryIdx >= state.spawnEntries.length) return;
  const entry = state.spawnEntries[state.entryIdx];
  entry.timer -= dt;
  if (entry.timer <= 0){
    spawnEnemy(entry.type);
    entry.remaining -= 1;
    if (entry.remaining <= 0){
      state.entryIdx += 1;
    } else {
      entry.timer = entry.interval;
    }
  }
}

function spawnEnemy(type, atSeg, atProgress, opts){
  opts = opts || {};
  const def = ENEMY_STATS[type];
  const segIdx = atSeg != null ? atSeg : 0;
  const segProgress = atProgress != null ? atProgress : 0;
  const seg = TRACK_SEGS[segIdx];
  const t = segProgress / TRACK_SEG_LEN[segIdx];

  // 무한 모드 스케일링 (16웨이브부터)
  // HP는 지수(×1.11^cycle) — 누수-목숨 체제에서 한 바퀴 안에 못 죽이면
  // 곧장 목숨을 깎으므로, 후반 벽을 명확히 세워 난이도를 끌어올린다.
  const cycle = Math.max(0, state.waveIdx - WAVES.length);
  const hpMult   = Math.pow(1.11, cycle);
  const goldMult = 1 + 0.08 * cycle;
  const regenMult = 1 + 0.10 * cycle;

  // 균열 광역 버프 (rift 보스가 살아있는 동안 새로 등장하는 적에 적용)
  const riftHp    = state.riftBuff === 'bulwark' ? 1.4 : 1;
  const riftRegen = state.riftBuff === 'leech' ? 8 : 0;

  const ehm = (state && state.mods) ? state.mods.enemyHpMult : 1;
  const localHpMult = (opts.hpMult || 1) * riftHp;
  const hp = Math.floor(def.hp * hpMult * ehm * localHpMult);
  const shield = Math.floor((def.shield || 0) * hpMult * ehm * localHpMult);

  const e = {
    type, name: def.name,
    x: seg.x1 + (seg.x2 - seg.x1) * t,
    y: seg.y1 + (seg.y2 - seg.y1) * t,
    hp, maxHp: hp,
    shield, maxShield: shield,
    speed: def.speed,
    slowUntil: 0,
    slowFactor: 1,
    r: opts.rift ? def.r + 5 : def.r,
    color: def.color,
    reward: Math.max(1, Math.floor(def.gold * goldMult * (opts.rewardMult || 1))),
    split: def.split || 0,
    flying: !!def.flying,
    boss: !!def.boss,
    rift: !!opts.rift,
    regen: (def.regen || 0) * regenMult + riftRegen,
    rushUntil: 0,
    segIdx, segProgress,
    laps: 0,
    leaked: false,
    dead: false,
    pulse: Math.random() * Math.PI * 2,
    bossAbility: def.boss ? BOSS_ABILITIES[Math.floor(Math.random() * BOSS_ABILITIES.length)] : null,
    abilityTimer: 4,
    abilityFlash: 0
  };
  state.enemies.push(e);
  return e;
}

function bossAbilityInterval(){
  return 5.0;
}

function triggerBossAbility(boss){
  const cycle = Math.max(0, state.waveIdx - WAVES.length);
  const tier = Math.floor(cycle / 5);
  const info = BOSS_ABILITY_INFO[boss.bossAbility];
  boss.abilityFlash = 0.6;
  SFX.bossSkill();
  if (boss.bossAbility === 'summon'){
    const n = 2 + Math.floor(tier / 2);
    for (let i = 0; i < n; i++){
      spawnEnemy('grunt', boss.segIdx, Math.max(0, boss.segProgress - 6 - i * 5));
    }
    addExplosion(boss.x, boss.y, 34, info.color);
  } else if (boss.bossAbility === 'heal'){
    const R = 92;
    for (const e of state.enemies){
      if (e.dead || e === boss) continue;
      const dx = e.x - boss.x, dy = e.y - boss.y;
      if (dx*dx + dy*dy < R*R){
        e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.25);
      }
    }
    boss.hp = Math.min(boss.maxHp, boss.hp + boss.maxHp * 0.05);
    addExplosion(boss.x, boss.y, R, info.color);
  } else if (boss.bossAbility === 'warden'){
    const R = 100;
    for (const e of state.enemies){
      if (e.dead || e === boss) continue;
      const dx = e.x - boss.x, dy = e.y - boss.y;
      if (dx*dx + dy*dy < R*R){
        const amt = Math.floor(e.maxHp * 0.4);
        e.shield = Math.max(e.shield, amt);
        e.maxShield = Math.max(e.maxShield, amt);
      }
    }
    addExplosion(boss.x, boss.y, R, info.color);
  } else if (boss.bossAbility === 'rush'){
    const R = 110;
    for (const e of state.enemies){
      if (e.dead) continue;
      const dx = e.x - boss.x, dy = e.y - boss.y;
      if (dx*dx + dy*dy < R*R){
        e.slowUntil = 0;
        e.rushUntil = state.time + 3;
      }
    }
    addExplosion(boss.x, boss.y, R, info.color);
  }
  floatAt(boss.x, boss.y - boss.r - 8, info.name + '!', info.color);
}

function applyDamage(e, dmg){
  if (e.shield > 0){
    const absorbed = Math.min(e.shield, dmg);
    e.shield -= absorbed;
    dmg -= absorbed;
  }
  if (dmg > 0) e.hp -= dmg;
}

function endWave(){
  state.wavesCleared += 1;
  state.gold += ECONOMY.waveBonusGold;
  state.score += 100;
  state.waveIdx += 1;
  SFX.wave();
  floatAt(W/2, GRID_Y + GRID_H/2, '+' + ECONOMY.waveBonusGold + 'g 보너스', '#ffd96b');
  // 마일스톤 보너스: 15(1st stage clear) / 25 / 50 / 100 ...
  if (state.waveIdx === WAVES.length){
    state.gold += 80;
    state.score += 1000;
    floatAt(W/2, GRID_Y + GRID_H/2 - 22, '★ STAGE 1 CLEAR · +80g ★', '#c98aff');
  } else if (state.waveIdx > 0 && state.waveIdx % 25 === 0){
    state.gold += 60;
    state.score += 500;
    floatAt(W/2, GRID_Y + GRID_H/2 - 22, '★ WAVE ' + state.waveIdx + ' · +60g ★', '#c98aff');
  }
  // 30웨이브마다 영웅 건설권 (랜타디 오마주: 30R 후 영웅 선택)
  if (state.waveIdx > 0 && state.waveIdx % 30 === 0){
    grantHeroToken('WAVE ' + state.waveIdx + ' 돌파');
  }
  // 5웨이브마다 모디파이어 선택 (게임 시작 직후 제외)
  if (state.waveIdx > 0 && state.waveIdx % 5 === 0){
    openModifierChoice();
    return;
  }
  state.waveState = 'between';
  state.betweenTimer = ECONOMY.betweenWaveSec;
}

const MODIFIER_AUTO_SEC = 25;   // 미선택 시 자동 랜덤 선택까지의 시간(초)
function openModifierChoice(){
  const pool = MODIFIERS.slice();
  const picks = [];
  for (let i = 0; i < 3 && pool.length; i++){
    picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  state.pendingModifier = true;
  state.modifierPicks = picks;
  state.modifierTimer = MODIFIER_AUTO_SEC;
  const panel = document.getElementById('mod-panel');
  panel.innerHTML = `
    <h2>웨이브 ${state.waveIdx} 보상</h2>
    <div class="mod-sub">하나를 선택하세요 — 즉시 항목 외에는 <b>영구 적용</b></div>
    ${picks.map(m => `
      <button class="mod-option ${m.tag}" data-mod="${m.id}">
        <span class="mod-icon">${m.icon}</span>
        <span class="mod-text"><b>${m.name}</b><span class="mod-desc">${m.desc}</span></span>
        <span class="mod-tag mod-tag-${m.tag}">${m.tag === 'good' ? '이득' : m.tag === 'risk' ? '위험' : '즉시'}</span>
      </button>
    `).join('')}
    <div class="mod-sub" id="mod-countdown" style="margin-top:8px; color:#9a8cd6;">⏱ ${MODIFIER_AUTO_SEC}s 후 자동 선택</div>
  `;
  document.getElementById('mod-backdrop').classList.add('on');
  panel.querySelectorAll('.mod-option').forEach(b => {
    b.onclick = () => applyModifier(b.dataset.mod);
  });
}

// 미선택 카운트다운 (loop에서 매 프레임 호출) — 0이 되면 랜덤 자동 선택
function tickModifierTimer(dt){
  if (!state.pendingModifier) return;
  state.modifierTimer -= dt;
  const el = document.getElementById('mod-countdown');
  if (state.modifierTimer <= 0){
    const picks = state.modifierPicks || MODIFIERS;
    const pick = picks[Math.floor(Math.random() * picks.length)];
    if (el) el.textContent = '⏱ 자동 선택: ' + pick.icon + ' ' + pick.name;
    applyModifier(pick.id, true);
    return;
  }
  if (el) el.textContent = '⏱ ' + Math.ceil(state.modifierTimer) + 's 후 자동 선택';
}

function applyModifier(id, auto){
  const m = MODIFIERS.find(x => x.id === id);
  if (m){
    m.apply(state);
    if (m.tag !== 'once') state.activeModNames.push(m.icon);
    floatAt(W/2, GRID_Y + GRID_H/2, (auto ? '⏱ ' : '') + m.icon + ' ' + m.name, '#ffd96b');
    SFX.modifier();
  }
  state.pendingModifier = false;
  state.modifierPicks = null;
  document.getElementById('mod-backdrop').classList.remove('on');
  state.waveState = 'between';
  state.betweenTimer = ECONOMY.betweenWaveSec;
}

function winGame(){
  state.waveState = 'won';
  // 보너스: 화면이 깨끗할수록 + 남은 골드
  const cleanBonus = Math.max(0, state.maxAlive - state.enemies.length) * 20;
  state.score += cleanBonus + state.gold;
  finishUI(true);
}
function loseGame(){
  state.waveState = 'lost';
  finishUI(false);
}

      <div style="color:#9a8cd6; margin-bottom: 4px;">${reached} · ❤ ${state.lives}/${state.maxLives}</div>

      ${isBest ? '<div class="ribbon" style="margin-bottom: 10px;">NEW BEST</div>' : ''}
      <div class="result-grid">
        <div class="stat-mini"><span>처치</span><b>${s.kills}</b></div>
        <div class="stat-mini"><span>최고 등급</span><b style="color:${gradeColor(s.maxTier)}">${gradeName(s.maxTier)}</b></div>
        <div class="stat-mini"><span>합성</span><b>${s.mergeCount}</b></div>

        <div class="stat-mini"><span>잔여 골드</span><b>${state.gold}</b></div>
      </div>
