/* ============================================================
 * Tower fire
 * ============================================================ */
function fireTower(t, target){
  const dmg = t.dmg * synergyDmgMult(t) * state.mods.dmgMult;
  if (t.fire === 'single'){
    applyDmgVs(target, dmg, t);
    addBeam(t.x, t.y, target.x, target.y, t.color, 0.13);
  } else if (t.fire === 'aoe'){
    addBeam(t.x, t.y, target.x, target.y, t.color, 0.16);
    addExplosion(target.x, target.y, t.aoeRadius, t.color);
    for (const e of state.enemies){
      if (e.dead) continue;
      if (e.flying && !t.antiAir) continue;
      const dx = e.x - target.x, dy = e.y - target.y;
      if (dx*dx + dy*dy <= t.aoeRadius * t.aoeRadius){
        applyDmgVs(e, dmg, t);
      }
    }
  } else if (t.fire === 'slow'){
    applyDmgVs(target, dmg, t);
    target.slowUntil = state.time + t.slowDur;
    target.slowFactor = t.slowFactor;
    addBeam(t.x, t.y, target.x, target.y, t.color, 0.18);
  } else if (t.fire === 'pierce'){
    const dx = Math.cos(t.angle), dy = Math.sin(t.angle);
    const ex = t.x + dx * t.range;
    const ey = t.y + dy * t.range;
    addBeam(t.x, t.y, ex, ey, t.color, 0.28);
    for (const e of state.enemies){
      if (e.dead) continue;
      const dist = pointSegDist(e.x, e.y, t.x, t.y, ex, ey);
      if (dist < e.r + 5){
        applyDmgVs(e, dmg, t);
      }
    }
  } else if (t.fire === 'sweep'){
    for (const e of state.enemies){
      if (e.dead) continue;
      if (e.flying && !t.antiAir) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      if (dx*dx + dy*dy < t.range * t.range){
        applyDmgVs(e, dmg, t);
      }
    }
    state.sweeps.push({ x: t.x, y: t.y, r: t.range, color: t.color, life: 0.22, maxLife: 0.22 });
  } else if (t.fire === 'missile'){
    const dx = target.x - t.x, dy = target.y - t.y;
    const d = Math.hypot(dx, dy) || 0.001;
    state.projectiles.push({
      x: t.x, y: t.y,
      vx: (dx / d) * t.missileSpeed,
      vy: (dy / d) * t.missileSpeed,
      speed: t.missileSpeed,
      targetRef: target,
      dmg: dmg,
      aoeRadius: t.aoeRadius,
      color: t.color,
      tier: t.tier,
      antiAir: !!t.antiAir,
      strongVs: t.strongVs, weakVs: t.weakVs,
      life: 3.5,
      trail: [],
      spin: 0
    });
  } else if (t.fire === 'chain'){
    // 체인 라이트닝: 사거리 내 다른 적으로 점프, 매 점프 dmg × dmgFalloff
    let prev = { x: t.x, y: t.y };
    let cur = target;
    let curDmg = dmg;
    const hit = new Set();
    for (let i = 0; i <= t.chains; i++){
      if (!cur) break;
      addBeam(prev.x, prev.y, cur.x, cur.y, t.color, 0.20);
      applyDmgVs(cur, curDmg, t);
      hit.add(cur);
      // 다음 적
      let next = null, bd = t.chainRange * t.chainRange;
      for (const e of state.enemies){
        if (e.dead || hit.has(e)) continue;
        if (e.flying && !t.antiAir) continue;
        const dx2 = e.x - cur.x, dy2 = e.y - cur.y;
        const d2 = dx2*dx2 + dy2*dy2;
        if (d2 <= bd){ bd = d2; next = e; }
      }
      prev = { x: cur.x, y: cur.y };
      cur = next;
      curDmg *= t.dmgFalloff;
    }
  }
}

function stepProjectiles(dt){
  for (const p of state.projectiles){
    p.life -= dt;
    // retarget if target dead
    if (!p.targetRef || p.targetRef.dead){
      let best = null, bd = 1e9;
      for (const e of state.enemies){
        if (e.dead) continue;
        if (e.flying && !p.antiAir) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < bd){ bd = d2; best = e; }
      }
      p.targetRef = best;
    }
    if (p.targetRef){
      const dx = p.targetRef.x - p.x;
      const dy = p.targetRef.y - p.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const dvx = (dx / d) * p.speed;
      const dvy = (dy / d) * p.speed;
      // homing 회전 (lerp velocity, 그 후 속도 재정규화)
      p.vx = p.vx * 0.78 + dvx * 0.22;
      p.vy = p.vy * 0.78 + dvy * 0.22;
      const sp = Math.hypot(p.vx, p.vy) || 0.001;
      p.vx = (p.vx / sp) * p.speed;
      p.vy = (p.vy / sp) * p.speed;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 7) p.trail.shift();

    // 적과 충돌 검사 → 폭발
    let exploded = false;
    for (const e of state.enemies){
      if (e.dead) continue;
      if (e.flying && !p.antiAir) continue;
      const dx = e.x - p.x, dy = e.y - p.y;
      if (dx*dx + dy*dy < (e.r + 5) * (e.r + 5)){
        exploded = true; break;
      }
    }
    if (exploded){
      addExplosion(p.x, p.y, p.aoeRadius, p.color);
      for (const e of state.enemies){
        if (e.dead) continue;
        if (e.flying && !p.antiAir) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        if (dx*dx + dy*dy < p.aoeRadius * p.aoeRadius){
          applyDmgVs(e, p.dmg, p);
        }
      }
      p.life = 0;
    }

    // 화면 밖이면 제거
    if (p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) p.life = 0;
  }
  state.projectiles = state.projectiles.filter(p => p.life > 0);
}

/* ============================================================
 * Step (game logic)
 * ============================================================ */
function step(dt){
  state.time += dt;

  if (state.waveState === 'between'){
    state.betweenTimer -= dt;
    if (state.betweenTimer <= 0){
      startWave(state.waveIdx);
    }
  } else if (state.waveState === 'wave'){
    tickSpawns(dt);
  }

  // 적 이동 (사각 루프) + regen + pulse
  for (const e of state.enemies){
    if (e.dead) continue;
    const slow = e.slowUntil > state.time ? e.slowFactor : 1;
    const rush = e.rushUntil > state.time ? 1.6 : 1;
    let remaining = e.speed * slow * rush * state.mods.enemySpeedMult * state.riftSpeedMult * dt;
    let guard = 0;
    while (remaining > 0 && guard < 8){
      const segLen = TRACK_SEG_LEN[e.segIdx];
      const left = segLen - e.segProgress;
      if (remaining < left){
        e.segProgress += remaining;
        remaining = 0;
      } else {
        remaining -= left;
        e.segIdx = (e.segIdx + 1) % TRACK_SEGS.length;
        e.segProgress = 0;
        if (e.segIdx === 0){
          // 트랙 한 바퀴 완주 = 누수 (랜타디 오마주)
          e.laps += 1;
          e.leaked = true;
          remaining = 0;
          break;
        }
      }
      guard += 1;
    }
    const seg = TRACK_SEGS[e.segIdx];
    const t = e.segProgress / TRACK_SEG_LEN[e.segIdx];
    e.x = seg.x1 + (seg.x2 - seg.x1) * t;
    e.y = seg.y1 + (seg.y2 - seg.y1) * t;

    // REGEN: 초당 N HP 회복
    if (e.regen > 0 && e.hp < e.maxHp){
      e.hp = Math.min(e.maxHp, e.hp + e.regen * dt);
    }
    e.pulse = (e.pulse || 0) + dt * 4;
  }

  // 보스 능력 (역순회 — triggerBossAbility가 spawn으로 배열 push 가능)
  for (let i = state.enemies.length - 1; i >= 0; i--){
    const e = state.enemies[i];
    if (e.dead || !e.bossAbility) continue;
    if (e.abilityFlash > 0) e.abilityFlash = Math.max(0, e.abilityFlash - dt);
    e.abilityTimer -= dt;
    if (e.abilityTimer <= 0){
      e.abilityTimer = bossAbilityInterval();
      triggerBossAbility(e);
    }
  }

  // 스킬 쿨다운 차감
  for (const key of SKILL_ORDER){
    if (state.skillCd[key] > 0){
      state.skillCd[key] = Math.max(0, state.skillCd[key] - dt);
    }
  }
  if (state.freezeFlash > 0) state.freezeFlash = Math.max(0, state.freezeFlash - dt * 1.2);

  // 누수 처리 — 트랙을 한 바퀴 완주한 적은 목숨을 깎고 이탈한다
  let lifeLoss = 0;
  for (const e of state.enemies){
    if (e.leaked && !e.dead){
      const cost = e.boss ? BOSS_LEAK : 1;
      lifeLoss += cost;
      e.dead = true;
      state.leaks += 1;
      floatAt(e.x, e.y, '-' + cost + '❤', '#ff5577');
      onRiftCleanup(e);
    }
  }
  if (lifeLoss > 0){
    state.lives -= lifeLoss;
    if (SFX.leak) SFX.leak();
    if (state.lives <= 0){
      state.lives = 0;
      state.enemies = state.enemies.filter(e => !e.dead);
      loseGame();
      return;
    }
  }

  // 사망 처리
  const newSpawns = [];
  const rushOn = state.goldRushUntil > state.time;
  const goldMult = (rushOn ? GOLDRUSH_MULT : 1) * state.mods.goldMult;
  for (const e of state.enemies){
    if (!e.dead && e.hp <= 0){
      e.dead = true;
      state.stats.kills += 1;
      SFX.kill();
      const gained = Math.max(1, Math.floor(e.reward * goldMult));
      state.gold += gained;
      state.score += e.reward;
      floatAt(e.x, e.y, '+' + gained + 'g' + (rushOn ? ' ×' : ''), rushOn ? '#fff5b0' : '#ffd96b');
      spawnKillParticles(e);
      // splitter: 죽으면 같은 위치에 grunt 2마리
      if (e.split > 0){
        for (let i = 0; i < e.split; i++){
          newSpawns.push({ type: 'grunt', segIdx: e.segIdx, segProgress: Math.max(0, e.segProgress - 6 - i * 4) });
        }
      }
      // 균열 보스 처치 보상 (리스크/리워드)
      if (e.rift){
        const bonus = 60 + state.waveIdx * 6;
        state.gold += bonus;
        state.score += 300;
        floatAt(e.x, e.y - 18, '☄ 균열 격파 +' + bonus + 'g', '#ff9bb0');
        addExplosion(e.x, e.y, 60, '#ff5577');
        grantHeroToken('균열 보스 격파');
        onRiftCleanup(e);
      }
    }
  }
  state.enemies = state.enemies.filter(e => !e.dead);
  for (const s of newSpawns) spawnEnemy(s.type, s.segIdx, s.segProgress);

  // 동시 적 수 초과 시 게임 오버
  if (state.stats) state.stats.peakField = Math.max(state.stats.peakField, state.enemies.length);
  if (state.enemies.length > state.maxAlive){
    loseGame();
    return;
  }

  // 타워 사격
  for (const t of state.slots){
    if (!t) continue;
    t.cooldown -= dt;
    if (t.flash > 0) t.flash -= dt;
    let best = null, bestVal = -Infinity;
    const totalLen = TRACK_SEG_LEN[0] + TRACK_SEG_LEN[1] + TRACK_SEG_LEN[2] + TRACK_SEG_LEN[3];
    for (const e of state.enemies){
      if (e.dead) continue;
      if (e.flying && !t.antiAir) continue; // 비행체는 anti-air 타워만 사격
      const dx = e.x - t.x, dy = e.y - t.y;
      const d2 = dx*dx + dy*dy;
      if (d2 > t.range * t.range) continue;
      let val;
      const pr = t.priority || 'progress';
      if (pr === 'weakest')      val = -e.hp;
      else if (pr === 'strongest') val = e.hp;
      else if (pr === 'closest') val = -d2;
      else { // 'progress'
        let offsetBefore = 0;
        for (let s = 0; s < e.segIdx; s++) offsetBefore += TRACK_SEG_LEN[s];
        val = e.laps * totalLen + offsetBefore + e.segProgress;
      }
      if (val > bestVal){
        bestVal = val;
        best = e;
      }
    }
    if (best){
      t.angle = Math.atan2(best.y - t.y, best.x - t.x);
      if (t.cooldown <= 0){
        fireTower(t, best);
        t.cooldown = t.cd;
      }
    }
  }

  // 이펙트 수명
  for (const b of state.beams) b.life -= dt;
  state.beams = state.beams.filter(b => b.life > 0);
  for (const x of state.explosions){
    const k = 1 - x.life / x.maxLife;
    x.r = x.maxR * Math.min(1, k * 2);
    x.life -= dt;
  }
  state.explosions = state.explosions.filter(x => x.life > 0);
  for (const p of state.particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= dt;
  }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const f of state.floatTexts){
    f.y -= 30 * dt;
    f.life -= dt;
  }
  state.floatTexts = state.floatTexts.filter(f => f.life > 0);

  // 발사체 + sweep 처리
  stepProjectiles(dt);
  for (const s of state.sweeps) s.life -= dt;
  state.sweeps = state.sweeps.filter(s => s.life > 0);

  // 웨이브 종료 검사 — 무한 모드: spawn 완료 시 항상 다음 웨이브로
  if (state.waveState === 'wave'){
    if (state.entryIdx >= state.spawnEntries.length){
      endWave();
    }
  }
}

/* ============================================================
 * Effect helpers
 * ============================================================ */
// 동시 렌더 부하 상한 (대량 처치 시 파티클·텍스트 폭주 방지)
const MAX_PARTICLES = 130, MAX_FLOATS = 36, MAX_BEAMS = 90;
function addBeam(x1, y1, x2, y2, color, duration){
  if (state.beams.length >= MAX_BEAMS) state.beams.shift();
  state.beams.push({ x1, y1, x2, y2, color, life: duration, maxLife: duration });
}
function addExplosion(x, y, maxR, color){
  state.explosions.push({ x, y, r: 4, maxR, color, life: 0.35, maxLife: 0.35 });
}
function spawnKillParticles(e){
  if (state.particles.length >= MAX_PARTICLES) return;   // 상한 초과 시 버스트 생략
  const n = state.particles.length > MAX_PARTICLES - 30 ? 4 : 8;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 80;
    state.particles.push({
      x: e.x, y: e.y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      size: 1.5 + Math.random() * 2,
      color: e.color,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8
    });
  }
}
function floatAt(x, y, text, color){
  if (state.floatTexts.length >= MAX_FLOATS) state.floatTexts.shift();
  state.floatTexts.push({ x, y, text, color, life: 1.1, maxLife: 1.1 });
}

/* ============================================================
 * Render
 * ============================================================ */
// 정적 배경(그라데이션 + 트랙 + 격자) 오프스크린 캐시 — 한 번 그려서 매 프레임 blit
let BG_CANVAS = null;
function buildBgCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  BG_CANVAS = document.createElement('canvas');
  BG_CANVAS.width = W * dpr;
  BG_CANVAS.height = H * dpr;
  const c = BG_CANVAS.getContext('2d');
  c.scale(dpr, dpr);
  // 1) 배경 그라데이션
  const bg = c.createRadialGradient(W/2, H/2, 40, W/2, H/2, 380);
  bg.addColorStop(0, '#1c0a3a');
  bg.addColorStop(0.55, '#0a0420');
  bg.addColorStop(1, '#02010a');
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);
  // 2) 루프 트랙
  drawTrack(c);
  // 3) 격자
  c.save();
  c.strokeStyle = 'rgba(180,140,255,.16)';
  c.lineWidth = 1;
  c.beginPath();
  for (let i = 0; i <= GRID_COLS; i++){
    const x = GRID_X + i * CELL;
    c.moveTo(x, GRID_Y);
    c.lineTo(x, GRID_Y + GRID_H);
  }
  for (let r = 0; r <= GRID_ROWS; r++){
    const y = GRID_Y + r * CELL;
    c.moveTo(GRID_X, y);
    c.lineTo(GRID_X + GRID_W, y);
  }
  c.stroke();
  c.strokeStyle = 'rgba(200,160,255,.4)';
  c.lineWidth = 1.5;
  c.strokeRect(GRID_X, GRID_Y, GRID_W, GRID_H);
  c.restore();
}
function render(){
  // 정적 배경 blit (매 프레임 그라데이션·트랙·격자 재그리기 회피)
  if (!BG_CANVAS) buildBgCanvas();
  ctx.drawImage(BG_CANVAS, 0, 0, W, H);

  // 호버 / 선택 슬롯
  if (state.hoverSlot >= 0){
    const c = slotCenter(state.hoverSlot);
    ctx.save();
    ctx.fillStyle = 'rgba(200,180,255,.10)';
    ctx.fillRect(c.x - CELL/2, c.y - CELL/2, CELL, CELL);
    ctx.restore();
  }
  if (state.selectedSlot >= 0){
    const c = slotCenter(state.selectedSlot);
    ctx.save();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.strokeRect(c.x - CELL/2 + 2, c.y - CELL/2 + 2, CELL - 4, CELL - 4);
    ctx.restore();
    // 사거리
    const t = state.slots[state.selectedSlot];
    if (t){
      ctx.save();
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
      ctx.fillStyle = `${t.color}15`;
      ctx.fill();
      ctx.strokeStyle = `${t.color}aa`;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  // 합성 가능 그룹 시각 (자동 합성 OFF일 때만)
  if (!state.autoMerge){
    const pulse = 0.4 + 0.5 * Math.sin(state.time * 4.5);
    const checked = new Set();
    for (const t of state.slots){
      if (!t || t.tier >= MAX_GRADE) continue;
      const key = t.kind + ':' + t.tier;
      if (checked.has(key)) continue;
      checked.add(key);
      const group = findMergeGroup(t.kind, t.tier);
      if (!group) continue;
      for (const idx of group){
        const sc = slotCenter(idx);
        ctx.save();
        ctx.strokeStyle = `rgba(255,217,107,${pulse * 0.9})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(sc.x - CELL/2 + 2, sc.y - CELL/2 + 2, CELL - 4, CELL - 4);
        ctx.restore();
      }
    }
  }

  // 타워
  for (const t of state.slots){
    if (!t) continue;
    drawTower(t);
  }

  // 적
  for (const e of state.enemies){
    drawEnemy(e);
  }

  // beams (성능: shadowBlur 미사용 — 밝은 선 + 알파 페이드로 레이저 느낌 유지)
  for (const b of state.beams){
    const a = Math.max(0, b.life / b.maxLife);
    ctx.save();
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = 2.5 + a * 2;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
    ctx.restore();
  }

  // explosions (성능: shadowBlur 미사용 — 채움+테두리로 표현)
  for (const x of state.explosions){
    const a = Math.max(0, x.life / x.maxLife);
    ctx.save();
    ctx.beginPath();
    ctx.arc(x.x, x.y, x.r, 0, Math.PI * 2);
    ctx.fillStyle = `${x.color}${Math.floor(a * 80).toString(16).padStart(2,'0')}`;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = x.color;
    ctx.globalAlpha = a;
    ctx.stroke();
    ctx.restore();
  }

  // particles (성능: shadowBlur 미사용)
  for (const p of state.particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    ctx.restore();
  }

  // missile projectiles (연기 트레일 + 미사일 본체 + 추진 화염)
  // 성능: 매 프레임 그라데이션 생성·shadowBlur 미사용 — 평면 채움으로 가볍게
  for (const p of state.projectiles){
    const tier = p.tier || 1;
    const sc = 0.9 + tier * 0.16;          // 등급이 높을수록 큰 미사일
    // 연기 트레일 (뒤로 갈수록 옅고 굵게)
    ctx.save();
    for (let i = 0; i < p.trail.length; i++){
      const a = (i + 1) / p.trail.length * 0.45;
      ctx.globalAlpha = a;
      ctx.fillStyle = i > p.trail.length - 4 ? '#fff6d8' : p.color;
      ctx.beginPath();
      ctx.arc(p.trail[i].x, p.trail[i].y, (1.6 + i * 0.3) * sc, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
    ctx.scale(sc, sc);
    // 추진 화염 (깜빡이는 꼬리, 평면)
    const flick = 0.6 + Math.random() * 0.5;
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ffb347';
    ctx.beginPath();
    ctx.moveTo(-2.4, 6);
    ctx.lineTo(0, 6 + 11 * flick);
    ctx.lineTo(2.4, 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath();
    ctx.moveTo(-1.2, 6);
    ctx.lineTo(0, 6 + 6 * flick);
    ctx.lineTo(1.2, 6);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    // 동체 (금속 캡슐)
    ctx.fillStyle = '#dfe3f5';
    roundRect(ctx, -2.6, -5, 5.2, 12, 2.2);
    ctx.fill();
    // 꼬리 날개 (핀)
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(-2.6, 3); ctx.lineTo(-5.5, 7); ctx.lineTo(-2.6, 6.5); ctx.closePath();
    ctx.moveTo(2.6, 3);  ctx.lineTo(5.5, 7);  ctx.lineTo(2.6, 6.5);  ctx.closePath();
    ctx.fill();
    // 워헤드 (탄두) + 흰 코어
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.quadraticCurveTo(3, -7, 2.6, -4);
    ctx.lineTo(-2.6, -4);
    ctx.quadraticCurveTo(-3, -7, 0, -10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -6, 1.4, 0, Math.PI * 2);
    ctx.fill();
    // 전설+ : 회전 에너지 링 (그림자 없이)
    if (tier >= LEGEND_GRADE){
      p.spin = (p.spin || 0) + 0.5;
      ctx.save();
      ctx.rotate(p.spin);
      ctx.strokeStyle = gradeColor(tier);
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    ctx.restore();
  }

  // sweep 링 (GUARD)
  for (const s of state.sweeps){
    const a = s.life / s.maxLife;
    const r = s.r * (1 - a) + 6;
    ctx.save();
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = a * 0.9;
    ctx.lineWidth = 2 + a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // float texts (성능: shadowBlur 미사용)
  for (const f of state.floatTexts){
    const a = Math.max(0, f.life / f.maxLife);
    ctx.save();
    ctx.font = '800 12px "Pretendard", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.globalAlpha = a;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  // 상단 영역에 next-wave 카운트다운 / 웨이브 인디케이터
  drawTopOverlay();

  // freeze 화면 플래시
  if (state.freezeFlash > 0){
    ctx.save();
    ctx.fillStyle = `rgba(128,232,255,${state.freezeFlash * 0.22})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // GOLD-RUSH 인디케이터
  if (state.goldRushUntil > state.time){
    const remain = state.goldRushUntil - state.time;
    ctx.save();
    ctx.fillStyle = '#ffd96b';
    ctx.font = '700 11px "Pretendard", sans-serif';
    ctx.textAlign = 'right';
    ctx.shadowColor = '#ffd96b';
    ctx.shadowBlur = 6;
    ctx.fillText('💰 RUSH ' + remain.toFixed(1) + 's', W - 8, H - 8);
    ctx.restore();
  }

  // 활성 모디파이어 (좌하단)
  if (state.activeModNames.length){
    ctx.save();
    ctx.font = '13px "Pretendard", sans-serif';
    ctx.textAlign = 'left';
    ctx.globalAlpha = 0.85;
    ctx.fillText(state.activeModNames.join(' '), 6, H - 8);
    ctx.restore();
  }

  // HUD 업데이트 (더티 체크 — 같은 값 반복 쓰기 회피)
  setText(hudEls.gold, state.gold);
  const alive = state.enemies.length;
  setText(hudEls.lives, '❤ ' + state.lives);
  const lr = state.lives / state.maxLives;
  setStyleProp(hudEls.lives, 'color', lr <= 0.25 ? '#ff5577' : (lr <= 0.5 ? '#ffd96b' : '#ff9bb0'));
  {
    const cur = state.waveState === 'wave' ? (state.waveIdx + 1) : (state.wavesCleared + (state.waveState === 'between' ? 1 : 0));
    setText(hudEls.wave, state.wavesCleared >= WAVES.length
      ? cur + ' ∞'
      : cur + '/' + WAVES.length);
  }
  setText(hudEls.speed, state.paused ? '||' : state.speed + '×');
  refreshRollBtn();
  refreshSkillBar();
  refreshRiftBtn();
  refreshHeroBtn();
}

// 정적(매 프레임 동일) → 오프스크린 캐시 빌드 시점에 1회만 호출됨
function drawTrack(c){
  // 외곽 라인
  c.save();
  c.strokeStyle = 'rgba(208,178,255,.7)';
  c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(TX1, TY1);
  c.lineTo(TX2, TY1);
  c.lineTo(TX2, TY2);
  c.lineTo(TX1, TY2);
  c.closePath();
  c.stroke();
  c.restore();

  // 트랙 진행 방향 표시 (각 변 가운데에 작은 ▶)
  c.save();
  c.fillStyle = 'rgba(255,180,220,.8)';
  const arrowSize = 4;
  drawArrow(c, (TX1 + TX2) / 2, TY1, 0, arrowSize);                 // 상변 (→)
  drawArrow(c, TX2, (TY1 + TY2) / 2, Math.PI / 2, arrowSize);       // 우변 (↓)
  drawArrow(c, (TX1 + TX2) / 2, TY2, Math.PI, arrowSize);           // 하변 (←)
  drawArrow(c, TX1, (TY1 + TY2) / 2, -Math.PI / 2, arrowSize);      // 좌변 (↑)
  c.restore();

  // 트랙 영역 살짝 채움 (적이 다닐 공간)
  c.save();
  c.fillStyle = 'rgba(140,90,220,.05)';
  c.fillRect(TX1 - 6, TY1 - 6, (TX2 - TX1) + 12, 12);
  c.fillRect(TX1 - 6, TY2 - 6, (TX2 - TX1) + 12, 12);
  c.fillRect(TX1 - 6, TY1 - 6, 12, (TY2 - TY1) + 12);
  c.fillRect(TX2 - 6, TY1 - 6, 12, (TY2 - TY1) + 12);
  c.restore();
}

function drawArrow(c, x, y, angle, size){
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.beginPath();
  c.moveTo(size, 0);
  c.lineTo(-size * 0.7, size * 0.7);
  c.lineTo(-size * 0.3, 0);
  c.lineTo(-size * 0.7, -size * 0.7);
  c.closePath();
  c.fill();
  c.restore();
}

function drawTopOverlay(){
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '800 11px "Pretendard", sans-serif';
  // 하단(트랙 아래 빈 공간)에 라벨 + 미리보기 — 트랙/격자와 겹치지 않게
  const labelY = TY2 + 22;   // 트랙 하단 아래
  if (state.waveState === 'between'){
    const t = Math.max(0, state.betweenTimer);
    ctx.fillStyle = '#c0b8e4';
    ctx.fillText(`다음 웨이브 ${state.waveIdx + 1} — ${t.toFixed(1)}s`, W/2, labelY);
    drawWavePreview(state.waveIdx, 5);
  } else if (state.waveState === 'wave'){
    const remainingSpawns = state.spawnEntries.slice(state.entryIdx).reduce((s, e) => s + e.remaining, 0);
    ctx.fillStyle = '#5cd6ea';
    ctx.fillText(`Wave ${state.waveIdx + 1} — 남은 적 ${state.enemies.length + remainingSpawns}`, W/2, labelY);
    drawWavePreview(state.waveIdx + 1, 3);
  }
  ctx.restore();
}

function drawWavePreview(startIdx, count){
  const totalW = count * 62;
  const startX = (W - totalW) / 2;
  const y = TY2 + 44;   // 트랙 하단 아래 카드 행
  for (let i = 0; i < count; i++){
    const wIdx = startIdx + i;
    const spec = getWaveSpec(wIdx);
    if (!spec) continue;
    let hasBoss = false, hasFlying = false, hasShield = false, hasRegen = false, hasSplit = false;
    let totalCount = 0;
    for (const entry of spec){
      const tp = entry[0];
      totalCount += entry[1];
      if (tp === 'boss') hasBoss = true;
      else if (tp === 'flying') hasFlying = true;
      else if (tp === 'shielded') hasShield = true;
      else if (tp === 'regen') hasRegen = true;
      else if (tp === 'splitter') hasSplit = true;
    }
    const cx = startX + i * 62 + 30;
    ctx.save();
    ctx.fillStyle = i === 0 ? 'rgba(140,90,220,.55)' : 'rgba(40,18,90,.45)';
    roundRect(ctx, cx - 28, y - 9, 56, 18, 4);
    ctx.fill();
    ctx.strokeStyle = hasBoss ? '#ff5577' : (i === 0 ? '#c98aff' : 'rgba(160,120,255,.3)');
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '800 9px "Pretendard", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`W${wIdx + 1}`, cx - 24, y + 3);
    // 위험 아이콘 (오른쪽)
    let icons = '';
    if (hasBoss) icons += '★';
    if (hasFlying) icons += '✈';
    if (hasShield) icons += '◇';
    if (hasRegen) icons += '+';
    if (hasSplit) icons += '◎';
    ctx.fillStyle = hasBoss ? '#ff5577' : (hasFlying ? '#7cc4ff' : '#9a8cd6');
    ctx.textAlign = 'right';
    ctx.fillText(icons || '·', cx + 24, y + 3);
    ctx.restore();
  }
}

function drawTower(t){
  const flash = t.flash > 0 ? 1 - (1 - t.flash) : 0;
  ctx.save();
  ctx.translate(t.x, t.y);

  // 등급 장식 (일반=민무늬 → 합성할수록 화려해짐)
  drawGradeAura(ctx, t);

  // 회전 본체 (성능: 종류·등급별 sprite 캐시 blit · guard 칼날만 동적)
  ctx.save();
  ctx.rotate(t.angle + Math.PI / 2);
  if (flash > 0){ ctx.shadowColor = t.color; ctx.shadowBlur = flash * 10; }
  const sprite = getTowerSprite(t.kind, t.tier);
  ctx.drawImage(sprite, -SPRITE_SIZE / 2, -SPRITE_SIZE / 2, SPRITE_SIZE, SPRITE_SIZE);
  if (t.kind === 'guard') drawGuardBlades(ctx, t);   // 매 프레임 회전 칼날
  ctx.restore();

  // 등급 점 (코너에 작은 별, 비회전)
  drawTierPips(ctx, t);

  // 인접 시너지 표시 (본체 외곽 골드 점 · shadowBlur 미사용)
  if (t.synergy > 0){
    ctx.save();
    ctx.fillStyle = '#ffd96b';
    for (let i = 0; i < Math.min(4, t.synergy); i++){
      const ang = (i / 4) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * 16, Math.sin(ang) * 16, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 락 표시 (점선 ring · shadowBlur 미사용)
  if (t.locked){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,217,107,.85)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 2]);
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // priority 인디케이터 (기본 progress 외에만 표시)
  if (t.priority && t.priority !== 'progress'){
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.font = '700 9px "Pretendard", sans-serif';
    ctx.textAlign = 'center';
    const icon = t.priority === 'weakest' ? '▼' : t.priority === 'strongest' ? '▲' : '◉';
    ctx.fillText(icon, 0, -19);
    ctx.restore();
  }

  ctx.restore();
}

function drawTowerBody(c, t){
  if (t.kind === 'pulse')       drawPulseBody(c, t);
  else if (t.kind === 'burst')  drawBurstBody(c, t);
  else if (t.kind === 'frost')  drawFrostBody(c, t);
  else if (t.kind === 'rail')   drawRailBody(c, t);
  else if (t.kind === 'guard')  drawGuardBody(c, t);
  else if (t.kind === 'rocket') drawRocketBody(c, t);
  else if (t.kind === 'chain')  drawChainBody(c, t);
}

/* ---------- Tower sprite cache (kind × tier → offscreen) ----------
 * 본체는 (종류, 등급) 조합에 대해 정적이므로 1회만 그려두고 blit한다.
 * 예외: guard 칼날은 매 프레임 회전 → drawGuardStatic만 캐시,
 *       회전 칼날은 drawGuardBlades 로 동적 렌더.
 */
const SPRITE_SIZE = 48;
const TOWER_SPRITES = {};
function getTowerSprite(kind, tier){
  const key = kind + ':' + tier;
  const cached = TOWER_SPRITES[key];
  if (cached) return cached;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const cv = document.createElement('canvas');
  cv.width  = SPRITE_SIZE * dpr;
  cv.height = SPRITE_SIZE * dpr;
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  c.translate(SPRITE_SIZE / 2, SPRITE_SIZE / 2);
  const def = TOWER_STATS[kind];
  const t = { kind, tier, color: def.color };
  if (kind === 'guard') drawGuardStatic(c, t);          // 정적 부분만
  else                  drawTowerBody(c, t);             // 그 외 종류는 본체 전체 정적
  TOWER_SPRITES[key] = cv;
  return cv;
}

// guard 정적 부분 (어두운 원 + 외곽선 + 흰 중심점). 칼날은 drawGuardBlades 가 담당.
function drawGuardStatic(c, t){
  c.fillStyle = '#1a0b30';
  c.beginPath(); c.arc(0, 0, 10, 0, Math.PI * 2); c.fill();
  c.strokeStyle = t.color;
  c.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  c.beginPath(); c.arc(0, 0, 10, 0, Math.PI * 2); c.stroke();
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(0, 0, 2 + t.tier * 0.3, 0, Math.PI * 2); c.fill();
}
function drawGuardBlades(c, t){
  const spin = (state ? state.time : 0) * 5;
  c.fillStyle = TOWER_STATS[t.kind].color;
  c.save();
  c.rotate(spin);
  c.beginPath();
  c.moveTo(-15 - t.tier, 0); c.lineTo(-9, -2); c.lineTo(9, -2);
  c.lineTo( 15 + t.tier, 0); c.lineTo( 9,  2); c.lineTo(-9,  2);
  c.closePath(); c.fill();
  c.restore();
  c.save();
  c.rotate(spin + Math.PI / 2);
  c.beginPath();
  c.moveTo(-15 - t.tier, 0); c.lineTo(-9, -2); c.lineTo(9, -2);
  c.lineTo( 15 + t.tier, 0); c.lineTo( 9,  2); c.lineTo(-9,  2);
  c.closePath(); c.fill();
  c.restore();
}

function drawPulseBody(ctx, t){
  // 빔 캐논: 원형 본체 + 위쪽 짧은 사각 포신 + 코어
  ctx.fillStyle = '#1a0b30';
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.stroke();
  // 포신
  ctx.fillStyle = t.color;
  ctx.fillRect(-3, -19, 6, 9);
  ctx.fillRect(-4.5, -12, 9, 3);
  // 빛나는 코어 (평면 2겹 — 매프레임 그라데이션 생성 회피)
  ctx.fillStyle = t.color;
  ctx.beginPath();
  ctx.arc(0, 0, 4 + t.tier * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2 + t.tier * 0.2, 0, Math.PI * 2);
  ctx.fill();
}

function drawBurstBody(ctx, t){
  // 박격포: 사각 본체 + 위에 둥근 포탑 + 좌우 vent
  ctx.fillStyle = '#1a0b30';
  roundRect(ctx, -12, -10, 24, 22, 3);
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  roundRect(ctx, -12, -10, 24, 22, 3);
  ctx.stroke();
  // 좌우 vent 슬릿
  ctx.fillStyle = t.color;
  ctx.fillRect(-13, -4, 2, 8);
  ctx.fillRect(11, -4, 2, 8);
  ctx.fillRect(-13, 4, 2, 4);
  ctx.fillRect(11, 4, 2, 4);
  // 위쪽 둥근 머리 (캐논볼) — 평면 2겹
  ctx.fillStyle = t.color;
  ctx.beginPath();
  ctx.arc(0, -12, 5 + t.tier * 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff5cc';
  ctx.beginPath();
  ctx.arc(0, -12, 2.4 + t.tier * 0.25, 0, Math.PI * 2);
  ctx.fill();
}

function drawFrostBody(ctx, t){
  // 결정: 다이아몬드 본체 + 안쪽 별 + 모서리 sparkle
  const r = 13;
  ctx.fillStyle = '#0e1830';
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r, 0);
  ctx.lineTo(0, r);
  ctx.lineTo(-r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  ctx.stroke();
  // 4각 별 안쪽
  ctx.fillStyle = t.color;
  ctx.beginPath();
  for (let i = 0; i < 8; i++){
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 === 0 ? 5 + t.tier * 0.4 : 2;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
  // 모서리 sparkle
  ctx.fillStyle = '#fff';
  ctx.fillRect(-1, -r - 1, 2, 2);
  ctx.fillRect(r - 1, -1, 2, 2);
  ctx.fillRect(-1, r - 1, 2, 2);
  ctx.fillRect(-r - 1, -1, 2, 2);
}

function drawRailBody(ctx, t){
  // 레일건: 긴 직사각 본체 + 양 옆 보조 라인 + 끝 점
  ctx.fillStyle = '#1a0b30';
  roundRect(ctx, -7, -16, 14, 28, 2);
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  roundRect(ctx, -7, -16, 14, 28, 2);
  ctx.stroke();
  // 양 옆 가이드 라인
  ctx.fillStyle = t.color;
  ctx.fillRect(-10, -10, 1.5, 16);
  ctx.fillRect(8.5, -10, 1.5, 16);
  // 끝 점 (총구)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, -16, 2.5 + t.tier * 0.3, 0, Math.PI * 2);
  ctx.fill();
  // 가운데 라인
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(0, 10);
  ctx.stroke();
}

function drawGuardBody(c, t){
  // 본체 (어두운 원) + 회전하는 두 칼날
  c.fillStyle = '#1a0b30';
  c.beginPath();
  c.arc(0, 0, 10, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = t.color;
  c.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  c.beginPath();
  c.arc(0, 0, 10, 0, Math.PI * 2);
  c.stroke();
  // 회전 칼날 (시간 기반, 게임 안에서만 회전)
  const spin = (state ? state.time : 0) * 5;
  c.save();
  c.rotate(spin);
  c.fillStyle = t.color;
  // 가로 칼날
  c.beginPath();
  c.moveTo(-15 - t.tier, 0);
  c.lineTo(-9, -2);
  c.lineTo(9, -2);
  c.lineTo(15 + t.tier, 0);
  c.lineTo(9, 2);
  c.lineTo(-9, 2);
  c.closePath();
  c.fill();
  c.restore();
  c.save();
  c.rotate(spin + Math.PI / 2);
  c.fillStyle = t.color;
  c.beginPath();
  c.moveTo(-15 - t.tier, 0);
  c.lineTo(-9, -2);
  c.lineTo(9, -2);
  c.lineTo(15 + t.tier, 0);
  c.lineTo(9, 2);
  c.lineTo(-9, 2);
  c.closePath();
  c.fill();
  c.restore();
  // 중심 점
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(0, 0, 2 + t.tier * 0.3, 0, Math.PI * 2);
  c.fill();
}

function drawRocketBody(c, t){
  // 박스 본체 + 위에 미사일 머리 (포인티드 화살표) + 측면 스태빌라이저 + 등급 배지
  c.fillStyle = '#1a0b30';
  roundRect(c, -10, -8, 20, 22, 3);
  c.fill();
  c.strokeStyle = t.color;
  c.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  roundRect(c, -10, -8, 20, 22, 3);
  c.stroke();
  // 미사일 머리 (위쪽)
  c.fillStyle = t.color;
  c.beginPath();
  c.moveTo(0, -18);
  c.lineTo(6, -8);
  c.lineTo(-6, -8);
  c.closePath();
  c.fill();
  // 측면 stabilizer 핀
  c.fillRect(-12, -4, 2, 10);
  c.fillRect(10, -4, 2, 10);
  // 작은 launch dot (총구)
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(0, -8, 2 + t.tier * 0.4, 0, Math.PI * 2);
  c.fill();
  // 본체 가운데에 등급 점
  c.fillStyle = t.color;
  c.beginPath();
  c.arc(0, 4, 2.5, 0, Math.PI * 2);
  c.fill();
}

function drawChainBody(c, t){
  // 원 본체 + 위쪽 번개 모양 + 내부 코어
  c.fillStyle = '#1a0b30';
  c.beginPath();
  c.arc(0, 0, 11, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = t.color;
  c.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  c.beginPath();
  c.arc(0, 0, 11, 0, Math.PI * 2);
  c.stroke();
  // 위쪽 번개 지그재그
  c.strokeStyle = t.color;
  c.lineWidth = 2;
  c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(0, -10);
  c.lineTo(3, -14);
  c.lineTo(-2, -17);
  c.lineTo(2, -22);
  c.stroke();
  // 작은 측면 점 (테슬라 코일 느낌)
  c.fillStyle = t.color;
  c.beginPath();
  c.arc(-9, 6, 1.8, 0, Math.PI * 2);
  c.arc( 9, 6, 1.8, 0, Math.PI * 2);
  c.fill();
  // 코어 (평면 2겹)
  c.fillStyle = t.color;
  c.beginPath();
  c.arc(0, 0, 3 + t.tier * 0.4, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(0, 0, 1.6 + t.tier * 0.2, 0, Math.PI * 2);
  c.fill();
}

// 작은 별/스파클
function drawStar(c, cx, cy, spikes, outer, inner){
  c.beginPath();
  for (let i = 0; i < spikes * 2; i++){
    const r = i % 2 === 0 ? outer : inner;
    const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath();
  c.fill();
}

// 등급 오라: 일반(1)=장식 없음 → 합성할수록 링·궤도점·후광·왕관으로 화려해짐
// 성능: shadowBlur·매프레임 그라데이션 미사용 (타워 수가 많아도 가볍게)
function drawGradeAura(ctx, t){
  const tier = t.tier;
  if (tier < 2) return;                 // 일반: 민무늬
  const col = gradeColor(tier);
  const time = state ? state.time : 0;

  // 1) 등급 링 (희귀+) — 등급 오를수록 두껍고 밝게
  ctx.save();
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.55 + (tier - 2) * 0.1;
  ctx.lineWidth = 1 + (tier - 1) * 0.6;
  ctx.beginPath();
  ctx.arc(0, 0, 15.5 + tier * 0.4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 2) 회전 점선 후광 (전설+)
  if (tier >= LEGEND_GRADE){
    ctx.save();
    ctx.rotate(time * 1.4);
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = tier >= MAX_GRADE ? 2 : 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 21, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // 3) 궤도 점 (영웅=3 · 전설=4 · 신=6, 천천히 회전)
  const studs = tier >= MAX_GRADE ? 6 : tier === LEGEND_GRADE ? 4 : tier === 3 ? 3 : 0;
  if (studs > 0){
    ctx.save();
    ctx.rotate(-time * 0.8);
    ctx.fillStyle = col;
    const orad = 18 + tier * 0.6;
    for (let i = 0; i < studs; i++){
      const a = (i / studs) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * orad, Math.sin(a) * orad, tier >= MAX_GRADE ? 2.2 : 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 4) 신(5): 펄스 글로우(단순 알파 원) + 별 왕관
  if (tier >= MAX_GRADE){
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    ctx.save();
    ctx.globalAlpha = 0.10 + pulse * 0.12;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#fff';
    drawStar(ctx, 0, -22, 4, 3.5 + pulse, 1.6);
    ctx.restore();
  }
}

function drawTierPips(ctx, t){
  // 본체 아래쪽에 작은 점 1~5개 (등급 표시) — 등급 색
  ctx.save();
  ctx.shadowBlur = 0;
  const pips = t.tier;
  const gap = 3.4;
  const startX = -((pips - 1) * gap) / 2;
  const col = gradeColor(t.tier);
  for (let i = 0; i < pips; i++){
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(startX + i * gap, 17, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e){
  // 보스 능력 오라 ring + 이름
  if (e.bossAbility){
    const info = BOSS_ABILITY_INFO[e.bossAbility];
    const flashR = e.abilityFlash > 0 ? 24 * e.abilityFlash : 0;
    const pulseR = e.r + 7 + Math.sin(state.time * 3) * 3 + flashR;
    ctx.save();
    ctx.strokeStyle = info.color;
    ctx.globalAlpha = 0.45 + (e.abilityFlash > 0 ? 0.45 : 0.15);
    ctx.lineWidth = 2;
    ctx.shadowColor = info.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(e.x, e.y, pulseR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = info.color;
    ctx.font = '800 9px "Pretendard", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 3;
    ctx.fillText('★' + info.name, e.x, e.y - e.r - 12);
    ctx.restore();
  }

  // 에셋 PNG가 있으면 그것으로 대체 (없으면 절차 드로잉)
  if (ENEMY_IMG[e.type]){
    const img = ENEMY_IMG[e.type];
    const s = e.r * 2.6;
    ctx.drawImage(img, e.x - s/2, e.y - s/2, s, s);
  } else {
    drawEnemyShape(ctx, e.x, e.y, e.type, e.color, e.r, state.time);
    drawEnemyEyes(ctx, e);
  }

  // rush 가속 인디케이터
  if (e.rushUntil > state.time){
    ctx.save();
    ctx.strokeStyle = '#ffd96b';
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 슬로우 인디케이터
  if (e.slowUntil > state.time){
    ctx.save();
    ctx.strokeStyle = '#80e8ff';
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // shielded — 보호막 시각 (shadowBlur 미사용)
  if (e.maxShield > 0 && e.shield > 0){
    ctx.save();
    ctx.strokeStyle = '#9ab0ff';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.4 + 0.5 * (e.shield / e.maxShield);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // HP 바 (+ shield 바)
  if (e.hp < e.maxHp || (e.maxShield > 0 && e.shield < e.maxShield)){
    const bw = e.r * 2.6;
    const bh = 3;
    const bx = e.x - bw / 2;
    const by = e.y - e.r - 8;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(bx, by, bw, bh);
    const f = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = f > 0.5 ? '#86d6a8' : f > 0.25 ? '#ffd96b' : '#ff7799';
    ctx.fillRect(bx, by, bw * f, bh);
    if (e.maxShield > 0){
      const sf = Math.max(0, e.shield / e.maxShield);
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(bx, by - bh - 1, bw, bh);
      ctx.fillStyle = '#9ab0ff';
      ctx.fillRect(bx, by - bh - 1, bw * sf, bh);
    }
  }
}

// 적에 눈을 그려 "캐릭터" 느낌을 준다 (절차 드로잉 폴백용).
function drawEnemyEyes(c, e){
  const x = e.x, y = e.y, r = e.r;
  c.save();
  if (e.type === 'boss'){
    // 외눈 — 화난 큰 눈
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(x, y, r * 0.34, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#c01030';
    c.beginPath(); c.arc(x, y + Math.sin(state.time * 2) * 1.5, r * 0.17, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)';
    c.beginPath(); c.arc(x - r * 0.08, y - r * 0.08, r * 0.05, 0, Math.PI * 2); c.fill();
  } else if (e.type === 'flying' || e.type === 'runner'){
    // 방향성 모양 — 앞쪽 눈 1개
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(x + r * 0.12, y - r * 0.04, r * 0.18, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#0a0420';
    c.beginPath(); c.arc(x + r * 0.16, y - r * 0.02, r * 0.09, 0, Math.PI * 2); c.fill();
  } else {
    // 일반 — 눈 2개 + 하이라이트
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(x - r * 0.30, y - r * 0.05, r * 0.20, 0, Math.PI * 2);
    c.arc(x + r * 0.30, y - r * 0.05, r * 0.20, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#0a0420';
    c.beginPath();
    c.arc(x - r * 0.27, y - r * 0.02, r * 0.10, 0, Math.PI * 2);
    c.arc(x + r * 0.33, y - r * 0.02, r * 0.10, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.beginPath();
    c.arc(x - r * 0.31, y - r * 0.08, r * 0.04, 0, Math.PI * 2);
    c.arc(x + r * 0.29, y - r * 0.08, r * 0.04, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}

function drawEnemyShape(c, x, y, type, color, r, time){
  // 성능: 적은 화면에 다수 존재 → shadowBlur 미사용 (밝은 채움색으로 충분히 보임)
  c.save();
  c.fillStyle = color;
  c.translate(x, y);
  if (type === 'grunt'){
    // 마름모 + 가운데 점
    c.beginPath();
    c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, r); c.lineTo(-r, 0);
    c.closePath();
    c.fill();
    c.fillStyle = '#fff';
    c.fillRect(-1, -1, 2, 2);
  } else if (type === 'runner'){
    // 화살촉
    c.beginPath();
    c.moveTo(r, 0);
    c.lineTo(-r * 0.7, r * 0.8);
    c.lineTo(-r * 0.2, 0);
    c.lineTo(-r * 0.7, -r * 0.8);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(r * 0.5, 0); c.lineTo(-r * 0.2, 0);
    c.stroke();
  } else if (type === 'tank'){
    // 두꺼운 육각형 + 십자선
    c.beginPath();
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * Math.PI * 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(-r * 0.6, 0); c.lineTo(r * 0.6, 0);
    c.moveTo(0, -r * 0.6); c.lineTo(0, r * 0.6);
    c.stroke();
  } else if (type === 'swift'){
    // 길쭉한 다이아 + 양 옆 작은 핀
    c.beginPath();
    c.moveTo(r, 0);
    c.lineTo(0, r * 0.6);
    c.lineTo(-r * 0.7, 0);
    c.lineTo(0, -r * 0.6);
    c.closePath();
    c.fill();
    c.fillRect(-r * 0.4, -r * 0.9, 2, 4);
    c.fillRect(-r * 0.4, r * 0.5, 2, 4);
  } else if (type === 'splitter'){
    // 안에 작은 두 원이 보이는 큰 원
    c.beginPath();
    c.arc(0, 0, r, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#1a0b30';
    c.beginPath();
    c.arc(-r * 0.4, 0, r * 0.32, 0, Math.PI * 2);
    c.arc(r * 0.4, 0, r * 0.32, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = color;
    c.beginPath();
    c.arc(-r * 0.4, 0, r * 0.2, 0, Math.PI * 2);
    c.arc(r * 0.4, 0, r * 0.2, 0, Math.PI * 2);
    c.fill();
  } else if (type === 'shielded'){
    // 사각 + 안에 방패 모양
    c.fillRect(-r * 0.9, -r * 0.9, r * 1.8, r * 1.8);
    c.fillStyle = '#1a0b30';
    c.beginPath();
    c.moveTo(0, -r * 0.6);
    c.lineTo(r * 0.5, -r * 0.2);
    c.lineTo(r * 0.5, r * 0.3);
    c.lineTo(0, r * 0.55);
    c.lineTo(-r * 0.5, r * 0.3);
    c.lineTo(-r * 0.5, -r * 0.2);
    c.closePath();
    c.fill();
  } else if (type === 'flying'){
    // 본체: 위쪽으로 들린 화살촉 + 아래쪽 그림자 (떠있는 느낌)
    c.save();
    c.translate(0, -2);
    c.beginPath();
    c.moveTo(r, 0);
    c.lineTo(-r * 0.6, r * 0.7);
    c.lineTo(-r * 0.15, 0);
    c.lineTo(-r * 0.6, -r * 0.7);
    c.closePath();
    c.fill();
    // 위쪽 작은 글로우 점 (날개 끝)
    c.fillStyle = 'rgba(255,255,255,.55)';
    c.beginPath();
    c.arc(-r * 0.5, -r * 0.55, 1.5, 0, Math.PI * 2);
    c.arc(-r * 0.5,  r * 0.55, 1.5, 0, Math.PI * 2);
    c.fill();
    c.restore();
    // 그림자 (그라운드 아래 작은 타원)
    c.shadowBlur = 0;
    c.fillStyle = 'rgba(0,0,0,.45)';
    c.beginPath();
    c.ellipse(0, r + 5, r * 0.55, 1.6, 0, 0, Math.PI * 2);
    c.fill();
  } else if (type === 'regen'){
    // 큰 원 + 회전 십자(+)
    c.beginPath();
    c.arc(0, 0, r, 0, Math.PI * 2);
    c.fill();
    const spin = time * 1.2;
    c.save();
    c.rotate(spin);
    c.fillStyle = '#fff';
    c.fillRect(-r * 0.65, -1.5, r * 1.3, 3);
    c.fillRect(-1.5, -r * 0.65, 3, r * 1.3);
    c.restore();
    // 박동하는 외곽 ring
    const pulseA = 0.4 + 0.4 * Math.sin(time * 3);
    c.strokeStyle = '#fff';
    c.globalAlpha = pulseA;
    c.lineWidth = 1;
    c.beginPath();
    c.arc(0, 0, r + 2, 0, Math.PI * 2);
    c.stroke();
    c.globalAlpha = 1;
  } else if (type === 'boss'){
    // 회전 별 + 안쪽 코어
    c.rotate(time * 0.6);
    c.beginPath();
    for (let i = 0; i < 10; i++){
      const ang = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const rr = i % 2 === 0 ? r : r * 0.55;
      const px = Math.cos(ang) * rr;
      const py = Math.sin(ang) * rr;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
    c.strokeStyle = '#fff';
    c.lineWidth = 1.5;
    c.stroke();
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(0, 0, r * 0.25, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}

/* ============================================================
 * Loop
 * ============================================================ */
function startLoop(){
  lastFrameTs = performance.now();
  rafId = requestAnimationFrame(loop);
}
function loop(ts){
  rafId = requestAnimationFrame(loop);
  const dtRaw = Math.min(0.05, (ts - lastFrameTs) / 1000);
  lastFrameTs = ts;
  // 보상 모달이 떠 있으면 자동 선택 카운트다운 (일시정지 중엔 멈춤)
  if (state.pendingModifier && !state.paused){
    tickModifierTimer(dtRaw);
  }
  const blocked = state.paused || state.codexOpen || state.mergeModalGroup || state.pendingModifier
    || state.waveState === 'won' || state.waveState === 'lost';
  if (!blocked){
    const dt = dtRaw * state.speed;
    step(dt);
  }
  render();
}

/* ============================================================
 * Codex (도감)
 * ============================================================ */
function toggleCodex(){
  const cb = document.getElementById('codex-backdrop');
  if (!cb) return;
  if (cb.classList.contains('on')) closeCodex();
  else openCodex();
}
function openCodex(){
  state.codexOpen = true;
  const panel = document.getElementById('codex-panel');
  panel.innerHTML = buildCodexHTML();
  document.getElementById('codex-backdrop').classList.add('on');
  drawCodexPreviews();
  document.getElementById('codex-close-btn').onclick = closeCodex;
}
function closeCodex(){
  state.codexOpen = false;
  document.getElementById('codex-backdrop').classList.remove('on');
}
function describeFire(f){
  return ({
    single: '단일 빔',
    aoe: '광역 폭발',
    slow: '단일 + 슬로우',
    pierce: '관통 라인',
    sweep: '고속 외곽 sweep',
    missile: '추적 미사일',
    chain: '체인 라이트닝'
  })[f] || f;
}
function buildCodexHTML(){
  let html = '<h2>도감 & 합성표</h2>';
  html += `<div class="lead">같은 종류 + 같은 등급 <b>2개 → 1단 위</b>로 합성 (등급당 공격력 ×2). 5등급: ${GRADE_NAMES.slice(1).map((n,i)=>`<span style="color:${GRADE_COLORS[i+1]}">${n}</span>`).join(' → ')}.</div>`;

  html += '<h3>합성 체인 · 종류별 시너지</h3>';
  for (const kind of KIND_ORDER){
    const def = TOWER_STATS[kind];
    const synBonus = (KIND_SYNERGY[kind] && KIND_SYNERGY[kind].dmg) || ADJ_BONUS_PER;
    const aa = def.antiAir ? ' <span style="color:#7cc4ff; font-size:9px; margin-left:4px;">AA</span>' : '';
    const cs = (def.strongVs || []).map(k => ENEMY_STATS[k].name).join(',');
    const cw = (def.weakVs || []).map(k => ENEMY_STATS[k].name).join(',');
    html += `<div style="margin-top: 6px;"><span style="color:${def.color}; font-weight:800; letter-spacing:.06em;">${def.name}</span>` +
      ` <span style="color:#9a8cd6; font-size:11px;">— ${describeFire(def.fire)}</span>${aa}` +
      ` <span style="color:#ffd96b; font-size:10px; margin-left:6px;">· 시너지 +${Math.round(synBonus*100)}%/인접</span></div>`;
    if (cs || cw){
      html += `<div style="font-size:10px; margin-top:2px;">`;
      if (cs) html += `<span style="color:#86d6a8">💪 ${cs}</span> `;
      if (cw) html += `<span style="color:#ff7799">🔻 ${cw}</span>`;
      html += `</div>`;
    }
    html += '<div class="tower-chain">';
    for (let tier = 1; tier <= MAX_GRADE; tier++){
      const s = def.tiers[tier];
      const extra = def.fire === 'aoe' && s.aoeRadius ? `<br>aoe ${s.aoeRadius}` :
                     def.fire === 'slow' ? `<br>${Math.round((1 - s.slowFactor)*100)}% ${s.slowDur}s` :
                     def.fire === 'missile' ? `<br>aoe ${s.aoeRadius}` :
                     def.fire === 'sweep' ? `<br>sweep all` :
                     def.fire === 'chain' ? `<br>${s.chains} jumps · ${(s.dmgFalloff*100)|0}%` : '';
      html += `<div class="tower-card-mini">
        <canvas data-tower="${kind}-${tier}"></canvas>
        <div class="lbl" style="color:${gradeColor(tier)}">${gradeName(tier)}</div>
        <div class="sub">${s.dmg}d · ${s.range}r${extra}</div>
      </div>`;
      if (tier < MAX_GRADE) html += '<div class="chain-arrow">×2</div>';
    }
    html += '</div>';
  }

  html += '<h3>적 도감</h3>';
  html += '<div class="enemy-grid">';
  for (const key in ENEMY_STATS){
    const def = ENEMY_STATS[key];
    const shieldStr = def.shield ? ` +${def.shield}🛡` : '';
    html += `<div class="enemy-card">
      <canvas data-enemy="${key}"></canvas>
      <div class="name" style="color:${def.color}">${def.name}</div>
      <div class="stats">HP ${def.hp}${shieldStr} · ${def.speed}px/s · +${def.gold}g</div>
      <div class="desc">${def.desc}</div>
    </div>`;
  }
  html += '</div>';

  html += '<h3>뽑기 확률</h3>';
  const totalW = Object.values(KIND_WEIGHT).reduce((a, b) => a + b, 0);
  html += '<div class="lead">';
  html += '<b>등급</b>: ';
  html += TIER_ROLL_PROB.map((p, i) => `${i+1}★ ${(p*100).toFixed(0)}%`).filter(s => !s.endsWith('0%')).join(' · ');
  html += '<br><b>종류</b>: ';
  html += KIND_ORDER.map(k => `${TOWER_STATS[k].name} ${(KIND_WEIGHT[k]/totalW*100).toFixed(0)}%`).join(' · ');
  html += '</div>';

  html += '<button class="codex-close" id="codex-close-btn">닫기 (Esc / C)</button>';
  return html;
}
function drawCodexPreviews(){
  // 타워 미리보기
  for (const cv of document.querySelectorAll('canvas[data-tower]')){
    const [kind, tierStr] = cv.dataset.tower.split('-');
    const tier = parseInt(tierStr, 10);
    const def = TOWER_STATS[kind];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = 56 * dpr; cv.height = 56 * dpr;
    cv.style.width = '56px'; cv.style.height = '56px';
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    c.translate(28, 30);
    if (tier >= LEGEND_GRADE){
      c.save();
      c.strokeStyle = gradeColor(tier);
      c.globalAlpha = 0.6;
      c.lineWidth = 1.5;
      c.shadowColor = gradeColor(tier);
      c.shadowBlur = 10;
      c.setLineDash([3, 3]);
      c.beginPath();
      c.arc(0, 0, 22, 0, Math.PI * 2);
      c.stroke();
      c.setLineDash([]);
      c.restore();
    }
    const t = { kind, tier, color: def.color };
    c.save();
    c.shadowColor = def.color;
    c.shadowBlur = 4 + tier * 1.5;
    drawTowerBody(c, t);
    c.restore();
    drawTierPips(c, t);
  }
  // 적 미리보기
  for (const cv of document.querySelectorAll('canvas[data-enemy]')){
    const key = cv.dataset.enemy;
    const def = ENEMY_STATS[key];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = 48 * dpr; cv.height = 48 * dpr;
    cv.style.width = '48px'; cv.style.height = '48px';
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    drawEnemyShape(c, 24, 24, key, def.color, def.r, 0);
    // shielded일 경우 보호막 원
    if (def.shield){
      c.save();
      c.strokeStyle = '#9ab0ff';
      c.lineWidth = 1.5;
      c.shadowColor = '#9ab0ff';
      c.shadowBlur = 6;
      c.beginPath();
      c.arc(24, 24, def.r + 3, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
  }
}

/* ============================================================
 * Overlay helpers
 * ============================================================ */
function setOverlay(html, interactive){
  if (!overlayEl) return;
  overlayEl.innerHTML = html;
  overlayEl.classList.toggle('on', !!interactive);
}
function clearOverlay(){
  if (!overlayEl) return;
  overlayEl.innerHTML = '';
  overlayEl.classList.remove('on');
}

init();
window.__GAME__ = { KEY };
</script>
