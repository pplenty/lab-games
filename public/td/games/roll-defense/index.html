<script>
'use strict';

/* ============================================================
 * Roll Defense — Random Tower Defense
 * 8x8 slot grid, 4 kinds × 4 tiers, 3→1 merge, 15 waves
 *
 * 밸런싱은 아래 6개 객체만 손대면 됩니다:
 *   TOWER_STATS, KIND_WEIGHT, TIER_ROLL_PROB,
 *   ENEMY_STATS, WAVES, ECONOMY
 * ============================================================ */

const W = 480, H = 640;
const KEY = 'roll_defense_stats';

/* ---------- Layout ---------- */
const CELL = 44;
const GRID_COLS = 8, GRID_ROWS = 8;
const GRID_W = GRID_COLS * CELL;          // 352
const GRID_H = GRID_ROWS * CELL;          // 352
const GRID_X = (W - GRID_W) / 2;          // 64
const GRID_Y = 80;                        // 격자 시작 y

// 루프 트랙: 격자 외곽 24px 떨어진 사각형, 시계방향
const TRACK_PAD = 24;
const TX1 = GRID_X - TRACK_PAD;
const TY1 = GRID_Y - TRACK_PAD;
const TX2 = GRID_X + GRID_W + TRACK_PAD;
const TY2 = GRID_Y + GRID_H + TRACK_PAD;
const TRACK_SEGS = [
  { x1: TX1, y1: TY1, x2: TX2, y2: TY1 },   // 상 (좌→우)
  { x1: TX2, y1: TY1, x2: TX2, y2: TY2 },   // 우 (상→하)
  { x1: TX2, y1: TY2, x2: TX1, y2: TY2 },   // 하 (우→좌)
  { x1: TX1, y1: TY2, x2: TX1, y2: TY1 }    // 좌 (하→상)
];
const TRACK_SEG_LEN = TRACK_SEGS.map(s => Math.hypot(s.x2 - s.x1, s.y2 - s.y1));

/* ---------- Economy ---------- */
const ECONOMY = {
  startGold: 70,
  maxAlive: 38,             // 화면에 동시 N마리 초과 시 게임 오버
  warnAlive: 28,            // HUD 경고 색 임계
  rollBaseCost: 14,
  rollCostInc: 0.4,         // 매 뽑기마다 증가 (점진 압박)
  rollCostMax: 40,          // 상한
  mergeBonusGold: 4,        // 합성 1회당 환급
  waveBonusGold: 22,
  betweenWaveSec: 4
};

/* ---------- Tower roll probability ---------- */
// 뽑기 시 등급 (1~4) 출현 확률. 합 1.0
const TIER_ROLL_PROB = [0.94, 0.05, 0.01, 0.00];

// 종류 출현 가중치 (합 자동 정규화)
const KIND_WEIGHT = { pulse: 22, burst: 18, frost: 18, rail: 14, blade: 16, rocket: 12 };

/* ---------- Tower stats: kind × tier (1..4) ---------- */
const TOWER_STATS = {

const KIND_ORDER = ['pulse', 'burst', 'frost', 'rail', 'blade', 'rocket'];

/* ---------- Enemy stats ---------- */
const ENEMY_STATS = {

  splitter: { hp: 120, speed: 42, gold: 17, r: 11, color:'#c98aff', name:'SPLIT',  desc:'죽으면 그런트 2마리로 분열', split:2 },
  shielded: { hp:  80, speed: 36, gold: 20, r: 12, color:'#bcc6ff', name:'SHIELD', desc:'쉴드 80을 먼저 깎아야 본체 데미지', shield:80 },

/* ---------- Waves ---------- */
// 각 wave = [[enemyType, count, intervalSec, preDelay?], ...]
const WAVES = [
  [['grunt', 10, 0.6]],
  [['grunt', 14, 0.55]],

  [['grunt', 14, 0.45], ['runner', 5, 0.5, 2.0]],

  [['tank', 7, 1.0], ['shielded', 5, 1.0, 2.0]],
  [['swift', 16, 0.45], ['grunt', 24, 0.3, 3.0]],
  [['boss', 2, 6.0], ['splitter', 6, 0.7, 4.0]],
  [['shielded', 8, 0.9], ['tank', 6, 0.8, 2.0], ['swift', 14, 0.45, 4.0]],
  [['grunt', 32, 0.28], ['runner', 22, 0.32, 3.0], ['splitter', 8, 0.6, 6.0], ['tank', 6, 0.9, 8.0], ['boss', 2, 5.0, 16.0]]
];

/* ============================================================
 * Helpers
 * ============================================================ */
function weightedPick(weights){
  const total = Object.values(weights).reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (const k in weights){
    if (r < weights[k]) return k;
    r -= weights[k];
  }
  return Object.keys(weights)[0];
}
function pickTierByProb(){
  let r = Math.random();
  for (let t = 0; t < TIER_ROLL_PROB.length; t++){
    if (r < TIER_ROLL_PROB[t]) return t + 1;
    r -= TIER_ROLL_PROB[t];
  }
  return 1;
}
function statsFor(kind, tier){
  const def = TOWER_STATS[kind];
  return Object.assign({}, def.tiers[tier], { name: def.name, color: def.color, fire: def.fire, kind, tier });
}
function loadStats(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign({ played:0, bestScore:0, bestWave:0 }, JSON.parse(raw));
  } catch(e) {}
  return { played:0, bestScore:0, bestWave:0 };
}
function saveStats(s){
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {}
}
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function pointSegDist(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const L2 = dx*dx + dy*dy || 0.0001;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L2));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}

/* ============================================================
 * State
 * ============================================================ */
let state = null;
let canvas = null, ctx = null;
let rafId = null;
let lastFrameTs = 0;
let root = null;
let hudEls = null;
let overlayEl = null;
let panelEl = null;
let rollBtn = null;
let speedBtn = null;
let pauseBtn = null;
let mergeBtn = null;

function init(){
  root = document.getElementById('root');
  showTitle();
}

function showTitle(){
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  const best = loadStats();
  root.innerHTML = `

      ${best.bestScore > 0 ? `<div class="ribbon">B E S T &nbsp; ${best.bestScore} (W${best.bestWave})</div>` : ''}

        <div class="row"><span class="sw" style="background:#5cd6ea"></span>

        <div class="row"><span class="sw" style="background:#ff8a3c"></span>
          <div><b>BURST</b> · 광역 폭발 (AoE)</div></div>
        <div class="row"><span class="sw" style="background:#80e8ff"></span>
          <div><b>FROST</b> · 슬로우 (단일)</div></div>
        <div class="row"><span class="sw" style="background:#ff5b9c"></span>
          <div><b>RAIL</b> · 관통 라인 (긴 사거리)</div></div>
        <div class="row"><span class="sw" style="background:#ff5577"></span>
          <div><b>BLADE</b> · 근접 sweep (사거리 작지만 모든 적 동시)</div></div>
        <div class="row"><span class="sw" style="background:#ffd96b"></span>
          <div><b>ROCKET</b> · 추적 미사일 (날아가서 폭발)</div></div>
      </div>
      <div class="rules">
        <h3>R U L E S</h3>
        <div>· <b>뽑기</b>로 무작위 타워 1개를 빈 슬롯에 받음 (1성, 가끔 2성).</div>
        <div>· <b>같은 종류 + 같은 등급 3개 → 1단 위로 합성</b> (자동/수동 토글).</div>
        <div>· 적은 격자 외곽 사각 루프를 시계방향으로 <b>빙글빙글</b> 돕니다 (죽지 않으면 영원히).</div>
        <div>· 누적되어 화면에 <b>${ECONOMY.maxAlive}마리 초과</b>하면 즉시 게임 오버.</div>
        <div>· 슬롯 클릭으로 선택 → 다른 슬롯 클릭으로 이동/스왑, 또는 판매.</div>
        <div>· 키: <b>R</b> 뽑기 / <b>M</b> 자동합성 / <b>P</b> 일시정지 / <b>F</b> 배속 / <b>Esc</b> 해제</div>
      </div>
      <button class="btn primary" id="btn-start" style="
        background: linear-gradient(180deg, #c98aff, #7e4ec2);
        color: #fff; border: 1px solid #c98aff;
        border-radius: 10px; padding: 14px; width: 100%;
        font-weight: 900; letter-spacing:.05em; cursor: pointer; font-size: 14px;">
        출 발
      </button>
    </section>
  `;
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  state = {
    gold: ECONOMY.startGold,
    score: 0,
    waveIdx: 0,             // 0..14
    wavesCleared: 0,
    rollCount: 0,
    rollCost: ECONOMY.rollBaseCost,
    slots: new Array(GRID_COLS * GRID_ROWS).fill(null),
    enemies: [],
    beams: [],
    explosions: [],
    particles: [],
    floatTexts: [],
    projectiles: [],
    sweeps: [],
    spawnEntries: [],
    entryIdx: 0,
    waveState: 'between',   // 'between' | 'wave' | 'won' | 'lost'
    betweenTimer: 2.0,      // 게임 시작 시 2초 후 첫 웨이브
    paused: false,
    speed: 1,
    autoMerge: true,
    selectedSlot: -1,
    hoverSlot: -1,
    time: 0,
    codexOpen: false
  };
  buildLayout();
  bindEvents();
  startLoop();
}

function buildLayout(){
  root.innerHTML = `
    <div class="hud">
      <div class="stat gold"><span class="l">GOLD</span><span class="v" id="hud-gold">0</span></div>
      <div class="stat lives"><span class="l">FIELD</span><span class="v" id="hud-field">0/${ECONOMY.maxAlive}</span></div>
      <div class="stat wave"><span class="l">WAVE</span><span class="v" id="hud-wave">0/15</span></div>
      <div class="stat speed"><span class="l">SPEED</span><span class="v" id="hud-speed">1×</span></div>
    </div>
    <div class="stage-wrap">
      <canvas id="stage" width="${W}" height="${H}"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="selected-panel" id="panel"></div>
    <div class="controls">
      <button class="btn primary" id="btn-roll">뽑기 (12g)</button>
      <button class="btn active" id="btn-merge">자동합성</button>
      <button class="btn" id="btn-codex">도감</button>
      <button class="btn" id="btn-pause">일시정지</button>
      <button class="btn" id="btn-speed">2×</button>
      <button class="btn" id="btn-quit">그만</button>
    </div>
    <div class="info">
      슬롯 클릭=선택/이동 · 단축키: R 뽑기 / M 자동합성 / P 일시 / F 배속 / Esc / C 도감
    </div>
    <div class="codex-backdrop" id="codex-backdrop">
      <div class="codex-panel" id="codex-panel"></div>
    </div>
  `;
  hudEls = {
    gold: document.getElementById('hud-gold'),
    field: document.getElementById('hud-field'),
    wave: document.getElementById('hud-wave'),
    speed: document.getElementById('hud-speed')
  };
  overlayEl = document.getElementById('overlay');
  panelEl = document.getElementById('panel');
  rollBtn = document.getElementById('btn-roll');
  speedBtn = document.getElementById('btn-speed');
  pauseBtn = document.getElementById('btn-pause');
  mergeBtn = document.getElementById('btn-merge');

  canvas = document.getElementById('stage');
  ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}

function bindEvents(){
  rollBtn.onclick = doRoll;
  mergeBtn.onclick = toggleAutoMerge;
  pauseBtn.onclick = togglePause;
  speedBtn.onclick = toggleSpeed;
  document.getElementById('btn-codex').onclick = openCodex;
  document.getElementById('btn-quit').onclick = () => {
    document.removeEventListener('keydown', onKey);
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    showTitle();
  };
  document.getElementById('codex-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'codex-backdrop') closeCodex();
  });

  document.addEventListener('keydown', onKey);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', () => { state.hoverSlot = -1; });
  canvas.addEventListener('click', onClick);
  canvas.addEventListener('touchstart', onTouch, { passive: false });
}

function onKey(e){
  if (e.code === 'KeyR'){ doRoll(); e.preventDefault(); }
  else if (e.code === 'KeyM'){ toggleAutoMerge(); e.preventDefault(); }
  else if (e.code === 'KeyP'){ togglePause(); e.preventDefault(); }
  else if (e.code === 'KeyF'){ toggleSpeed(); e.preventDefault(); }
  else if (e.code === 'KeyC'){ toggleCodex(); e.preventDefault(); }
  else if (e.code === 'Escape'){
    const cb = document.getElementById('codex-backdrop');
    if (cb && cb.classList.contains('on')){ closeCodex(); return; }
    state.selectedSlot = -1;
    refreshPanel();
  }
}

function clientToLocal(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (W / r.width),
    y: (clientY - r.top) * (H / r.height)
  };
}
function localToSlot(x, y){
  if (x < GRID_X || x >= GRID_X + GRID_W || y < GRID_Y || y >= GRID_Y + GRID_H) return -1;
  const col = Math.floor((x - GRID_X) / CELL);
  const row = Math.floor((y - GRID_Y) / CELL);
  return row * GRID_COLS + col;
}

function onMove(e){
  const p = clientToLocal(e.clientX, e.clientY);
  state.hoverSlot = localToSlot(p.x, p.y);
}
function onClick(e){
  const p = clientToLocal(e.clientX, e.clientY);
  handleSlotClick(localToSlot(p.x, p.y));
}
function onTouch(e){
  if (!e.touches[0]) return;
  e.preventDefault();
  const t = e.touches[0];
  const p = clientToLocal(t.clientX, t.clientY);
  state.hoverSlot = localToSlot(p.x, p.y);
  handleSlotClick(state.hoverSlot);
}
function handleSlotClick(idx){
  if (idx < 0) return;
  if (state.waveState === 'won' || state.waveState === 'lost') return;

  if (state.selectedSlot === -1){
    // 선택 없음 → 슬롯에 타워 있으면 선택
    if (state.slots[idx]){
      state.selectedSlot = idx;
      refreshPanel();
    }
  } else {
    if (state.selectedSlot === idx){
      // 같은 슬롯 재선택 → 해제
      state.selectedSlot = -1;
    } else {
      // 다른 슬롯 → 이동 또는 스왑
      const src = state.slots[state.selectedSlot];
      const dst = state.slots[idx];
      state.slots[idx] = src;
      state.slots[state.selectedSlot] = dst;
      updateTowerPositions();
      state.selectedSlot = -1;
      if (state.autoMerge) tryAutoMerge();
    }
    refreshPanel();
  }
}

/* ============================================================
 * Slot helpers
 * ============================================================ */
function slotCenter(idx){
  const col = idx % GRID_COLS;
  const row = Math.floor(idx / GRID_COLS);
  return { x: GRID_X + col * CELL + CELL / 2, y: GRID_Y + row * CELL + CELL / 2 };
}
function updateTowerPositions(){
  for (let i = 0; i < state.slots.length; i++){
    const t = state.slots[i];
    if (!t) continue;
    const c = slotCenter(i);
    t.x = c.x; t.y = c.y;
    t.slotIdx = i;
  }
}
function emptySlots(){
  const arr = [];
  for (let i = 0; i < state.slots.length; i++) if (!state.slots[i]) arr.push(i);
  return arr;
}
function placeTowerIntoSlot(idx, kind, tier){
  const c = slotCenter(idx);
  const s = statsFor(kind, tier);
  state.slots[idx] = {
    kind, tier,
    name: s.name, color: s.color, fire: s.fire,
    dmg: s.dmg, range: s.range, cd: s.cd,
    aoeRadius: s.aoeRadius, slowDur: s.slowDur, slowFactor: s.slowFactor,
    cooldown: 0,
    angle: 0,
    x: c.x, y: c.y,
    slotIdx: idx,
    flash: 0
  };
}

/* ============================================================
 * Roll / Merge
 * ============================================================ */
function doRoll(){
  if (state.waveState === 'won' || state.waveState === 'lost') return;
  const empties = emptySlots();
  if (empties.length === 0){
    floatAt(W/2, GRID_Y + GRID_H/2, '슬롯 가득 참', '#ff7799');
    return;
  }
  if (state.gold < state.rollCost){
    floatAt(W/2, GRID_Y + GRID_H/2, '골드 부족', '#ff7799');
    return;
  }
  state.gold -= state.rollCost;
  state.rollCount += 1;
  state.rollCost = Math.min(
    ECONOMY.rollCostMax,
    Math.floor(ECONOMY.rollBaseCost + state.rollCount * ECONOMY.rollCostInc)
  );
  const kind = weightedPick(KIND_WEIGHT);
  let tier = pickTierByProb();
  // 등급 상한 보장
  if (tier > 4) tier = 4;
  // 빈 슬롯 중 무작위
  const idx = empties[Math.floor(Math.random() * empties.length)];
  placeTowerIntoSlot(idx, kind, tier);
  state.slots[idx].flash = 0.4;
  refreshRollBtn();
  if (state.autoMerge) tryAutoMerge();
}

function tryAutoMerge(){
  // 같은 kind + 같은 tier 가 3개 이상 모이면 자동 합성
  let merged = false;
  let safety = 0;
  do {
    merged = false;
    // 카운트
    const buckets = {};
    for (let i = 0; i < state.slots.length; i++){
      const t = state.slots[i];
      if (!t) continue;
      const key = t.kind + ':' + t.tier;
      if (!buckets[key]) buckets[key] = [];
      buckets[key].push(i);
    }
    for (const key in buckets){
      const idxs = buckets[key];
      if (idxs.length < 3) continue;
      const sample = state.slots[idxs[0]];
      if (sample.tier >= 4) continue;
      // 3개 사용 → 상위 1개
      const [a, b, c] = idxs;
      const cnt = state.slots[a];
      state.slots[b] = null;
      state.slots[c] = null;
      // 첫 슬롯 위치는 유지, 등급만 올림
      placeTowerIntoSlot(a, sample.kind, sample.tier + 1);
      state.slots[a].flash = 0.7;
      addExplosion(state.slots[a].x, state.slots[a].y, 26, state.slots[a].color);
      floatAt(state.slots[a].x, state.slots[a].y - 10, '★' + state.slots[a].tier, '#ffd96b');
      state.gold += ECONOMY.mergeBonusGold;
      floatAt(state.slots[a].x + 20, state.slots[a].y + 8, '+' + ECONOMY.mergeBonusGold + 'g', '#ffd96b');
      merged = true;
      break; // 한 번에 한 그룹만 (다음 루프에서 다시 검사)
    }
    safety += 1;
  } while (merged && safety < 30);
  if (state.selectedSlot !== -1 && !state.slots[state.selectedSlot]){
    state.selectedSlot = -1;
    refreshPanel();
  }
}

function refreshRollBtn(){
  rollBtn.textContent = `뽑기 (${state.rollCost}g)`;
  rollBtn.disabled = (state.gold < state.rollCost) || (emptySlots().length === 0);
}
function refreshPanel(){
  if (state.selectedSlot < 0 || !state.slots[state.selectedSlot]){
    panelEl.classList.remove('on');
    panelEl.innerHTML = '';
    return;
  }
  const t = state.slots[state.selectedSlot];
  const refund = Math.floor(towerCost(t.kind, t.tier) * 0.5);
  const tierStars = '★'.repeat(t.tier);
  panelEl.classList.add('on');
  panelEl.innerHTML = `
    <div class="tname" style="color: ${t.color};">${t.name} ${tierStars}</div>
    <div class="row"><span>사거리</span><span>${t.range}</span></div>
    <div class="row"><span>데미지</span><span>${t.dmg}${t.fire === 'aoe' ? ' (AoE)' : t.fire === 'pierce' ? ' (관통)' : ''}</span></div>
    <div class="row"><span>발사 간격</span><span>${t.cd}s</span></div>
    ${t.fire === 'slow' ? `<div class="row"><span>슬로우</span><span>${Math.round((1 - t.slowFactor)*100)}% / ${t.slowDur}s</span></div>` : ''}
    ${t.fire === 'aoe' ? `<div class="row"><span>폭발 반경</span><span>${t.aoeRadius}</span></div>` : ''}
    <div class="actions">
      <button class="btn" id="btn-sell" style="background: rgba(200,50,80,.4); border-color: rgba(255,120,150,.4);">판매 +${refund}g</button>
    </div>
    <div class="row" style="font-size:11px; color:#8888aa; margin-top:6px;">다른 슬롯 클릭으로 이동/스왑</div>
  `;
  document.getElementById('btn-sell').onclick = sellSelected;
}
function towerCost(kind, tier){
  // 합성 비용 누적: tier 1 기준 12g, tier 2는 ~36g, tier 3 ~108g, tier 4 ~324g
  return Math.floor(ECONOMY.rollBaseCost * Math.pow(3, tier - 1));
}
function sellSelected(){
  const idx = state.selectedSlot;
  if (idx < 0 || !state.slots[idx]) return;
  const t = state.slots[idx];
  const refund = Math.floor(towerCost(t.kind, t.tier) * 0.5);
  state.gold += refund;
  floatAt(t.x, t.y, '+' + refund + 'g', '#ffd96b');
  state.slots[idx] = null;
  state.selectedSlot = -1;
  refreshPanel();
}

/* ============================================================
 * Controls
 * ============================================================ */
function toggleAutoMerge(){
  state.autoMerge = !state.autoMerge;
  mergeBtn.textContent = state.autoMerge ? '자동합성' : '수동합성';
  mergeBtn.classList.toggle('active', state.autoMerge);
  if (state.autoMerge) tryAutoMerge();
}
function togglePause(){
  if (state.waveState === 'won' || state.waveState === 'lost') return;
  state.paused = !state.paused;
  pauseBtn.textContent = state.paused ? '재개' : '일시정지';
  if (state.paused){
    setOverlay(`<h2>일시정지</h2><p>P 또는 재개 버튼으로 계속</p>`, false);
  } else {
    clearOverlay();
  }
}
function toggleSpeed(){
  state.speed = state.speed === 1 ? 2 : state.speed === 2 ? 3 : 1;
  speedBtn.textContent = state.speed + '×';
  hudEls.speed.textContent = state.speed + '×';
}

/* ============================================================
 * Wave / Enemy
 * ============================================================ */
function startWave(idx){
  const wave = WAVES[idx];
  if (!wave) return;
  state.spawnEntries = wave.map(e => ({
    type: e[0],
    remaining: e[1],
    interval: e[2],
    timer: e[3] || 0
  }));
  state.entryIdx = 0;
  state.waveState = 'wave';
}

function tickSpawns(dt){
  if (state.entryIdx >= state.spawnEntries.length) return;
  const entry = state.spawnEntries[state.entryIdx];
  entry.timer -= dt;
  if (entry.timer <= 0){
    spawnEnemy(entry.type);
    entry.remaining -= 1;
    if (entry.remaining <= 0){
      state.entryIdx += 1;
    } else {
      entry.timer = entry.interval;
    }
  }
}

function spawnEnemy(type, atSeg, atProgress){
  const def = ENEMY_STATS[type];
  const segIdx = atSeg != null ? atSeg : 0;
  const segProgress = atProgress != null ? atProgress : 0;
  const seg = TRACK_SEGS[segIdx];
  const t = segProgress / TRACK_SEG_LEN[segIdx];
  state.enemies.push({
    type, name: def.name,
    x: seg.x1 + (seg.x2 - seg.x1) * t,
    y: seg.y1 + (seg.y2 - seg.y1) * t,
    hp: def.hp, maxHp: def.hp,
    shield: def.shield || 0,
    maxShield: def.shield || 0,
    speed: def.speed,
    slowUntil: 0,
    slowFactor: 1,
    r: def.r,
    color: def.color,
    reward: def.gold,
    split: def.split || 0,
    segIdx, segProgress,
    laps: 0,
    dead: false
  });
}

function applyDamage(e, dmg){
  if (e.shield > 0){
    const absorbed = Math.min(e.shield, dmg);
    e.shield -= absorbed;
    dmg -= absorbed;
  }
  if (dmg > 0) e.hp -= dmg;
}

function endWave(){
  state.wavesCleared += 1;
  state.gold += ECONOMY.waveBonusGold;
  state.score += 100;
  state.waveIdx += 1;
  floatAt(W/2, GRID_Y + GRID_H/2, '+' + ECONOMY.waveBonusGold + 'g 보너스', '#ffd96b');
  if (state.waveIdx >= WAVES.length){
    return winGame();
  }
  state.waveState = 'between';
  state.betweenTimer = ECONOMY.betweenWaveSec;
}

function winGame(){
  state.waveState = 'won';
  // 보너스: 화면이 깨끗할수록 + 남은 골드
  const cleanBonus = Math.max(0, ECONOMY.maxAlive - state.enemies.length) * 20;
  state.score += cleanBonus + state.gold;
  finishUI(true);
}
function loseGame(){
  state.waveState = 'lost';
  finishUI(false);
}
function finishUI(won){
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  document.removeEventListener('keydown', onKey);
  const best = loadStats();
  const isBest = state.score > best.bestScore;
  saveStats({
    played: best.played + 1,
    bestScore: Math.max(best.bestScore, state.score),
    bestWave: Math.max(best.bestWave, state.wavesCleared)
  });
  setOverlay(`
    <h2>${won ? '🏆 클리어!' : '💥 게임 오버'}</h2>
    <p>웨이브 ${state.wavesCleared}/15 · 필드 ${state.enemies.length}/${ECONOMY.maxAlive} · 골드 ${state.gold}</p>
    <div style="font-size:42px; font-weight:900; color:${won ? '#c98aff' : '#ff7799'}; margin: 12px 0; line-height:1; font-variant-numeric: tabular-nums;">${state.score}</div>
    ${isBest ? '<div class="ribbon">NEW BEST</div>' : ''}
    <div style="margin-top: 16px;">
      <button class="btn primary" id="ov-again" style="margin-right: 6px; background: linear-gradient(180deg, #c98aff, #7e4ec2); color:#fff; border:1px solid #c98aff; padding: 10px 16px; border-radius: 10px; font-weight: 900;">다시</button>
      <button class="btn" id="ov-home" style="background: rgba(40,18,90,.7); color:#d8d0ff; border:1px solid rgba(160,120,255,.3); padding: 10px 16px; border-radius: 10px; font-weight: 800;">홈</button>
    </div>
  `, true);
  document.getElementById('ov-again').onclick = startGame;
  document.getElementById('ov-home').onclick = showTitle;
}

/* ============================================================
 * Tower fire
 * ============================================================ */
function fireTower(t, target){
  if (t.fire === 'single'){
    applyDamage(target, t.dmg);
    addBeam(t.x, t.y, target.x, target.y, t.color, 0.13);
  } else if (t.fire === 'aoe'){
    addBeam(t.x, t.y, target.x, target.y, t.color, 0.16);
    addExplosion(target.x, target.y, t.aoeRadius, t.color);
    for (const e of state.enemies){
      if (e.dead) continue;
      const dx = e.x - target.x, dy = e.y - target.y;
      if (dx*dx + dy*dy <= t.aoeRadius * t.aoeRadius){
        applyDamage(e, t.dmg);
      }
    }
  } else if (t.fire === 'slow'){
    applyDamage(target, t.dmg);
    target.slowUntil = state.time + t.slowDur;
    target.slowFactor = t.slowFactor;
    addBeam(t.x, t.y, target.x, target.y, t.color, 0.18);
  } else if (t.fire === 'pierce'){
    const dx = Math.cos(t.angle), dy = Math.sin(t.angle);
    const ex = t.x + dx * t.range;
    const ey = t.y + dy * t.range;
    addBeam(t.x, t.y, ex, ey, t.color, 0.28);
    for (const e of state.enemies){
      if (e.dead) continue;
      const dist = pointSegDist(e.x, e.y, t.x, t.y, ex, ey);
      if (dist < e.r + 5){
        applyDamage(e, t.dmg);
      }
    }
  } else if (t.fire === 'melee'){
    // 사거리 내 모든 적에게 즉시 데미지 + sweep 시각
    for (const e of state.enemies){
      if (e.dead) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      if (dx*dx + dy*dy < t.range * t.range){
        applyDamage(e, t.dmg);
      }
    }
    state.sweeps.push({ x: t.x, y: t.y, r: t.range, color: t.color, life: 0.22, maxLife: 0.22 });
  } else if (t.fire === 'missile'){
    const dx = target.x - t.x, dy = target.y - t.y;
    const d = Math.hypot(dx, dy) || 0.001;
    state.projectiles.push({
      x: t.x, y: t.y,
      vx: (dx / d) * t.missileSpeed,
      vy: (dy / d) * t.missileSpeed,
      speed: t.missileSpeed,
      targetRef: target,
      dmg: t.dmg,
      aoeRadius: t.aoeRadius,
      color: t.color,
      life: 3.5,
      trail: []
    });
  }
}

function stepProjectiles(dt){
  for (const p of state.projectiles){
    p.life -= dt;
    // retarget if target dead
    if (!p.targetRef || p.targetRef.dead){
      let best = null, bd = 1e9;
      for (const e of state.enemies){
        if (e.dead) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < bd){ bd = d2; best = e; }
      }
      p.targetRef = best;
    }
    if (p.targetRef){
      const dx = p.targetRef.x - p.x;
      const dy = p.targetRef.y - p.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const dvx = (dx / d) * p.speed;
      const dvy = (dy / d) * p.speed;
      // homing 회전 (lerp velocity, 그 후 속도 재정규화)
      p.vx = p.vx * 0.78 + dvx * 0.22;
      p.vy = p.vy * 0.78 + dvy * 0.22;
      const sp = Math.hypot(p.vx, p.vy) || 0.001;
      p.vx = (p.vx / sp) * p.speed;
      p.vy = (p.vy / sp) * p.speed;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 7) p.trail.shift();

    // 적과 충돌 검사 → 폭발
    let exploded = false;
    for (const e of state.enemies){
      if (e.dead) continue;
      const dx = e.x - p.x, dy = e.y - p.y;
      if (dx*dx + dy*dy < (e.r + 5) * (e.r + 5)){
        exploded = true; break;
      }
    }
    if (exploded){
      addExplosion(p.x, p.y, p.aoeRadius, p.color);
      for (const e of state.enemies){
        if (e.dead) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        if (dx*dx + dy*dy < p.aoeRadius * p.aoeRadius){
          applyDamage(e, p.dmg);
        }
      }
      p.life = 0;
    }

    // 화면 밖이면 제거
    if (p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) p.life = 0;
  }
  state.projectiles = state.projectiles.filter(p => p.life > 0);
}

/* ============================================================
 * Step (game logic)
 * ============================================================ */
function step(dt){
  state.time += dt;

  if (state.waveState === 'between'){
    state.betweenTimer -= dt;
    if (state.betweenTimer <= 0){
      startWave(state.waveIdx);
    }
  } else if (state.waveState === 'wave'){
    tickSpawns(dt);
  }

  // 적 이동 (사각 루프)
  for (const e of state.enemies){
    if (e.dead) continue;
    const slow = e.slowUntil > state.time ? e.slowFactor : 1;
    let remaining = e.speed * slow * dt;
    let guard = 0;
    while (remaining > 0 && guard < 8){
      const segLen = TRACK_SEG_LEN[e.segIdx];
      const left = segLen - e.segProgress;
      if (remaining < left){
        e.segProgress += remaining;
        remaining = 0;
      } else {
        remaining -= left;
        e.segIdx = (e.segIdx + 1) % TRACK_SEGS.length;
        e.segProgress = 0;
        if (e.segIdx === 0) e.laps += 1;
      }
      guard += 1;
    }
    const seg = TRACK_SEGS[e.segIdx];
    const t = e.segProgress / TRACK_SEG_LEN[e.segIdx];
    e.x = seg.x1 + (seg.x2 - seg.x1) * t;
    e.y = seg.y1 + (seg.y2 - seg.y1) * t;
  }

  // 사망 처리
  const newSpawns = [];
  for (const e of state.enemies){
    if (!e.dead && e.hp <= 0){
      e.dead = true;
      state.gold += e.reward;
      state.score += e.reward;
      floatAt(e.x, e.y, '+' + e.reward + 'g', '#ffd96b');
      spawnKillParticles(e);
      // splitter: 죽으면 같은 위치에 grunt 2마리
      if (e.split > 0){
        for (let i = 0; i < e.split; i++){
          newSpawns.push({ type: 'grunt', segIdx: e.segIdx, segProgress: Math.max(0, e.segProgress - 6 - i * 4) });
        }
      }
    }
  }
  state.enemies = state.enemies.filter(e => !e.dead);
  for (const s of newSpawns) spawnEnemy(s.type, s.segIdx, s.segProgress);

  // 동시 적 수 초과 시 게임 오버
  if (state.enemies.length > ECONOMY.maxAlive){
    loseGame();
    return;
  }

  // 타워 사격
  for (const t of state.slots){
    if (!t) continue;
    t.cooldown -= dt;
    if (t.flash > 0) t.flash -= dt;
    let best = null, bestProgress = -1;
    for (const e of state.enemies){
      if (e.dead) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      const d2 = dx*dx + dy*dy;
      if (d2 > t.range * t.range) continue;
      // 트랙 진행도가 가장 높은 적 (사이클 수 + 세그먼트 + 진행거리)
      const totalLen = TRACK_SEG_LEN.reduce((a, b) => a + b, 0);
      const offsetBefore = TRACK_SEG_LEN.slice(0, e.segIdx).reduce((a, b) => a + b, 0);
      const progress = e.laps * totalLen + offsetBefore + e.segProgress;
      if (progress > bestProgress){
        bestProgress = progress;
        best = e;
      }
    }
    if (best){
      t.angle = Math.atan2(best.y - t.y, best.x - t.x);
      if (t.cooldown <= 0){
        fireTower(t, best);
        t.cooldown = t.cd;
      }
    }
  }

  // 이펙트 수명
  for (const b of state.beams) b.life -= dt;
  state.beams = state.beams.filter(b => b.life > 0);
  for (const x of state.explosions){
    const k = 1 - x.life / x.maxLife;
    x.r = x.maxR * Math.min(1, k * 2);
    x.life -= dt;
  }
  state.explosions = state.explosions.filter(x => x.life > 0);
  for (const p of state.particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= dt;
  }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const f of state.floatTexts){
    f.y -= 30 * dt;
    f.life -= dt;
  }
  state.floatTexts = state.floatTexts.filter(f => f.life > 0);

  // 발사체 + sweep 처리
  stepProjectiles(dt);
  for (const s of state.sweeps) s.life -= dt;
  state.sweeps = state.sweeps.filter(s => s.life > 0);

  // 웨이브 종료 검사
  // 적이 사각 루프를 돌며 안 죽는 구조라, 적 처치와 무관하게 spawn 완료 시 다음 웨이브로 자동 진행.
  // 마지막 웨이브만은 적 0이 되어야 승리.
  if (state.waveState === 'wave'){
    if (state.entryIdx >= state.spawnEntries.length){
      if (state.waveIdx + 1 >= WAVES.length){
        if (state.enemies.length === 0) winGame();
      } else {
        endWave();
      }
    }
  }
}

/* ============================================================
 * Effect helpers
 * ============================================================ */
function addBeam(x1, y1, x2, y2, color, duration){
  state.beams.push({ x1, y1, x2, y2, color, life: duration, maxLife: duration });
}
function addExplosion(x, y, maxR, color){
  state.explosions.push({ x, y, r: 4, maxR, color, life: 0.35, maxLife: 0.35 });
}
function spawnKillParticles(e){
  for (let i = 0; i < 10; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 80;
    state.particles.push({
      x: e.x, y: e.y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      size: 1.5 + Math.random() * 2,
      color: e.color,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8
    });
  }
}
function floatAt(x, y, text, color){
  state.floatTexts.push({ x, y, text, color, life: 1.1, maxLife: 1.1 });
}

/* ============================================================
 * Render
 * ============================================================ */
function render(){
  ctx.clearRect(0, 0, W, H);

  // 배경
  const bg = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, 380);
  bg.addColorStop(0, '#1c0a3a');
  bg.addColorStop(0.55, '#0a0420');
  bg.addColorStop(1, '#02010a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 루프 트랙 (사각 + 글로우)
  drawTrack();

  // 격자
  ctx.save();
  ctx.strokeStyle = 'rgba(180,140,255,.16)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= GRID_COLS; c++){
    const x = GRID_X + c * CELL;
    ctx.beginPath();
    ctx.moveTo(x, GRID_Y);
    ctx.lineTo(x, GRID_Y + GRID_H);
    ctx.stroke();
  }
  for (let r = 0; r <= GRID_ROWS; r++){
    const y = GRID_Y + r * CELL;
    ctx.beginPath();
    ctx.moveTo(GRID_X, y);
    ctx.lineTo(GRID_X + GRID_W, y);
    ctx.stroke();
  }
  // 격자 외곽
  ctx.strokeStyle = 'rgba(200,160,255,.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(GRID_X, GRID_Y, GRID_W, GRID_H);
  ctx.restore();

  // 호버 / 선택 슬롯
  if (state.hoverSlot >= 0){
    const c = slotCenter(state.hoverSlot);
    ctx.save();
    ctx.fillStyle = 'rgba(200,180,255,.10)';
    ctx.fillRect(c.x - CELL/2, c.y - CELL/2, CELL, CELL);
    ctx.restore();
  }
  if (state.selectedSlot >= 0){
    const c = slotCenter(state.selectedSlot);
    ctx.save();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.strokeRect(c.x - CELL/2 + 2, c.y - CELL/2 + 2, CELL - 4, CELL - 4);
    ctx.restore();
    // 사거리
    const t = state.slots[state.selectedSlot];
    if (t){
      ctx.save();
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
      ctx.fillStyle = `${t.color}15`;
      ctx.fill();
      ctx.strokeStyle = `${t.color}aa`;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  // 타워
  for (const t of state.slots){
    if (!t) continue;
    drawTower(t);
  }

  // 적
  for (const e of state.enemies){
    drawEnemy(e);
  }

  // beams
  for (const b of state.beams){
    const a = Math.max(0, b.life / b.maxLife);
    ctx.save();
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = 2 + a * 2;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
    ctx.restore();
  }

  // explosions
  for (const x of state.explosions){
    const a = Math.max(0, x.life / x.maxLife);
    ctx.save();
    ctx.beginPath();
    ctx.arc(x.x, x.y, x.r, 0, Math.PI * 2);
    ctx.fillStyle = `${x.color}${Math.floor(a * 80).toString(16).padStart(2,'0')}`;
    ctx.shadowColor = x.color;
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = x.color;
    ctx.globalAlpha = a;
    ctx.stroke();
    ctx.restore();
  }

  // particles
  for (const p of state.particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    ctx.restore();
  }

  // missile projectiles (trail + body)
  for (const p of state.projectiles){
    // trail
    for (let i = 0; i < p.trail.length; i++){
      const a = (i + 1) / p.trail.length * 0.55;
      ctx.save();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.trail[i].x, p.trail[i].y, 2 + i * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // body
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(3.5, 4);
    ctx.lineTo(0, 2);
    ctx.lineTo(-3.5, 4);
    ctx.closePath();
    ctx.fill();
    // 흰 코어
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -2, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // melee sweeps (확장 링)
  for (const s of state.sweeps){
    const a = s.life / s.maxLife;
    const r = s.r * (1 - a) + 6;
    ctx.save();
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = a * 0.9;
    ctx.lineWidth = 2 + a;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // float texts
  for (const f of state.floatTexts){
    const a = Math.max(0, f.life / f.maxLife);
    ctx.save();
    ctx.font = '800 12px "Pretendard", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.globalAlpha = a;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 6;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  // 상단 영역에 next-wave 카운트다운 / 웨이브 인디케이터
  drawTopOverlay();

  // HUD 업데이트
  hudEls.gold.textContent = state.gold;
  const alive = state.enemies.length;
  hudEls.field.textContent = alive + '/' + ECONOMY.maxAlive;
  hudEls.field.style.color = alive >= ECONOMY.warnAlive ? '#ff7799' : (alive >= ECONOMY.warnAlive * 0.65 ? '#ffd96b' : '#ff7799');
  // 평상시엔 분홍, 안전권엔 흰색에 가깝게
  if (alive < ECONOMY.warnAlive * 0.5) hudEls.field.style.color = '#fff';
  hudEls.wave.textContent = (state.waveState === 'wave' ? (state.waveIdx + 1) : state.wavesCleared) + '/15';
  hudEls.speed.textContent = state.paused ? '||' : state.speed + '×';
  refreshRollBtn();
}

function drawTrack(){
  // 외곽 글로우 라인 (시계방향 화살표 같이)
  ctx.save();
  ctx.shadowColor = '#c98aff';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(200,170,255,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(TX1, TY1);
  ctx.lineTo(TX2, TY1);
  ctx.lineTo(TX2, TY2);
  ctx.lineTo(TX1, TY2);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  // 트랙 진행 방향 표시 (각 변 가운데에 작은 ▶)
  ctx.save();
  ctx.fillStyle = 'rgba(255,180,220,.7)';
  ctx.shadowColor = '#ff5b9c';
  ctx.shadowBlur = 6;
  const arrowSize = 4;
  // 상변 중앙 (→)
  drawArrow(ctx, (TX1 + TX2) / 2, TY1, 0, arrowSize);
  // 우변 중앙 (↓)
  drawArrow(ctx, TX2, (TY1 + TY2) / 2, Math.PI / 2, arrowSize);
  // 하변 중앙 (←)
  drawArrow(ctx, (TX1 + TX2) / 2, TY2, Math.PI, arrowSize);
  // 좌변 중앙 (↑)
  drawArrow(ctx, TX1, (TY1 + TY2) / 2, -Math.PI / 2, arrowSize);
  ctx.restore();

  // 트랙 영역 살짝 채움 (적이 다닐 공간)
  ctx.save();
  ctx.fillStyle = 'rgba(140,90,220,.05)';
  ctx.fillRect(TX1 - 6, TY1 - 6, (TX2 - TX1) + 12, 12);
  ctx.fillRect(TX1 - 6, TY2 - 6, (TX2 - TX1) + 12, 12);
  ctx.fillRect(TX1 - 6, TY1 - 6, 12, (TY2 - TY1) + 12);
  ctx.fillRect(TX2 - 6, TY1 - 6, 12, (TY2 - TY1) + 12);
  ctx.restore();
}

function drawArrow(c, x, y, angle, size){
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.beginPath();
  c.moveTo(size, 0);
  c.lineTo(-size * 0.7, size * 0.7);
  c.lineTo(-size * 0.3, 0);
  c.lineTo(-size * 0.7, -size * 0.7);
  c.closePath();
  c.fill();
  c.restore();
}

function drawTopOverlay(){
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '800 11px "Pretendard", sans-serif';
  if (state.waveState === 'between'){
    const t = Math.max(0, state.betweenTimer);
    ctx.fillStyle = '#c0b8e4';
    ctx.fillText(`다음 웨이브 ${state.waveIdx + 1}/15 — ${t.toFixed(1)}s`, W/2, 30);
    // 다음 웨이브 미리보기
    const next = WAVES[state.waveIdx];
    if (next){
      const counts = {};
      for (const [type, n] of next) counts[type] = (counts[type] || 0) + n;
      const summary = Object.entries(counts).map(([k, v]) => `${ENEMY_STATS[k].name} ×${v}`).join(' · ');
      ctx.fillStyle = '#9a8cd6';
      ctx.font = '700 10px "Pretendard", sans-serif';
      ctx.fillText(summary, W/2, 50);
    }
  } else if (state.waveState === 'wave'){
    const remainingSpawns = state.spawnEntries.slice(state.entryIdx).reduce((s, e) => s + e.remaining, 0);
    ctx.fillStyle = '#5cd6ea';
    ctx.fillText(`Wave ${state.waveIdx + 1}/15 — 남은 적 ${state.enemies.length + remainingSpawns}`, W/2, 30);
  }
  ctx.restore();
}

function drawTower(t){
  const flash = t.flash > 0 ? 1 - (1 - t.flash) : 0;
  ctx.save();
  ctx.translate(t.x, t.y);

  // 등급 4: 회전하는 골드 후광
  if (t.tier === 4){
    ctx.save();
    ctx.rotate(state.time * 1.4);
    ctx.strokeStyle = 'rgba(255,217,107,.55)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#ffd96b';
    ctx.shadowBlur = 14;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // 회전 본체
  ctx.save();
  ctx.rotate(t.angle + Math.PI / 2);
  ctx.shadowColor = t.color;
  ctx.shadowBlur = 6 + t.tier * 2 + flash * 12;
  drawTowerBody(ctx, t);
  ctx.restore();

  // 등급 점 (코너에 작은 별, 비회전)
  drawTierPips(ctx, t);

  ctx.restore();
}

function drawTowerBody(c, t){
  if (t.kind === 'pulse')       drawPulseBody(c, t);
  else if (t.kind === 'burst')  drawBurstBody(c, t);
  else if (t.kind === 'frost')  drawFrostBody(c, t);
  else if (t.kind === 'rail')   drawRailBody(c, t);
  else if (t.kind === 'blade')  drawBladeBody(c, t);
  else if (t.kind === 'rocket') drawRocketBody(c, t);
}

function drawPulseBody(ctx, t){
  // 빔 캐논: 원형 본체 + 위쪽 짧은 사각 포신 + 코어
  ctx.fillStyle = '#1a0b30';
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.stroke();
  // 포신
  ctx.fillStyle = t.color;
  ctx.fillRect(-3, -19, 6, 9);
  ctx.fillRect(-4.5, -12, 9, 3);
  // 빛나는 코어
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 6);
  coreGrad.addColorStop(0, '#fff');
  coreGrad.addColorStop(1, t.color);
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 4 + t.tier * 0.4, 0, Math.PI * 2);
  ctx.fill();
}

function drawBurstBody(ctx, t){
  // 박격포: 사각 본체 + 위에 둥근 포탑 + 좌우 vent
  ctx.fillStyle = '#1a0b30';
  roundRect(ctx, -12, -10, 24, 22, 3);
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  roundRect(ctx, -12, -10, 24, 22, 3);
  ctx.stroke();
  // 좌우 vent 슬릿
  ctx.fillStyle = t.color;
  ctx.fillRect(-13, -4, 2, 8);
  ctx.fillRect(11, -4, 2, 8);
  ctx.fillRect(-13, 4, 2, 4);
  ctx.fillRect(11, 4, 2, 4);
  // 위쪽 둥근 머리 (캐논볼)
  const headGrad = ctx.createRadialGradient(0, -10, 1, 0, -10, 7);
  headGrad.addColorStop(0, '#fff5cc');
  headGrad.addColorStop(1, t.color);
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(0, -12, 5 + t.tier * 0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawFrostBody(ctx, t){
  // 결정: 다이아몬드 본체 + 안쪽 별 + 모서리 sparkle
  const r = 13;
  ctx.fillStyle = '#0e1830';
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r, 0);
  ctx.lineTo(0, r);
  ctx.lineTo(-r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  ctx.stroke();
  // 4각 별 안쪽
  ctx.fillStyle = t.color;
  ctx.beginPath();
  for (let i = 0; i < 8; i++){
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 === 0 ? 5 + t.tier * 0.4 : 2;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
  // 모서리 sparkle
  ctx.fillStyle = '#fff';
  ctx.fillRect(-1, -r - 1, 2, 2);
  ctx.fillRect(r - 1, -1, 2, 2);
  ctx.fillRect(-1, r - 1, 2, 2);
  ctx.fillRect(-r - 1, -1, 2, 2);
}

function drawRailBody(ctx, t){
  // 레일건: 긴 직사각 본체 + 양 옆 보조 라인 + 끝 점
  ctx.fillStyle = '#1a0b30';
  roundRect(ctx, -7, -16, 14, 28, 2);
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  roundRect(ctx, -7, -16, 14, 28, 2);
  ctx.stroke();
  // 양 옆 가이드 라인
  ctx.fillStyle = t.color;
  ctx.fillRect(-10, -10, 1.5, 16);
  ctx.fillRect(8.5, -10, 1.5, 16);
  // 끝 점 (총구)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, -16, 2.5 + t.tier * 0.3, 0, Math.PI * 2);
  ctx.fill();
  // 가운데 라인
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(0, 10);
  ctx.stroke();
}

function drawBladeBody(c, t){
  // 본체 (어두운 원) + 회전하는 두 칼날
  c.fillStyle = '#1a0b30';
  c.beginPath();
  c.arc(0, 0, 10, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = t.color;
  c.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  c.beginPath();
  c.arc(0, 0, 10, 0, Math.PI * 2);
  c.stroke();
  // 회전 칼날 (시간 기반, 게임 안에서만 회전)
  const spin = (state ? state.time : 0) * 5;
  c.save();
  c.rotate(spin);
  c.fillStyle = t.color;
  // 가로 칼날
  c.beginPath();
  c.moveTo(-15 - t.tier, 0);
  c.lineTo(-9, -2);
  c.lineTo(9, -2);
  c.lineTo(15 + t.tier, 0);
  c.lineTo(9, 2);
  c.lineTo(-9, 2);
  c.closePath();
  c.fill();
  c.restore();
  c.save();
  c.rotate(spin + Math.PI / 2);
  c.fillStyle = t.color;
  c.beginPath();
  c.moveTo(-15 - t.tier, 0);
  c.lineTo(-9, -2);
  c.lineTo(9, -2);
  c.lineTo(15 + t.tier, 0);
  c.lineTo(9, 2);
  c.lineTo(-9, 2);
  c.closePath();
  c.fill();
  c.restore();
  // 중심 점
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(0, 0, 2 + t.tier * 0.3, 0, Math.PI * 2);
  c.fill();
}

function drawRocketBody(c, t){
  // 박스 본체 + 위에 미사일 머리 (포인티드 화살표) + 측면 스태빌라이저 + 등급 배지
  c.fillStyle = '#1a0b30';
  roundRect(c, -10, -8, 20, 22, 3);
  c.fill();
  c.strokeStyle = t.color;
  c.lineWidth = 1.5 + (t.tier - 1) * 0.3;
  roundRect(c, -10, -8, 20, 22, 3);
  c.stroke();
  // 미사일 머리 (위쪽)
  c.fillStyle = t.color;
  c.beginPath();
  c.moveTo(0, -18);
  c.lineTo(6, -8);
  c.lineTo(-6, -8);
  c.closePath();
  c.fill();
  // 측면 stabilizer 핀
  c.fillRect(-12, -4, 2, 10);
  c.fillRect(10, -4, 2, 10);
  // 작은 launch dot (총구)
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(0, -8, 2 + t.tier * 0.4, 0, Math.PI * 2);
  c.fill();
  // 본체 가운데에 등급 점
  c.fillStyle = t.color;
  c.beginPath();
  c.arc(0, 4, 2.5, 0, Math.PI * 2);
  c.fill();
}

function drawTierPips(ctx, t){
  // 본체 아래쪽에 작은 점 1~4개 (등급 표시)
  ctx.save();
  ctx.shadowBlur = 0;
  const pips = t.tier;
  const total = pips;
  const gap = 4;
  const startX = -((total - 1) * gap) / 2;
  for (let i = 0; i < pips; i++){
    ctx.fillStyle = t.tier === 4 ? '#ffd96b' : t.color;
    ctx.beginPath();
    ctx.arc(startX + i * gap, 17, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e){
  drawEnemyShape(ctx, e.x, e.y, e.type, e.color, e.r, state.time);

  // 슬로우 인디케이터
  if (e.slowUntil > state.time){
    ctx.save();
    ctx.strokeStyle = '#80e8ff';
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // shielded — 보호막 시각
  if (e.maxShield > 0 && e.shield > 0){
    ctx.save();
    ctx.strokeStyle = '#9ab0ff';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#9ab0ff';
    ctx.shadowBlur = 8;
    ctx.globalAlpha = 0.4 + 0.5 * (e.shield / e.maxShield);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // HP 바 (+ shield 바)
  if (e.hp < e.maxHp || (e.maxShield > 0 && e.shield < e.maxShield)){
    const bw = e.r * 2.6;
    const bh = 3;
    const bx = e.x - bw / 2;
    const by = e.y - e.r - 8;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(bx, by, bw, bh);
    const f = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = f > 0.5 ? '#86d6a8' : f > 0.25 ? '#ffd96b' : '#ff7799';
    ctx.fillRect(bx, by, bw * f, bh);
    if (e.maxShield > 0){
      const sf = Math.max(0, e.shield / e.maxShield);
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(bx, by - bh - 1, bw, bh);
      ctx.fillStyle = '#9ab0ff';
      ctx.fillRect(bx, by - bh - 1, bw * sf, bh);
    }
  }
}

function drawEnemyShape(c, x, y, type, color, r, time){
  c.save();
  c.shadowColor = color;
  c.shadowBlur = 10;
  c.fillStyle = color;
  c.translate(x, y);
  if (type === 'grunt'){
    // 마름모 + 가운데 점
    c.beginPath();
    c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, r); c.lineTo(-r, 0);
    c.closePath();
    c.fill();
    c.fillStyle = '#fff';
    c.fillRect(-1, -1, 2, 2);
  } else if (type === 'runner'){
    // 화살촉
    c.beginPath();
    c.moveTo(r, 0);
    c.lineTo(-r * 0.7, r * 0.8);
    c.lineTo(-r * 0.2, 0);
    c.lineTo(-r * 0.7, -r * 0.8);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(r * 0.5, 0); c.lineTo(-r * 0.2, 0);
    c.stroke();
  } else if (type === 'tank'){
    // 두꺼운 육각형 + 십자선
    c.beginPath();
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * Math.PI * 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(-r * 0.6, 0); c.lineTo(r * 0.6, 0);
    c.moveTo(0, -r * 0.6); c.lineTo(0, r * 0.6);
    c.stroke();
  } else if (type === 'swift'){
    // 길쭉한 다이아 + 양 옆 작은 핀
    c.beginPath();
    c.moveTo(r, 0);
    c.lineTo(0, r * 0.6);
    c.lineTo(-r * 0.7, 0);
    c.lineTo(0, -r * 0.6);
    c.closePath();
    c.fill();
    c.fillRect(-r * 0.4, -r * 0.9, 2, 4);
    c.fillRect(-r * 0.4, r * 0.5, 2, 4);
  } else if (type === 'splitter'){
    // 안에 작은 두 원이 보이는 큰 원
    c.beginPath();
    c.arc(0, 0, r, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#1a0b30';
    c.beginPath();
    c.arc(-r * 0.4, 0, r * 0.32, 0, Math.PI * 2);
    c.arc(r * 0.4, 0, r * 0.32, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = color;
    c.beginPath();
    c.arc(-r * 0.4, 0, r * 0.2, 0, Math.PI * 2);
    c.arc(r * 0.4, 0, r * 0.2, 0, Math.PI * 2);
    c.fill();
  } else if (type === 'shielded'){
    // 사각 + 안에 방패 모양
    c.fillRect(-r * 0.9, -r * 0.9, r * 1.8, r * 1.8);
    c.fillStyle = '#1a0b30';
    c.beginPath();
    c.moveTo(0, -r * 0.6);
    c.lineTo(r * 0.5, -r * 0.2);
    c.lineTo(r * 0.5, r * 0.3);
    c.lineTo(0, r * 0.55);
    c.lineTo(-r * 0.5, r * 0.3);
    c.lineTo(-r * 0.5, -r * 0.2);
    c.closePath();
    c.fill();
  } else if (type === 'boss'){
    // 회전 별 + 안쪽 코어
    c.rotate(time * 0.6);
    c.beginPath();
    for (let i = 0; i < 10; i++){
      const ang = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const rr = i % 2 === 0 ? r : r * 0.55;
      const px = Math.cos(ang) * rr;
      const py = Math.sin(ang) * rr;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
    c.strokeStyle = '#fff';
    c.lineWidth = 1.5;
    c.stroke();
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(0, 0, r * 0.25, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}

/* ============================================================
 * Loop
 * ============================================================ */
function startLoop(){
  lastFrameTs = performance.now();
  rafId = requestAnimationFrame(loop);
}
function loop(ts){
  rafId = requestAnimationFrame(loop);
  const dtRaw = Math.min(0.05, (ts - lastFrameTs) / 1000);
  lastFrameTs = ts;
  if (!state.paused && !state.codexOpen && state.waveState !== 'won' && state.waveState !== 'lost'){
    const dt = dtRaw * state.speed;
    step(dt);
  }
  render();
}

/* ============================================================
 * Codex (도감)
 * ============================================================ */
function toggleCodex(){
  const cb = document.getElementById('codex-backdrop');
  if (!cb) return;
  if (cb.classList.contains('on')) closeCodex();
  else openCodex();
}
function openCodex(){
  state.codexOpen = true;
  const panel = document.getElementById('codex-panel');
  panel.innerHTML = buildCodexHTML();
  document.getElementById('codex-backdrop').classList.add('on');
  drawCodexPreviews();
  document.getElementById('codex-close-btn').onclick = closeCodex;
}
function closeCodex(){
  state.codexOpen = false;
  document.getElementById('codex-backdrop').classList.remove('on');
}
function describeFire(f){
  return ({
    single: '단일 빔',
    aoe: '광역 폭발',
    slow: '단일 + 슬로우',
    pierce: '관통 라인',
    melee: '근접 sweep',
    missile: '추적 미사일'
  })[f] || f;
}
function buildCodexHTML(){
  let html = '<h2>도감 & 합성표</h2>';
  html += `<div class="lead">같은 종류 + 같은 등급 3개 → 1단 위로 합성. 모든 능력치는 데이터 객체로 정의되어 즉시 변경 가능.</div>`;

  html += '<h3>합성 체인</h3>';
  for (const kind of KIND_ORDER){
    const def = TOWER_STATS[kind];
    html += `<div style="margin-top: 6px;"><span style="color:${def.color}; font-weight:800; letter-spacing:.06em;">${def.name}</span>` +
      ` <span style="color:#9a8cd6; font-size:11px;">— ${describeFire(def.fire)}</span></div>`;
    html += '<div class="tower-chain">';
    for (let tier = 1; tier <= 4; tier++){
      const s = def.tiers[tier];
      const extra = def.fire === 'aoe' && s.aoeRadius ? `<br>aoe ${s.aoeRadius}` :
                     def.fire === 'slow' ? `<br>${Math.round((1 - s.slowFactor)*100)}% ${s.slowDur}s` :
                     def.fire === 'missile' ? `<br>aoe ${s.aoeRadius}` :
                     def.fire === 'melee' ? `<br>sweep` : '';
      html += `<div class="tower-card-mini">
        <canvas data-tower="${kind}-${tier}"></canvas>
        <div class="lbl">${'★'.repeat(tier)}</div>
        <div class="sub">${s.dmg}d · ${s.range}r${extra}</div>
      </div>`;
      if (tier < 4) html += '<div class="chain-arrow">×3</div>';
    }
    html += '</div>';
  }

  html += '<h3>적 도감</h3>';
  html += '<div class="enemy-grid">';
  for (const key in ENEMY_STATS){
    const def = ENEMY_STATS[key];
    const shieldStr = def.shield ? ` +${def.shield}🛡` : '';
    html += `<div class="enemy-card">
      <canvas data-enemy="${key}"></canvas>
      <div class="name" style="color:${def.color}">${def.name}</div>
      <div class="stats">HP ${def.hp}${shieldStr} · ${def.speed}px/s · +${def.gold}g</div>
      <div class="desc">${def.desc}</div>
    </div>`;
  }
  html += '</div>';

  html += '<h3>뽑기 확률</h3>';
  const totalW = Object.values(KIND_WEIGHT).reduce((a, b) => a + b, 0);
  html += '<div class="lead">';
  html += '<b>등급</b>: ';
  html += TIER_ROLL_PROB.map((p, i) => `${i+1}★ ${(p*100).toFixed(0)}%`).filter(s => !s.endsWith('0%')).join(' · ');
  html += '<br><b>종류</b>: ';
  html += KIND_ORDER.map(k => `${TOWER_STATS[k].name} ${(KIND_WEIGHT[k]/totalW*100).toFixed(0)}%`).join(' · ');
  html += '</div>';

  html += '<button class="codex-close" id="codex-close-btn">닫기 (Esc / C)</button>';
  return html;
}
function drawCodexPreviews(){
  // 타워 미리보기
  for (const cv of document.querySelectorAll('canvas[data-tower]')){
    const [kind, tierStr] = cv.dataset.tower.split('-');
    const tier = parseInt(tierStr, 10);
    const def = TOWER_STATS[kind];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = 56 * dpr; cv.height = 56 * dpr;
    cv.style.width = '56px'; cv.style.height = '56px';
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    c.translate(28, 30);
    if (tier === 4){
      c.save();
      c.strokeStyle = 'rgba(255,217,107,.6)';
      c.lineWidth = 1.5;
      c.shadowColor = '#ffd96b';
      c.shadowBlur = 10;
      c.setLineDash([3, 3]);
      c.beginPath();
      c.arc(0, 0, 22, 0, Math.PI * 2);
      c.stroke();
      c.setLineDash([]);
      c.restore();
    }
    const t = { kind, tier, color: def.color };
    c.save();
    c.shadowColor = def.color;
    c.shadowBlur = 4 + tier * 1.5;
    drawTowerBody(c, t);
    c.restore();
    drawTierPips(c, t);
  }
  // 적 미리보기
  for (const cv of document.querySelectorAll('canvas[data-enemy]')){
    const key = cv.dataset.enemy;
    const def = ENEMY_STATS[key];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = 48 * dpr; cv.height = 48 * dpr;
    cv.style.width = '48px'; cv.style.height = '48px';
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    drawEnemyShape(c, 24, 24, key, def.color, def.r, 0);
    // shielded일 경우 보호막 원
    if (def.shield){
      c.save();
      c.strokeStyle = '#9ab0ff';
      c.lineWidth = 1.5;
      c.shadowColor = '#9ab0ff';
      c.shadowBlur = 6;
      c.beginPath();
      c.arc(24, 24, def.r + 3, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
  }
}

/* ============================================================
 * Overlay helpers
 * ============================================================ */
function setOverlay(html, interactive){
  if (!overlayEl) return;
  overlayEl.innerHTML = html;
  overlayEl.classList.toggle('on', !!interactive);
}
function clearOverlay(){
  if (!overlayEl) return;
  overlayEl.innerHTML = '';
  overlayEl.classList.remove('on');
}

init();
window.__GAME__ = { KEY };
</script>
