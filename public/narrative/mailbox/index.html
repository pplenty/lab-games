<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마지막 우편함</title>
<style>
  :root{
    --bg-1:#0b0e14;
    --bg-2:#141a24;
    --amber:#d9a05b;
    --amber-soft:#c98f4a;
    --ink:#e6ddcf;
    --ink-dim:#8c8577;
    --ink-faint:#5a5649;
    --paper:#1a1f28;
    --paper-2:#232a36;
    --accent:#8fa1b3;
    --warn:#a84e4e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at top, #1a1f2c 0%, var(--bg-1) 55%, #05070b 100%);
    color: var(--ink);
    font-family: "Noto Serif KR","Nanum Myeongjo","IBM Plex Serif",Georgia,"Apple SD Gothic Neo",serif;
    font-size:17px;
    line-height:1.9;
    letter-spacing:0.01em;
    overflow-x:hidden;
    min-height:100%;
  }
  #rain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;}
  #rain .drop{position:absolute;top:-10%;width:1px;height:70px;background:linear-gradient(to bottom,transparent,rgba(180,200,220,.6));animation:fall linear infinite;}
  @keyframes fall{to{transform:translateY(120vh);}}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%);z-index:1;}
  main{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:7vh 28px 30vh;}
  h1.title{
    font-size:34px;font-weight:400;letter-spacing:0.1em;text-align:center;
    color:var(--amber);margin-bottom:0.4em;
  }
  .subtitle{text-align:center;color:var(--ink-dim);font-size:14px;margin-bottom:3em;letter-spacing:0.2em;}
  .story{display:flex;flex-direction:column;gap:1.35em;}
  .node{opacity:0;transform:translateY(6px);animation:fadein .9s ease forwards;}
  @keyframes fadein{to{opacity:1;transform:translateY(0);}}
  .n{color:var(--ink);}
  .n.emphasis{color:#f0e6d4;font-style:italic;}
  .s{color:var(--ink);}
  .s .name{color:var(--amber-soft);font-weight:600;letter-spacing:0.03em;margin-right:0.4em;font-size:14px;display:block;margin-bottom:0.2em;}
  .s .name::after{content:"";}
  .s .emotion{color:var(--ink-faint);font-size:13px;font-style:italic;margin-left:0.3em;}
  .s .text{color:#f2e9d9;padding-left:1em;border-left:1px solid var(--amber-soft);display:block;}
  .s.ha .name{color:#c9a97a;}
  .s.minjae .name{color:#a09184;}
  .s.yoonseo .name{color:#d9a8a3;}
  .s.siwoo .name{color:#9fb2c2;}
  .s.mother .name{color:#e8c9aa;}
  .s.mother .text{font-style:italic;}
  .separator{height:1px;background:linear-gradient(to right,transparent,var(--ink-faint),transparent);margin:1.5em 0;}
  .scene-tag{color:var(--ink-faint);font-size:12px;text-align:center;letter-spacing:0.35em;padding:1em 0;text-transform:uppercase;}
  .choices{display:flex;flex-direction:column;gap:10px;margin:2em 0 1em;}
  .choice-btn{
    background:transparent;color:var(--ink);font:inherit;font-size:16px;
    border:1px solid var(--ink-faint);padding:14px 18px;cursor:pointer;
    text-align:left;transition:all .3s ease;border-radius:2px;
  }
  .choice-btn:hover:not(:disabled){border-color:var(--amber);color:#fff;background:rgba(217,160,91,.06);}
  .choice-btn:disabled{opacity:.35;cursor:not-allowed;border-style:dashed;}
  .choice-btn.danger{color:#b07a7a;border-color:#3a2424;font-size:14px;font-style:italic;}
  .choice-btn.danger:hover:not(:disabled){border-color:var(--warn);color:#d99;}
  .continue-hint{
    color:var(--ink-faint);font-size:13px;text-align:center;margin-top:1em;
    animation:blink 2s ease-in-out infinite;letter-spacing:0.3em;
  }
  @keyframes blink{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .ending-card{
    border:1px solid var(--amber-soft);padding:2em 1.5em;margin-top:3em;text-align:center;
    background:rgba(26,31,40,.5);
  }
  .ending-card .label{color:var(--ink-faint);font-size:13px;letter-spacing:0.4em;}
  .ending-card .name{color:var(--amber);font-size:26px;margin:0.6em 0;letter-spacing:0.05em;}
  .ending-card .summary{color:var(--ink-dim);font-size:14px;font-style:italic;}
  .gallery{margin-top:2em;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .gallery .slot{
    border:1px solid var(--ink-faint);padding:8px 4px;font-size:12px;text-align:center;
    color:var(--ink-faint);border-radius:2px;
  }
  .gallery .slot.got{border-color:var(--amber);color:var(--amber);}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-top:2em;flex-wrap:wrap;}
  .btn-row button{
    background:transparent;color:var(--ink);font:inherit;border:1px solid var(--amber-soft);
    padding:11px 22px;cursor:pointer;letter-spacing:0.1em;transition:all .2s;
  }
  .btn-row button:hover{background:var(--amber);color:#1a1410;}
  #title-screen{text-align:center;padding-top:22vh;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:15vh;}
  #title-screen .logline{color:var(--ink-dim);font-size:15px;margin:1em auto 3em;max-width:26em;line-height:1.9;font-style:italic;}
  #title-screen .hint{color:var(--ink-faint);font-size:12px;margin-top:4em;letter-spacing:0.2em;}
  .letter-icon{font-size:28px;color:var(--amber-soft);margin-bottom:1em;letter-spacing:0.4em;}
  .clock{color:var(--ink-faint);font-size:12px;text-align:center;margin-top:3em;letter-spacing:0.3em;}
  .credits{color:var(--ink-faint);font-size:12px;text-align:center;margin-top:4em;letter-spacing:0.15em;}
  @media(max-width:540px){
    body{font-size:16px;}
    main{padding:5vh 18px 25vh;}
    h1.title{font-size:28px;}
    .gallery{grid-template-columns:repeat(5,1fr);font-size:10px;}
  }
</style>
</head>
<body>
<div id="rain"></div>
<div class="vignette"></div>
<main id="app"></main>

<script>
/* =========================================================
   『마지막 우편함』 — interactive fiction engine (single-file)
   ========================================================= */

/* ---------- Rain ambience ---------- */
(function(){
  const r = document.getElementById('rain');
  const count = Math.min(120, Math.floor(window.innerWidth/10));
  for(let i=0;i<count;i++){
    const d = document.createElement('div');
    d.className='drop';
    d.style.left = Math.random()*100+'vw';
    d.style.animationDuration = (0.6 + Math.random()*1.2)+'s';
    d.style.animationDelay = (Math.random()*-2)+'s';
    d.style.height = (40 + Math.random()*60)+'px';
    d.style.opacity = (0.2 + Math.random()*0.6);
    r.appendChild(d);
  }
})();

/* ---------- Node DSL ---------- */
const n = (text, cls) => ({t:'n', text, cls});
const s = (who, text, emotion) => ({t:'s', who, text, emotion});
const f = (obj) => ({t:'f', flags:obj});
const inc = (field) => ({t:'inc', field});
const L  = (id) => ({t:'l', id});
const J  = (id) => ({t:'j', label:id});
const GO = (scene) => ({t:'g', scene});
const IF = (cond, jumpLabel) => ({t:'b', cond, jump:jumpLabel});
const UNLESS = (cond, jumpLabel) => ({t:'b', cond: st => !cond(st), jump:jumpLabel});
const C  = (id, options) => ({t:'c', id, options});
const CD = (id, build) => ({t:'cd', id, build});
const SEP = () => ({t:'sep'});
const TAG = (text) => ({t:'tag', text});

/* ---------- Game state ---------- */
const FRESH_FLAGS = {
  seen_clue_1:false,seen_clue_2:false,seen_clue_3:false,seen_clue_4:false,
  seen_clue_5:false,seen_clue_6:false,seen_clue_7:false,
  curious_type:null, first_talked:null,
  yoonseo_bond:false, minjae_truth:null, self_hint:false,
  cafe_rule_heard:false, mirror_checked:false, rule_broken:false,
  hint_upstairs:false, letter_picked_up:false, noticed_empty_street:false,
  observed_mirror:false, observed_letters:false, observed_photo:false,
  yoonseo_met:false, minjae_met:false, upstairs_done:false,
  ending_locked:null, ending_confirmed:null,
  observations:0
};
const state = {
  flags: {...FRESH_FLAGS},
  sceneId: null,
  pc: 0,
  awaiting: false
};
function seenClues(st){
  let c=0; for(let i=1;i<=7;i++) if(st.flags['seen_clue_'+i]) c++;
  return c;
}

/* ---------- Ending metadata ---------- */
const ENDINGS = {
  A:{name:"잘 다녀왔어",        summary:"슬프지만 따뜻한 해방"},
  B:{name:"비가 그치지 않아",    summary:"머무르기로 한 자의 고요"},
  C:{name:"우리, 같이 가자",     summary:"서로를 용서한 두 사람"},
  D:{name:"다음 손님이 오시네요", summary:"배웅하는 자의 계승 (히든)"},
  X:{name:"잘못 든 길",          summary:"규칙을 저버린 자의 추방"}
};
const ENDING_ORDER = ['A','B','C','D','X'];
function unlocked(){
  try{ return JSON.parse(localStorage.getItem('mailbox_unlocked')||'{}'); }
  catch(e){ return {}; }
}
function saveUnlocked(id){
  const u = unlocked(); u[id]=true;
  try{ localStorage.setItem('mailbox_unlocked', JSON.stringify(u)); }catch(e){}
}

/* ---------- Rendering ---------- */
const app = document.getElementById('app');
let storyEl = null;
let choicesEl = null;
let hintEl = null;

function clearScreen(){ app.innerHTML=''; }
function mountStory(){
  clearScreen();
  storyEl = document.createElement('div'); storyEl.className='story';
  choicesEl = document.createElement('div'); choicesEl.className='choices';
  hintEl = document.createElement('div'); hintEl.className='continue-hint'; hintEl.textContent='▼  계속 (클릭 또는 스페이스)';
  app.appendChild(storyEl);
  app.appendChild(choicesEl);
  app.appendChild(hintEl);
  hintEl.style.display='none';
}
function addNode(html, cls){
  const d = document.createElement('div');
  d.className='node '+(cls||'');
  d.innerHTML = html;
  storyEl.appendChild(d);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}
function addSceneTag(text){
  const d = document.createElement('div'); d.className='scene-tag'; d.textContent=text;
  storyEl.appendChild(d);
}
function addSeparator(){
  const d = document.createElement('div'); d.className='separator'; storyEl.appendChild(d);
}
function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- Scene execution ---------- */
function loadScene(id){
  state.sceneId = id;
  state.pc = 0;
  advance();
}
function findLabel(nodes, id){
  for(let i=0;i<nodes.length;i++) if(nodes[i].t==='l' && nodes[i].id===id) return i;
  return -1;
}
function evalCond(cond){ try{ return !!cond(state); }catch(e){ console.warn(e); return false; } }

function advance(){
  const scene = SCENES[state.sceneId];
  if(!scene){ console.error('unknown scene', state.sceneId); return; }
  const nodes = scene;
  while(state.pc < nodes.length){
    const node = nodes[state.pc];
    state.pc++;
    switch(node.t){
      case 'l': continue;
      case 'f':
        Object.assign(state.flags, node.flags);
        continue;
      case 'inc':
        state.flags[node.field] = (state.flags[node.field]||0)+1;
        continue;
      case 'j': {
        const idx = findLabel(nodes, node.label);
        if(idx<0){ console.error('missing label', node.label); return; }
        state.pc = idx+1;
        continue;
      }
      case 'g':
        return loadScene(node.scene);
      case 'b':
        if(evalCond(node.cond)){
          const idx = findLabel(nodes, node.jump);
          if(idx>=0) state.pc = idx+1;
        }
        continue;
      case 'n':
        addNode('<div class="n '+(node.cls||'')+'">'+escapeHtml(node.text)+'</div>');
        waitUser();
        return;
      case 's': {
        const who = node.who;
        const nameMap = {ha:'하 선생', minjae:'정민재', yoonseo:'윤서', siwoo:'시우', mother:'어머니'};
        const cls = 's '+who;
        const nm = nameMap[who]||who;
        const em = node.emotion?'<span class="emotion">('+escapeHtml(node.emotion)+')</span>':'';
        addNode('<div class="'+cls+'"><span class="name">'+nm+em+'</span><span class="text">'+escapeHtml(node.text)+'</span></div>');
        waitUser();
        return;
      }
      case 'sep':
        addSeparator();
        continue;
      case 'tag':
        addSceneTag(node.text);
        continue;
      case 'c':
        showChoice(node);
        return;
      case 'cd': {
        const built = node.build(state);
        showChoice({id:node.id, options:built});
        return;
      }
      case 'end':
        showEndingCard(node.id);
        return;
    }
  }
  console.log('scene ended without goto', state.sceneId);
}

let userClickHandler = null;
function waitUser(){
  state.awaiting = true;
  hintEl.style.display='block';
  userClickHandler = () => {
    if(!state.awaiting) return;
    state.awaiting = false;
    hintEl.style.display='none';
    advance();
  };
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('button')) return;
  if(userClickHandler) userClickHandler();
});
document.addEventListener('keydown', (e)=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(userClickHandler) userClickHandler();
  }
  // number keys for choices
  if(/^Digit[1-9]$/.test(e.code)){
    const btn = choicesEl.querySelectorAll('button.choice-btn')[parseInt(e.code.slice(5))-1];
    if(btn && !btn.disabled) btn.click();
  }
});

function showChoice(node){
  hintEl.style.display='none';
  state.awaiting = false;
  choicesEl.innerHTML='';
  const visibleOpts = [];
  node.options.forEach((opt)=>{
    if(opt.show && !opt.show(state)) return;
    visibleOpts.push(opt);
  });
  visibleOpts.forEach((opt,idx)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (opt.danger?' danger':'');
    const unlockedCond = opt.cond ? evalCond(opt.cond) : true;
    btn.textContent = (idx+1)+'.  '+opt.text + (opt.hint && !unlockedCond?'  '+opt.hint:'');
    if(!unlockedCond) btn.disabled = true;
    btn.onclick = ()=>{
      choicesEl.innerHTML='';
      if(opt.flags) Object.assign(state.flags, opt.flags);
      if(opt.inc) state.flags[opt.inc] = (state.flags[opt.inc]||0)+1;
      if(opt.goto){ loadScene(opt.goto); return; }
      if(opt.jump){
        const idx2 = findLabel(SCENES[state.sceneId], opt.jump);
        if(idx2<0){ console.error('missing jump label', opt.jump); return; }
        state.pc = idx2+1;
        advance();
        return;
      }
      advance();
    };
    choicesEl.appendChild(btn);
  });
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

/* ---------- Title / ending screens ---------- */
function showTitle(){
  clearScreen();
  const u = unlocked();
  const endings = ENDING_ORDER.map(id=>{
    const got = u[id];
    const label = got ? '엔딩 '+id+'<br><span style="font-size:10px;">'+ENDINGS[id].name+'</span>' : '? ? ?';
    return '<div class="slot '+(got?'got':'')+'">'+label+'</div>';
  }).join('');
  const anyUnlocked = Object.keys(u).length>0;
  const title = document.createElement('div');
  title.id='title-screen';
  title.innerHTML = `
    <div class="letter-icon">&#9993;</div>
    <h1 class="title">마지막 우편함</h1>
    <div class="subtitle">T H E &nbsp; L A S T &nbsp; M A I L B O X</div>
    <div class="logline">
      비 오는 밤, 낡은 카페로 흘러든 한 통의 편지 —<br>
      그 편지의 주인을 찾는 동안, 주인공은<br>
      자신이 누구인지를 잊고 있었다는 사실을 깨닫는다.
    </div>
    <div class="btn-row">
      <button id="btn-start">이 야기 를  시 작 한 다</button>
    </div>
    ${ anyUnlocked ? '<div class="gallery">'+endings+'</div><div class="clock">도달한 엔딩 — '+Object.keys(u).length+' / 5</div>' : '' }
    <div class="hint">플레이타임 약 15~20분 · 클릭 또는 스페이스로 진행</div>
    <div class="credits">written &amp; built by Claude · 2026</div>
  `;
  app.appendChild(title);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  state.flags = {...FRESH_FLAGS};
  mountStory();
  loadScene('S1_arrival');
}

function showEndingCard(endId){
  saveUnlocked(endId);
  const meta = ENDINGS[endId];
  const u = unlocked();
  const endings = ENDING_ORDER.map(id=>{
    const got = u[id];
    const label = got ? '엔딩 '+id+'<br><span style="font-size:10px;">'+ENDINGS[id].name+'</span>' : '? ? ?';
    return '<div class="slot '+(got?'got':'')+'">'+label+'</div>';
  }).join('');
  const card = document.createElement('div');
  card.className='node';
  card.innerHTML = `
    <div class="ending-card">
      <div class="label">E N D I N G &nbsp; ${endId}</div>
      <div class="name">${meta.name}</div>
      <div class="summary">${meta.summary}</div>
    </div>
    <div class="gallery">${endings}</div>
    <div class="btn-row">
      <button onclick="showTitle()">처음으로 돌아가기</button>
      <button onclick="startGame()">다시 비 오는 밤부터</button>
    </div>
    <div class="clock">도달한 엔딩 — ${Object.keys(u).length} / 5</div>
  `;
  storyEl.appendChild(card);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

/* ---------- Story Data ---------- */
const SCENES = {
/* ------------- S1 : 비의 문턱 ------------- */
S1_arrival: [
  TAG("1. 비의 문턱"),
  n("빗소리가 귓가에 남는다."),
  n("우산은 손에 들려 있지만, 펼친 기억이 없다. 어쩐지, 펼쳐본 적이 없는 것 같다."),
  n("골목 끝, 오래된 양옥 한 채. 흔들리는 낡은 간판에는 세 글자."),
  n("\"우편함.\"", 'emphasis'),
  n("창문 안쪽은 주황빛. 재즈 LP의 지직거리는 소리가 문틈으로 새어나온다."),
  n("옷깃을 만져본다. 비를 맞았는데, 생각보다 젖지 않았다. …그랬던가."),
  f({seen_clue_1:true}),
  C("CH_enter", [
    { text: "문을 민다.", jump: "enter_door" },
    { text: "잠시 더 밖에 서 있는다.", jump: "hesitate" }
  ]),

  L("enter_door"),
  n("문을 밀자 머리 위에서 종이 울렸다. 따뜻한 공기, 원두 냄새, 낡은 종이 냄새."),
  n("카운터 안쪽, 흰머리를 단정히 빗어넘긴 노인이 고개를 든다."),
  s('ha',"어서 오세요. 자리는, 편한 곳에.","부드럽게"),
  n("무언가 이상하다. 이 사람은 놀라지 않았다. 아주 오래전부터 나를 기다려온 사람처럼."),
  J("common_interior"),

  L("hesitate"),
  n("고개를 들어 거리를 본다."),
  n("가로등 불빛이 물웅덩이에 번진다. 빗줄기가 그 위로 떨어진다. 그런데."),
  n("지나가는 사람이 한 명도 없다. 차 소리도 없다. 세상이 이 골목만 잊은 것 같다."),
  f({noticed_empty_street:true}),
  n("…오래 서 있을 일은 아니다. 나는 문을 밀었다."),
  s('ha',"어서 오세요. 자리는, 편한 곳에.","부드럽게"),
  J("common_interior"),

  L("common_interior"),
  n("카페는 좁지도 넓지도 않다. 테이블 네 개, 창가 한 자리, 바 자리 셋. 벽에는 오래된 편지봉투 액자들."),
  n("창가 자리엔 검은 니트를 입은 남자가 위스키를 돌리고 있다. 카운터 뒤에선 짧은 머리의 바리스타가 컵을 닦으며 나를 흘긋 본다."),
  C("CH0_first_action", [
    { text: "하 선생에게 말을 건다 — \"실례합니다, 이 카페 이름이…?\"", jump: "talk_ha", flags:{curious_type:'adventurous'} },
    { text: "말없이 창가 쪽 빈자리에 앉는다.", jump: "sit_quiet", flags:{curious_type:'reserved'} }
  ]),

  L("talk_ha"),
  s('siwoo',"실례합니다. 이 카페 이름이… '우편함', 맞나요?"),
