<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안 걸은 길에서 온 전화</title>
<style>
  :root{
    --bg-1:#0c1624;
    --bg-2:#152338;
    --amber:#e5b86a;
    --amber-soft:#d69a4c;
    --amber-glow:#f0c77a;
    --ink:#ece3d0;
    --ink-dim:#8d8776;
    --ink-faint:#5d5849;
    --paper:#1a2537;
    --paper-2:#23304a;
    --accent-cool:#6f8aa8;
    --accent-warm:#c96e5a;
    --kakao-bg:#fde66c;
    --kakao-ink:#1f1e1a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 20% 10%, #1e2e48 0%, var(--bg-1) 55%, #050811 100%);
    color: var(--ink);
    font-family: "Noto Serif KR","Nanum Myeongjo","IBM Plex Serif",Georgia,"Apple SD Gothic Neo",serif;
    font-size:17px;
    line-height:1.9;
    letter-spacing:0.01em;
    overflow-x:hidden;
    min-height:100%;
    transition: background 1.2s ease;
  }
  body.warm{
    background: radial-gradient(ellipse at 25% 15%, #2a2e3c 0%, #14182a 55%, #05070f 100%);
  }
  /* Slow city lights drift */
  #citynight{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.45;overflow:hidden;}
  #citynight .spark{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(240,199,122,.6);box-shadow:0 0 4px rgba(240,199,122,.5);animation:drift linear infinite;}
  #citynight .train{position:absolute;height:1px;background:linear-gradient(to right,transparent,rgba(200,220,240,.35),transparent);animation:trainDrift linear infinite;}
  @keyframes drift{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:.7;}
    90%{opacity:.5;}
    100%{transform:translateY(-30vh) translateX(20px);opacity:0;}
  }
  @keyframes trainDrift{
    0%{transform:translateX(-20vw);opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateX(120vw);opacity:0;}
  }
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.5) 100%);z-index:1;}
  main{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:7vh 28px 30vh;}
  h1.title{
    font-size:32px;font-weight:400;letter-spacing:0.08em;text-align:center;
    color:var(--amber);margin-bottom:0.3em;
  }
  .subtitle{text-align:center;color:var(--ink-dim);font-size:13px;margin-bottom:3em;letter-spacing:0.25em;}
  .story{display:flex;flex-direction:column;gap:1.35em;}
  .node{opacity:0;transform:translateY(6px);animation:fadein .9s ease forwards;}
  @keyframes fadein{to{opacity:1;transform:translateY(0);}}
  .n{color:var(--ink);}
  .n.emphasis{color:#f5e7c4;font-style:italic;}
  .n.bell{color:var(--amber-glow);font-weight:600;letter-spacing:.1em;text-align:center;font-size:18px;}
  .n.kakao{
    display:inline-block;background:var(--kakao-bg);color:var(--kakao-ink);
    padding:8px 14px;border-radius:14px 14px 14px 2px;font-size:14px;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    margin-left:1.5em;max-width:85%;
  }
  .n.kakao.me{background:#fde88a;border-radius:14px 14px 2px 14px;margin-left:auto;margin-right:1.5em;align-self:flex-end;}
  .n.kakao-wrap{display:flex;flex-direction:column;}
  .s{color:var(--ink);}
  .s .name{color:var(--amber-soft);font-weight:600;letter-spacing:0.03em;margin-right:0.4em;font-size:14px;display:block;margin-bottom:0.2em;}
  .s .emotion{color:var(--ink-faint);font-size:13px;font-style:italic;margin-left:0.3em;}
  .s .text{color:#f4eadb;padding-left:1em;border-left:1px solid var(--amber-soft);display:block;}
  .s.A .name{color:#a7b9cc;}
  .s.A .text{border-left-color:#a7b9cc;}
  .s.B .name{color:#dcb17c;}
  .s.B .text{border-left-color:#dcb17c;font-style:italic;}
  .s.yeoreum .name{color:#c96e5a;}
  .s.yeoreum .text{border-left-color:#c96e5a;}
  .separator{height:1px;background:linear-gradient(to right,transparent,var(--ink-faint),transparent);margin:1.5em 0;}
  .scene-tag{color:var(--ink-faint);font-size:12px;text-align:center;letter-spacing:0.35em;padding:1em 0;text-transform:uppercase;}
  .choices{display:flex;flex-direction:column;gap:10px;margin:2em 0 1em;}
  .choice-btn{
    background:transparent;color:var(--ink);font:inherit;font-size:16px;
    border:1px solid var(--ink-faint);padding:14px 18px;cursor:pointer;
    text-align:left;transition:all .3s ease;border-radius:2px;
  }
  .choice-btn:hover:not(:disabled){border-color:var(--amber);color:#fff;background:rgba(229,184,106,.07);}
  .choice-btn:disabled{opacity:.35;cursor:not-allowed;border-style:dashed;}
  .choice-btn.special{border-color:var(--amber-soft);color:var(--amber-glow);}
  .choice-btn.special:hover:not(:disabled){background:rgba(229,184,106,.12);}
  .continue-hint{
    color:var(--ink-faint);font-size:13px;text-align:center;margin-top:1em;
    animation:blink 2s ease-in-out infinite;letter-spacing:0.3em;
  }
  @keyframes blink{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .ending-card{
    border:1px solid var(--amber-soft);padding:2em 1.5em;margin-top:3em;text-align:center;
    background:rgba(26,37,55,.5);
  }
  .ending-card .label{color:var(--ink-faint);font-size:13px;letter-spacing:0.4em;}
  .ending-card .name{color:var(--amber);font-size:26px;margin:0.6em 0;letter-spacing:0.05em;}
  .ending-card .summary{color:var(--ink-dim);font-size:14px;font-style:italic;}
  .gallery{margin-top:2em;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .gallery .slot{
    border:1px solid var(--ink-faint);padding:8px 4px;font-size:12px;text-align:center;
    color:var(--ink-faint);border-radius:2px;
  }
  .gallery .slot.got{border-color:var(--amber);color:var(--amber);}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-top:2em;flex-wrap:wrap;}
  .btn-row button{
    background:transparent;color:var(--ink);font:inherit;border:1px solid var(--amber-soft);
    padding:11px 22px;cursor:pointer;letter-spacing:0.1em;transition:all .2s;
  }
  .btn-row button:hover{background:var(--amber);color:#1a1410;}
  #title-screen{text-align:center;padding-top:22vh;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:15vh;}
  #title-screen .logline{color:var(--ink-dim);font-size:15px;margin:1em auto 3em;max-width:28em;line-height:1.9;font-style:italic;}
  #title-screen .hint{color:var(--ink-faint);font-size:12px;margin-top:4em;letter-spacing:0.2em;}
  .phone-icon{font-size:36px;color:var(--amber);margin-bottom:.6em;filter:drop-shadow(0 0 8px rgba(229,184,106,.4));}
  .clock{color:var(--ink-faint);font-size:12px;text-align:center;margin-top:3em;letter-spacing:0.3em;}
  .credits{color:var(--ink-faint);font-size:12px;text-align:center;margin-top:4em;letter-spacing:0.15em;}
  .ring-anim{animation:ring .8s ease-in-out 3;}
  @keyframes ring{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-3px) rotate(-2deg);}
    75%{transform:translateX(3px) rotate(2deg);}
  }
  @media(max-width:540px){
    body{font-size:16px;}
    main{padding:5vh 18px 25vh;}
    h1.title{font-size:26px;}
    .gallery{grid-template-columns:repeat(6,1fr);font-size:10px;}
  }
</style>
</head>
<body>
<div id="citynight"></div>
<div class="vignette"></div>
<main id="app"></main>

<script>
/* =========================================================
   『안 걸은 길에서 온 전화』 — 2번작
   엔진은 game.html과 동일 구조.
   ========================================================= */

/* ---------- City night ambience ---------- */
(function(){
  const layer = document.getElementById('citynight');
  const sparkCount = Math.min(70, Math.floor(window.innerWidth/18));
  for(let i=0;i<sparkCount;i++){
    const d = document.createElement('div');
    d.className='spark';
    d.style.left = Math.random()*100+'vw';
    d.style.top = (60 + Math.random()*40)+'vh';
    d.style.animationDuration = (6 + Math.random()*10)+'s';
    d.style.animationDelay = (Math.random()*-8)+'s';
    d.style.opacity = (0.3 + Math.random()*0.5);
    layer.appendChild(d);
  }
  for(let i=0;i<3;i++){
    const t = document.createElement('div');
    t.className='train';
    t.style.top = (70 + Math.random()*25)+'vh';
    t.style.width = (20 + Math.random()*30)+'vw';
    t.style.animationDuration = (12 + Math.random()*8)+'s';
    t.style.animationDelay = (Math.random()*-12)+'s';
    layer.appendChild(t);
  }
})();

/* ---------- Node DSL ---------- */
const n = (text, cls) => ({t:'n', text, cls});
const s = (who, text, emotion) => ({t:'s', who, text, emotion});
const kakao = (text, me) => ({t:'n', text, cls: 'kakao' + (me?' me':'')});
const bell = (text) => ({t:'n', text, cls:'bell'});
const f = (obj) => ({t:'f', flags:obj});
const L  = (id) => ({t:'l', id});
const J  = (id) => ({t:'j', label:id});
const GO = (scene) => ({t:'g', scene});
const IF = (cond, jumpLabel) => ({t:'b', cond, jump:jumpLabel});
const UNLESS = (cond, jumpLabel) => ({t:'b', cond: st => !cond(st), jump:jumpLabel});
const C  = (id, options) => ({t:'c', id, options});
const CD = (id, build) => ({t:'cd', id, build});
const SEP = () => ({t:'sep'});
const TAG = (text) => ({t:'tag', text});
const WARM = () => ({t:'warm'});

/* ---------- Game state ---------- */
const FRESH_FLAGS = {
  picked_up:false,
  tone:null,
  shared_deep:false,
  compare_mode:null,
  yeoreum_reply:false,
  crack_noticed:false,
  called_who_first:null,
  final_action:null,
  seen_clue_1:false, seen_clue_2:false, seen_clue_3:false,
  seen_clue_4:false, seen_clue_5:false, seen_clue_6:false,
  seen_clue_7:false, seen_clue_7_confirmed:false,
  mirror_speech_1:false, mirror_speech_2:false,
  reached_twist_1:false, reached_twist_2:false,
  stand_tone_warm:false
};
const state = {
  flags: {...FRESH_FLAGS},
  sceneId: null,
  pc: 0,
  awaiting: false
};
function clueCount(st){
  let c=0; for(let i=1;i<=7;i++) if(st.flags['seen_clue_'+i]) c++;
  return c;
}
function s5Density(st){
  const keys = ['seen_clue_1','seen_clue_2','seen_clue_3','seen_clue_4','seen_clue_5','seen_clue_7','seen_clue_7_confirmed','mirror_speech_1','mirror_speech_2','shared_deep','crack_noticed'];
  return keys.reduce((a,k)=>a+(st.flags[k]?1:0),0);
}
function reachedTwist2(st){
  return st.flags.called_who_first === 'confessed'
    || (st.flags.compare_mode === 'mirror' && st.flags.crack_noticed === true);
}

/* ---------- Ending metadata ---------- */
const ENDINGS = {
  A:{name:"내일 아침 커피",       summary:"따뜻한 격려, 소박한 전진"},
  B:{name:"둘 다 틀리지 않았어",  summary:"비교를 내려놓은 다정한 공존"},
  C:{name:"수화기를 내려놓는 법",  summary:"곁의 사람에게 먼저 손을"},
  D:{name:"발코니의 불빛",         summary:"세상이 조금 더 넓어진 밤"},
  H:{name:"다음 벨이 울릴 때",     summary:"먼저 걸어보는 용기 (히든)"},
  MINI:{name:"그 밤의 벨소리",     summary:"받지 않은 밤의 작은 궁금증"}
};
const ENDING_ORDER = ['A','B','C','D','H','MINI'];
function unlocked(){
  try{ return JSON.parse(localStorage.getItem('call_unlocked')||'{}'); }
  catch(e){ return {}; }
}
function saveUnlocked(id){
  const u = unlocked(); u[id]=true;
  try{ localStorage.setItem('call_unlocked', JSON.stringify(u)); }catch(e){}
}

/* ---------- Rendering ---------- */
const app = document.getElementById('app');
let storyEl = null;
let choicesEl = null;
let hintEl = null;

function clearScreen(){ app.innerHTML=''; }
function mountStory(){
  clearScreen();
  storyEl = document.createElement('div'); storyEl.className='story';
  choicesEl = document.createElement('div'); choicesEl.className='choices';
  hintEl = document.createElement('div'); hintEl.className='continue-hint'; hintEl.textContent='▼  계속 (클릭 또는 스페이스)';
  app.appendChild(storyEl);
  app.appendChild(choicesEl);
  app.appendChild(hintEl);
  hintEl.style.display='none';
}
function addNode(html, cls){
  const d = document.createElement('div');
  d.className='node '+(cls||'');
  d.innerHTML = html;
  storyEl.appendChild(d);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}
function addSceneTag(text){
  const d = document.createElement('div'); d.className='scene-tag'; d.textContent=text;
  storyEl.appendChild(d);
}
function addSeparator(){
  const d = document.createElement('div'); d.className='separator'; storyEl.appendChild(d);
}
function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- Scene execution ---------- */
function loadScene(id){
  state.sceneId = id;
  state.pc = 0;
  advance();
}
function findLabel(nodes, id){
  for(let i=0;i<nodes.length;i++) if(nodes[i].t==='l' && nodes[i].id===id) return i;
  return -1;
}
function evalCond(cond){ try{ return !!cond(state); }catch(e){ console.warn(e); return false; } }

function advance(){
  const scene = SCENES[state.sceneId];
  if(!scene){ console.error('unknown scene', state.sceneId); return; }
  const nodes = scene;
  while(state.pc < nodes.length){
    const node = nodes[state.pc];
    state.pc++;
    switch(node.t){
      case 'l': continue;
      case 'f':
        Object.assign(state.flags, node.flags);
        continue;
      case 'j': {
        const idx = findLabel(nodes, node.label);
        if(idx<0){ console.error('missing label', node.label); return; }
        state.pc = idx+1;
        continue;
      }
      case 'g':
        return loadScene(node.scene);
      case 'b':
        if(evalCond(node.cond)){
          const idx = findLabel(nodes, node.jump);
          if(idx>=0) state.pc = idx+1;
        }
        continue;
      case 'warm':
        document.body.classList.add('warm');
        continue;
      case 'n': {
        const cls = node.cls || '';
        if(cls.indexOf('kakao') >= 0){
          addNode('<div class="n '+cls+'">'+escapeHtml(node.text)+'</div>');
        } else {
          addNode('<div class="n '+cls+'">'+escapeHtml(node.text)+'</div>');
        }
        waitUser();
        return;
      }
      case 's': {
        const who = node.who;
        const nameMap = {A:'하진 (이쪽)', B:'하진 (저쪽)', yeoreum:'여름'};
        const cls = 's '+who;
        const nm = nameMap[who]||who;
        const em = node.emotion?'<span class="emotion">('+escapeHtml(node.emotion)+')</span>':'';
        addNode('<div class="'+cls+'"><span class="name">'+nm+em+'</span><span class="text">'+escapeHtml(node.text)+'</span></div>');
        waitUser();
        return;
      }
      case 'sep':
        addSeparator();
        continue;
      case 'tag':
        addSceneTag(node.text);
        continue;
      case 'c':
        showChoice(node);
        return;
      case 'cd': {
        const built = node.build(state);
        showChoice({id:node.id, options:built});
        return;
      }
      case 'end':
        showEndingCard(node.id);
        return;
    }
  }
  console.log('scene ended without goto', state.sceneId);
}

let userClickHandler = null;
function waitUser(){
  state.awaiting = true;
  hintEl.style.display='block';
  userClickHandler = () => {
    if(!state.awaiting) return;
    state.awaiting = false;
    hintEl.style.display='none';
    advance();
  };
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('button')) return;
  if(userClickHandler) userClickHandler();
});
document.addEventListener('keydown', (e)=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(userClickHandler) userClickHandler();
  }
  if(/^Digit[1-9]$/.test(e.code)){
    const btn = choicesEl.querySelectorAll('button.choice-btn')[parseInt(e.code.slice(5))-1];
    if(btn && !btn.disabled) btn.click();
  }
});

function showChoice(node){
  hintEl.style.display='none';
  state.awaiting = false;
  choicesEl.innerHTML='';
  const visibleOpts = [];
  node.options.forEach((opt)=>{
    if(opt.show && !opt.show(state)) return;
    visibleOpts.push(opt);
  });
  visibleOpts.forEach((opt,idx)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (opt.special?' special':'');
    const unlockedCond = opt.cond ? evalCond(opt.cond) : true;
    btn.textContent = (idx+1)+'.  '+opt.text + (opt.hint && !unlockedCond?'  '+opt.hint:'');
    if(!unlockedCond) btn.disabled = true;
    btn.onclick = ()=>{
      choicesEl.innerHTML='';
      if(opt.flags) Object.assign(state.flags, opt.flags);
      if(opt.goto){ loadScene(opt.goto); return; }
      if(opt.jump){
        const idx2 = findLabel(SCENES[state.sceneId], opt.jump);
        if(idx2<0){ console.error('missing jump label', opt.jump); return; }
        state.pc = idx2+1;
        advance();
        return;
      }
      advance();
    };
    choicesEl.appendChild(btn);
  });
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

/* ---------- Title / ending screens ---------- */
function showTitle(){
  document.body.classList.remove('warm');
  clearScreen();
  const u = unlocked();
  const endings = ENDING_ORDER.map(id=>{
    const got = u[id];
    const label = got ? ('엔딩 '+id+'<br><span style="font-size:10px;">'+ENDINGS[id].name+'</span>') : '? ? ?';
    return '<div class="slot '+(got?'got':'')+'">'+label+'</div>';
  }).join('');
  const anyUnlocked = Object.keys(u).length>0;
  const title = document.createElement('div');
  title.id='title-screen';
  title.innerHTML = `
    <div class="phone-icon">&#9742;</div>
    <h1 class="title">안 걸은 길에서 온 전화</h1>
    <div class="subtitle">T H E &nbsp; C A L L &nbsp; F R O M &nbsp; T H E &nbsp; R O A D &nbsp; N O T &nbsp; T A K E N</div>
    <div class="logline">
      늦은 밤, 끊어둔 유선전화가 울린다.<br>
      수화기 너머에서 들려온 건 분명히 내 목소리 —<br>
      다만 내가 한 번도 고른 적 없는 그 "다른 길"의 나였다.
    </div>
    <div class="btn-row">
      <button id="btn-start">수 화 기 를  든 다</button>
    </div>
    ${ anyUnlocked ? '<div class="gallery">'+endings+'</div><div class="clock">도달한 엔딩 — '+Object.keys(u).length+' / 6</div>' : '' }
    <div class="hint">플레이타임 약 15~20분 · 클릭 또는 스페이스로 진행</div>
    <div class="credits">written &amp; built by Claude · 2026</div>
  `;
  app.appendChild(title);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  state.flags = {...FRESH_FLAGS};
  document.body.classList.remove('warm');
  mountStory();
  loadScene('S1_ring');
}

function showEndingCard(endId){
  saveUnlocked(endId);
  const meta = ENDINGS[endId];
  const u = unlocked();
  const endings = ENDING_ORDER.map(id=>{
    const got = u[id];
    const label = got ? ('엔딩 '+id+'<br><span style="font-size:10px;">'+ENDINGS[id].name+'</span>') : '? ? ?';
    return '<div class="slot '+(got?'got':'')+'">'+label+'</div>';
  }).join('');
  const card = document.createElement('div');
  card.className='node';
  card.innerHTML = `
    <div class="ending-card">
      <div class="label">E N D I N G &nbsp; ${endId}</div>
      <div class="name">${meta.name}</div>
      <div class="summary">${meta.summary}</div>
    </div>
    <div class="gallery">${endings}</div>
    <div class="btn-row">
      <button onclick="showTitle()">처음으로 돌아가기</button>
      <button onclick="startGame()">다시 그 밤부터</button>
    </div>
    <div class="clock">도달한 엔딩 — ${Object.keys(u).length} / 6</div>
  `;
  storyEl.appendChild(card);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

/* ---------- Story Data ---------- */
const SCENES = {
/* ------------- S1 : 선이 빠진 전화 ------------- */
S1_ring: [
  TAG("1. 선이 빠진 전화"),
  n("화요일 밤 11시 7분."),
  n("스탠드 조명이 연노란 빛으로 거실 한구석만 밝히고 있다. 소파에 엎어져 있는 책 한 권. 아까 전에 세 페이지 읽다가 놓아둔 것 같은데, 사실 한 시간은 됐다."),

  n("수화기를 어깨와 턱 사이에 끼우고 부엌으로 간다. 선이 팽팽하게 당겨진다. 거실과 부엌이 붙어 있는 게 다행이다."),
  n("전기포트에 물을 올린다."),
  s('B',"야 나도 지금 포트에 물 올리는 중.","수화기 너머"),
  s('A',"…같은 템포네.","웃음"),
  s('B',"응, 같은 템포."),
  n("[전기포트가 딸깍]"),
  n("부엌 한 귀퉁이에 달력이 붙어 있다. 자석으로. 이번 달 달력이다. 무심코 본다."),
  n("오늘 날짜 — 아무 표시도 없다. 당연히 없지. 나는 달력에 뭘 적는 사람이 아니다."),
  s('B',"아, 맞다. 너네 쪽 달력에도 오늘 동그라미 있지?","문득"),
  s('A',"…동그라미?","멈칫"),
  s('B',"어. 오늘 날짜에 네가 직접 그렸잖아. 빨간 볼펜으로."),
  n("달력을 다시 본다. 아무것도 없다. 빈 사각형 하나."),
  f({seen_clue_2:true}),
  s('A',"…어, 나는 아무 표시도 없는데?","말끝 흐림"),
  s('B',"…어? 아닌가? 내가 헷갈렸나.","한 박자 쉬고"),
  n("저쪽도 잠깐 어색해진다. 근데 나는 안다. 저쪽은 헷갈린 게 아니다. 저쪽의 달력엔 진짜로 뭔가 그려져 있는 거다."),
  n("일단 넘어간다. 컵을 꺼낸다."),
  s('A',"야, 나 너랑 얘기하면서 이런 생각 했어. 혹시 이거 과거의 나한테 주식 정보라도 물어봐야 되나 싶은데ㅋㅋ","농담으로 돌리려"),
  s('B',"푸학—!","같은 순간 웃음"),
  s('A',"…어? 너 지금 웃었어?","멈칫"),
  s('B',"어, 웃었어. 근데 나 지금 딴 거 생각하고 있었거든. 여름이가 볼펜을 발로 굴려서.","여전히 웃으면서"),
  s('A',"…그러니까, 서로 다른 거 보고 동시에 웃은 거야?"),
  s('B',"…어. 그렇네."),
  f({seen_clue_5:true}),
  n("이상하다. 이상한데, 그래도 같이 웃었다는 게 묘하게 기분 좋다."),
  n("냉장고가 한 번 쿵 하고 운다. 오래된 냉장고의 그 소리. 이 집에 이사 와서 3년째 듣는 그 소리."),
  n("그 때, 부엌 카운터 위의 핸드폰이 진동한다."),
  n("[카톡 알림]", 'emphasis'),
  kakao("[여름]  자? ㅋㅋ 내일 점심 될까?ㅋㅋㅋㅋ"),

  C("CH_kakao", [
    { text:"(지금 바로 답장한다) \"자는 중ㅋ 낼 점심 콜\"", jump:"kakao_reply", flags:{yeoreum_reply:true} },
    { text:"…이따 답할게. (수화기로 돌아간다)", jump:"kakao_defer", flags:{yeoreum_reply:false} }
  ]),

  L("kakao_reply"),
  n("한 손으로 빠르게 찍는다."),
  kakao("[나]  자는 중ㅋ 낼 점심 콜", true),
  kakao("[여름]  ㅇㅋㅇㅋ 회사 앞 그 김치찌개? ㅠㅠ 좀 걸려도 돼?"),
  kakao("[나]  콜ㅋㅋ 내가 살게", true),
  kakao("[여름]  오 웬일ㅋㅋㅋㅋ 땡큐땡큐"),
  n("보내고 나서 작게 웃는다. 이 애는 대학 때부터 변한 게 없다. 변한 게 없어서 좋다."),
  s('B',"…누구한테 답장했어?","수화기 너머"),
  s('A',"여름이. 내일 점심 먹기로 했어."),
  s('B',"…좋네. 그래, 너 그런 거 좋아했지.","부드럽게"),
  n("그런 거. 그런 게 뭘까."),
  J("kakao_common"),

  L("kakao_defer"),
  n("화면만 확인하고 엎어둔다. 이따가. 이따가 답하자. 지금은 이쪽이다."),
  s('B',"…전화 왔어?","조심스럽게"),
  s('A',"아니, 카톡. 여름이. 내일 점심."),
  s('B',"답 안 해?"),
  s('A',"…이따. 지금은 너랑 얘기하고 싶어서.","말끝 흐림"),
  s('B',"…응. 고마워.","잠시 조용히"),
  J("kakao_common"),

  L("kakao_common"),
  n("전기포트의 물이 한 번 더 찰랑인다. 컵에 티백을 넣고 뜨거운 물을 붓는다. 김이 오른다."),
  s('B',"…근데 너.","조심스럽게"),
  s('A',"응?"),
  s('B',"아까 전화 받을 때 말이야. 혹시… 소파에서 핸드폰 만지고 있지 않았어?"),
  n("수화기를 놓칠 뻔했다."),
  s('A',"…어떻게 알았어?","말끝 흐림"),
  s('B',"나도 그랬거든. 똑같이. 소파에 반쯤 누워서. 화면 꺼진 핸드폰 괜히 켰다 껐다 하고 있었어.","조용히"),
  f({seen_clue_7_confirmed:true}),
  n("손끝이 살짝 차가워진다. 이건 우연이 아니다."),
  n("아니, 우연일 수도 있다. 30대 독신이 밤 11시에 뭘 할 수 있겠나. 대부분 그렇게 있지."),
  n("근데 — 그래도."),

  C("CH_crack", [
    { text:"\"…잠깐, 너 혹시 과거의 내가 아니라 다른… 뭐야?\"", jump:"crack_yes", flags:{crack_noticed:true} },
    { text:"\"뭐 이상한 일이긴 한데… 됐어, 재밌다.\"", jump:"crack_no", flags:{crack_noticed:false} }
  ]),

  L("crack_yes"),
  s('A',"…잠깐. 너 혹시.","조심스럽게, 말끝 흐림"),
  s('A',"과거의 내가 아니라… 다른, 뭐야?"),
  n("수화기 저쪽에서 짧은 침묵. 저쪽도 그 말을 들은 순간 뭔가 굳었다."),
  s('B',"…뭐야, 너 방금 나보다 먼저 생각했어?","한 박자 쉬고"),
  s('A',"너도 지금 그 생각이었어?"),
  s('B',"응. 나도 지금… 어, 이 사람 과거의 내가 맞나, 싶었어. 근데 맞다고 하기엔 너무 많이 어긋나잖아."),
  s('A',"…그치."),
  n("서로가 서로의 생각을 확인했다. 그런데 이 확인이 무섭기보다 — 이상하게, 안도감에 가깝다."),
  J("crack_common"),

  L("crack_no"),
  s('A',"뭐 이상한 일이긴 한데… 됐어, 재밌다.","웃음"),
  s('B',"응, 나도. 그냥 재밌어.","같이 웃음"),
  s('A',"드라마에 나올 법한 거 아니야? 이런 거."),
  s('B',"드라마면 우린 지금 CF 들어갈 타이밍."),
  s('A',"푸학. 야, 맞다 맞아.","웃음"),
  n("웃으면서 일단 넘긴다. 근데 내 가슴 한구석에선 아까부터 뭔가가 서서히 또박또박 정리되고 있다. 나는 모른 척하고 있을 뿐이다."),
  J("crack_common"),

  L("crack_common"),
  n("차를 들고 거실로 돌아간다. 소파에 앉는다. 수화기 선을 한 번 더 푼다."),
  n("베란다 창 너머로 강 건너편 불빛들이 느리게 흐른다. 한 층, 한 층. 어딘가엔 13층에 불이 켜진 집이 있고, 거기에도 누군가 있을 거다."),
  n("스탠드 조명이 — 기분 탓인지 — 아주 살짝, 따뜻해진 느낌."),
  f({stand_tone_warm:true}),
  WARM(),
  GO("S5_mirror_moment")
],

/* ------------- S5 : 누가 먼저 걸었어? ------------- */
S5_mirror_moment: [
  TAG("5. 누가 먼저 걸었어?"),
  n("차를 한 모금. 뜨겁다. 혀를 데일 뻔했다. 컵을 테이블에 내려놓는다."),
  s('B',"야… 근데 나 아까부터 이상한 게.","수화기 너머, 조심스럽게"),
  s('A',"응."),
  s('B',"너 지금 몇 살이지?"),
  s('A',"…서른셋. 아까 말했잖아."),
  s('B',"…나도, 서른셋이야.","한 박자 쉬고"),
  n("수화기가 갑자기 무거워진다. 귀가 아니라 손목이 먼저 안다."),
  n("[수화기가 살짝 지직거린다]"),
  f({reached_twist_1:true}),

  IF(st=>s5Density(st)>=7, "reveal_high"),
  IF(st=>s5Density(st)>=4, "reveal_mid"),
  J("reveal_low"),

  L("reveal_high"),
  n("그 순간, 지금까지의 모든 게 한꺼번에 재생된다."),
  n("선이 빠진 전화기. 같은 자세로 핸드폰을 만지고 있던 우리. 달력의 동그라미. 동시에 웃은 타이밍. 같은 농담. 같은 목소리. 같은 나이."),
  n("같은 나이.", 'emphasis'),
  n("저쪽이 과거의 나라면 서른셋이 아니어야 한다. 근데 서른셋이다. 그 말은, 저쪽은 지금의 나와 같은 시간을 살고 있다는 거다."),
  n("그 말은."),
  s('A',"…너, 과거의 내가 아니구나.","말끝 흐림"),
  s('B',"…응. 나도 방금, 그 생각 했어.","조용히"),
  J("reveal_after"),

  L("reveal_mid"),
  n("서른셋. 둘 다 서른셋."),
  n("저쪽에서 먼저 말을 꺼낸다. 천천히."),
  s('B',"…잠깐만. 우리 혹시."),
  s('A',"응."),
  s('B',"과거-지금, 그런 게 아니라… 그냥 지금-지금, 인 거 아니야?"),
  s('A',"…같은 시간에, 다른 곳에서, 다르게 살고 있는.","말끝 흐림"),
  s('B',"응. 그런 거."),
  J("reveal_after"),

  L("reveal_low"),
  n("나는 아직 머릿속이 정리가 안 된다. 저쪽이 천천히 대신 풀어준다."),
  s('B',"야, 잠깐 들어봐. 내가 생각하는 거, 말도 안 되는 건데…"),
  s('A',"응."),
  s('B',"우리 둘 다 서른셋이야. 같은 시간을 살고 있어. 과거 미래가 아니고. 그냥, 같은 지금."),
  s('A',"…그게 무슨 뜻이야?","한 박자 쉬고"),
  s('B',"나도 잘 몰라. 근데 그게 설명이 되는 것 같아. 안 그러면 달력 동그라미나 창밖 풍경이나, 그런 게 다 이상하잖아."),
  s('A',"…그런가."),
  J("reveal_after"),

  L("reveal_after"),
  n("\"평행세계\"라는 단어는 아무도 안 꺼냈다. 그런 드라마 같은 말은 뭐랄까, 이 밤에 안 어울리는 느낌이다. 그냥 둘 다 알고 있다. 이건 그런 종류의 밤이다."),
  s('A',"…그래서, 너는, 내가 안 간 그 길에 있는 거고."),
  s('B',"응. 그리고 너는, 내가 안 간 그 길에 있어.","조용히"),
  n("잠깐 멎는다. 저쪽도. 나도."),
  f({reached_twist_2:true}),
  s('B',"…나, 솔직히 말할게.","천천히"),
  s('B',"오늘 밤에… 네 생각 되게 많이 했어. 네 쪽은 어떻게 살고 있을까. 서울에 남은 그 사람은."),
  s('B',"부러워했어. 거기 남은 거. 안정적인 거. 출판사 다니면서 친구랑 가끔 술 마시고."),
  n("부러워했다고."),
  n("내 쪽을.", 'emphasis'),
  s('A',"…야, 나도.","말끝 흐림"),
  s('A',"나도, 네 쪽 계속 생각했어. 유학 갔으면 어땠을까, 바닷가 살면 어땠을까, 고양이 키우면…"),
  s('A',"…우리 둘 다, 서로를 안 걸은 길이라고 생각하고 있었네.","짧게 웃음"),
  s('B',"…그러네. 완전 대칭이네.","같이 웃음"),
  n("[동시에 웃음] — 웃는데 눈가가 조금 뜨겁다. 슬픈 건 아닌데. 뭔가, 뭔가 풀리는 느낌."),
  n("스탠드 조명이 분명히 더 따뜻해졌다. 기분 탓이 아니다. 이건 진짜다."),
  n("저쪽이 숨을 고른다. 조심스럽게."),
  s('B',"…근데 잠깐. 한 가지만 물어봐도 돼?"),
  s('A',"응."),
  s('B',"이 전화, 네가 건 거야?","천천히"),
  n("어?"),
  n("나는 받은 쪽이다. 수화기를 든 건 나다. 근데 저쪽은, 저쪽도 지금 \"나도 받은 쪽인데?\"라는 얼굴을 하고 있을 거다. 안 봐도 안다. 같은 얼굴일 테니까."),
  n("논리적으로는 누군가는 걸었어야 한다. 그런데 — 그런데 —"),

  C("CH_confess", [
    { text:"\"…사실은, 걸고 싶었어. 누군가 목소리가 듣고 싶었거든.\"", jump:"confess_yes", flags:{called_who_first:'confessed'}, special:true },
    { text:"\"나는 받은 쪽이야. 너는?\"", jump:"confess_deflect", flags:{called_who_first:'deflected'} },
    { text:"\"…모르겠어. 그냥 전화가 울렸어.\"", jump:"confess_silent", flags:{called_who_first:'silent'} }
  ]),

  L("confess_yes"),
  s('A',"…사실은.","한 박자 쉬고, 말끝 흐림"),
  s('A',"걸고 싶었어. 누군가 목소리가 듣고 싶었거든. 오늘 밤."),
  s('A',"아까 소파에서 핸드폰 만지작거리던 거, 누구한테 전화할까 생각하고 있었어. 근데 딱히 걸 데가 없어서. 그냥 화면만 켰다 껐다 했어."),
  s('A',"…근데 벨이 울렸어.","짧게"),
  n("수화기 너머에서 숨을 삼키는 소리."),
  s('B',"…나도.","아주 천천히"),
  s('B',"나도 그랬어. 나도 받은 쪽인데, 받기 직전까지 너한테 걸고 싶었어."),
  s('B',"정확히는, 네 쪽의 나한테. 서울에 남은 그 사람한테. 목소리라도 한 번 듣고 싶었어."),
  s('A',"…그러니까 우리 둘 다.","말끝 흐림"),
  s('B',"응. 둘 다 받은 쪽이야. 근데 둘 다, 걸고 싶었어."),
  n("[수화기가 살짝 지직거린다]"),
  n("그 순간, 알게 된다. 설명할 수 없지만 알게 된다. 누구도 먼저 걸지 않았다. 우리 둘 다 \"누군가 목소리가 듣고 싶다\"고 너무 강하게 생각한 순간, 어떤 오래된 회로가 — 평소에는 닿지 않을 어떤 선이 — 저절로 이어진 거다."),
  n("외로움이, 회로를 이었다.", 'emphasis'),
  n("근데 이상하다. 이게 슬프지가 않다. 오히려 따뜻하다."),
  n("저쪽의 나도 나를 생각하고 있었다. 오늘 밤에."),
  s('A',"…우리 둘 다 외로웠네.","짧게 웃음"),
  s('B',"응, 외로웠네. 아, 근데 외로웠다고 말하니까 그게 또 좀 덜 외로워지네.","같이 웃음"),
  s('A',"야, 말장난하지 마."),
  s('B',"말장난 아니거든? 진심이거든?"),
  n("[동시에 웃음]"),
  J("confess_common"),

  L("confess_deflect"),
  s('A',"나는 받은 쪽이야. 너는?"),
  s('B',"…나도, 받은 쪽인데.","한 박자 쉬고"),
