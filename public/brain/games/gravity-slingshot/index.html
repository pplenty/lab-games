<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그라비티 슬링샷 | 5분 퍼즐</title>
<meta name="description" content="행성 중력을 이용해 우주선을 별까지 보내기">
<meta property="og:title" content="그라비티 슬링샷">
<meta property="og:description" content="행성 중력을 이용해 우주선을 별까지 보내기">
<link rel="canonical" href="https://games.jdgrid.com/brain/games/gravity-slingshot/">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#ffb84d; --accent-dark:#cc8a1f; --accent-soft:#ffd99e; }
  main{ max-width: 520px; }
  .arena-wrap{ position:relative; margin: 0 auto; max-width: 480px; }
  canvas#stage{
    display:block;
    width: 100%;
    height: auto;
    background: #02010a;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(20,10,80,.4), 0 4px 14px rgba(0,0,0,.45);
    touch-action: none;
  }
  .hud{ display:flex; gap:8px; margin-bottom:10px; }
  .hud .stat{
    background:var(--card); padding:8px 10px; border-radius:20px;
    box-shadow:var(--shadow); flex:1; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .hud .stat .label{ color:var(--ink-faint); font-size:10px; letter-spacing:.18em; display:block; font-weight:700; }
  .hud .stat .value{ color:var(--accent-dark); font-size:18px; font-weight:800; line-height:1.1; }
  .controls{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .controls .btn{ padding:10px 20px; }
  .hint{ text-align:center; color:var(--ink-dim); font-size:13px; margin-top:10px; }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(2,1,15,.6); color: white; border-radius: 12px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    text-align:center; padding: 18px; pointer-events: none;
  }
  .overlay:empty{ display: none; }
  .overlay.interactive{ pointer-events: auto; }
  .overlay h2{ font-size:24px; margin-bottom: 6px; }
  .overlay p{ opacity:.85; font-size:14px; margin-bottom: 12px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <div id="app"></div>
</main>
<script src="../../shared/engine.js"></script>
<script>
'use strict';
const { $el, clear, loadStats, recordBestScore, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');

const KEY = 'slingshot_stats';
const app = document.getElementById('app');

const W = 480, H = 640;
const G = 1.6;
const SHIP_R = 6;
const GOAL_R = 16;
const MAX_DRAG = 110;
const POWER_SCALE = 0.10;
const TRAIL_MAX = 140;
const SIM_DT = 1.0;
const TRAJ_STEPS = 140;
const SPEED_CAP = 14;

const LEVELS = [
  {
    title: '직선',
    ship: { x: 60, y: 320 },
    planets: [],
    goal: { x: 420, y: 320 }
  },
  {
    title: '굽이도는 길',
    ship: { x: 70, y: 510 },
    planets: [{ x: 240, y: 360, r: 36, m: 1400, hue: 200 }],
    goal: { x: 420, y: 150 }
  },
  {
    title: '슬링샷',
    ship: { x: 60, y: 110 },
    planets: [
      { x: 180, y: 320, r: 34, m: 1300, hue: 30 },
      { x: 340, y: 320, r: 30, m: 900, hue: 280 }
    ],
    goal: { x: 420, y: 550 }
  },
  {
    title: '코너 회전',
    ship: { x: 80, y: 540 },
    planets: [{ x: 240, y: 320, r: 58, m: 2600, hue: 320 }],
    goal: { x: 80, y: 100 }
  },
  {
    title: '미궁',
    ship: { x: 60, y: 90 },
    planets: [
      { x: 170, y: 200, r: 26, m: 700, hue: 60 },
      { x: 330, y: 320, r: 36, m: 1400, hue: 200 },
      { x: 170, y: 460, r: 28, m: 900, hue: 280 }
    ],
    goal: { x: 420, y: 560 }
  }
];

const stars = makeStars(80);

function makeStars(n){
  const arr = [];
  for (let i = 0; i < n; i++){
    arr.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() < 0.6 ? 1 : 2,
      tw: Math.random() * Math.PI * 2
    });
  }
  return arr;
}

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id = 'title-screen';
  ts.innerHTML = `
    <div class="brand-icon">🪐</div>
    <h1 class="hero-title">그라비티 <span style="color:var(--accent);">슬링샷</span></h1>
    <div class="hero-sub">우주선을 드래그해 방향·세기를 정하고,<br>행성 중력으로 별까지 보내세요.</div>
    ${stats.bestScore>0 ? `<div class="today-card"><div class="today-label">B E S T</div><div class="today-date">${stats.bestScore}점</div></div>` : ''}
    <div class="rule-card">
      <h3>R U L E S</h3>
      <div>· 우주선에서 드래그 → 점선 궤적 미리보기.</div>
      <div>· 떼면 발사. 행성에 부딪히면 실패, 별에 닿으면 성공.</div>
      <div>· 첫 시도 ⭐⭐⭐ 300점 / 둘째 ⭐⭐ 200점 / 그 외 ⭐ 100점.</div>
      <div>· 총 5개 레벨, 점수는 누적됩니다.</div>
    </div>
    <div class="btn-row"><button class="btn" id="btn-start">출 발</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = ()=>startRun();
}

function startRun(){
  let levelIdx = 0;
  let totalScore = 0;
  let tries = 0;

  clear(app);

  const hud = $el('div', 'hud');
  hud.innerHTML = `
    <div class="stat"><span class="label">LEVEL</span><span class="value" id="hud-level">1/5</span></div>
    <div class="stat"><span class="label">TRIES</span><span class="value" id="hud-tries">1</span></div>
    <div class="stat"><span class="label">SCORE</span><span class="value" id="hud-score">0</span></div>
  `;
  app.appendChild(hud);

  const arenaWrap = $el('div', 'arena-wrap');
  arenaWrap.innerHTML = `
    <canvas id="stage" width="${W}" height="${H}"></canvas>
    <div class="overlay" id="overlay"></div>
  `;
  app.appendChild(arenaWrap);

  const controls = $el('div', 'controls');
  controls.innerHTML = `
    <button class="btn ghost" id="btn-retry">재 도 전</button>
    <button class="btn ghost" id="btn-quit">그 만 두 기</button>
  `;
  app.appendChild(controls);

  const hint = $el('div', 'hint', '우주선을 드래그해 발사 방향과 세기 설정 · R = 재도전');
  app.appendChild(hint);

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const overlay = document.getElementById('overlay');
  const hudLevel = document.getElementById('hud-level');
  const hudTries = document.getElementById('hud-tries');
  const hudScore = document.getElementById('hud-score');

  let raf = null;
  let phase = 'aim'; // 'aim' | 'fly' | 'end'
  let ship = { x: 0, y: 0, vx: 0, vy: 0 };
  let trail = [];
  let particles = [];
  let aiming = false;
  let aimStart = null;
  let aimCurrent = null;
  let frame = 0;

  function loadLevel(){
    const lvl = LEVELS[levelIdx];
    ship.x = lvl.ship.x; ship.y = lvl.ship.y;
    ship.vx = 0; ship.vy = 0;
    trail = [];
    particles = [];
    aiming = false;
    aimStart = null;
    aimCurrent = null;
    phase = 'aim';
    hudLevel.textContent = (levelIdx+1) + '/5';
    hudTries.textContent = tries + 1;
    overlay.classList.remove('interactive');
    overlay.innerHTML = '';
  }
  loadLevel();

  function localPos(clientX, clientY){
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) * (W / r.width),
      y: (clientY - r.top) * (H / r.height)
    };
  }

  function pointerDown(e){
    if (phase !== 'aim') return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    if (!p) return;
    const lp = localPos(p.clientX, p.clientY);
    aiming = true;
    aimStart = { x: ship.x, y: ship.y };
    aimCurrent = lp;
  }
  function pointerMove(e){
    if (!aiming) return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    if (!p) return;
    aimCurrent = localPos(p.clientX, p.clientY);
  }
  function pointerUp(e){
    if (!aiming) return;
    if (e && e.preventDefault) e.preventDefault();
    aiming = false;
    if (phase !== 'aim' || !aimStart || !aimCurrent) return;
    const dx = aimStart.x - aimCurrent.x;
    const dy = aimStart.y - aimCurrent.y;
    const mag = Math.hypot(dx, dy);
    if (mag < 8) return;
    const limited = Math.min(mag, MAX_DRAG);
    const k = (limited / mag) * POWER_SCALE;
    ship.vx = dx * k;
    ship.vy = dy * k;
    phase = 'fly';
  }

  canvas.addEventListener('mousedown', pointerDown);
  canvas.addEventListener('mousemove', pointerMove);
  canvas.addEventListener('mouseup', pointerUp);
  canvas.addEventListener('mouseleave', ()=>{ if (aiming) pointerUp(); });
  canvas.addEventListener('touchstart', pointerDown, { passive: false });
  canvas.addEventListener('touchmove', pointerMove, { passive: false });
  canvas.addEventListener('touchend', pointerUp, { passive: false });
  canvas.addEventListener('touchcancel', ()=>{ aiming = false; });

  function onKey(e){
    if (e.code === 'KeyR'){ retry(); e.preventDefault(); }
  }
  document.addEventListener('keydown', onKey);

  function retry(){
    if (phase === 'end' && document.getElementById('ov-next')) return;
    tries += 1;
    loadLevel();
  }
  document.getElementById('btn-retry').onclick = retry;
  document.getElementById('btn-quit').onclick = ()=>{
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKey);
    showTitle();
  };

  function failLevel(){
    explosion(ship.x, ship.y, 40, 30);
    phase = 'end';
    setTimeout(()=>{
      if (raf === null) return;
      tries += 1;
      loadLevel();
    }, 700);
  }

  function clearLevel(){
    const lvl = LEVELS[levelIdx];
    explosion(lvl.goal.x, lvl.goal.y, 60, 55);
    const earned = tries === 0 ? 300 : tries === 1 ? 200 : 100;
    totalScore += earned;
    hudScore.textContent = totalScore;
    phase = 'end';
    overlay.classList.add('interactive');
    overlay.innerHTML = `
      <h2>${earned === 300 ? '⭐⭐⭐' : earned === 200 ? '⭐⭐' : '⭐'} 클리어</h2>
      <p>${lvl.title} · +${earned}점</p>
      <button class="btn" id="ov-next">${levelIdx === LEVELS.length - 1 ? '결과 보기' : '다음 레벨'}</button>
    `;
    document.getElementById('ov-next').onclick = ()=>{
      if (levelIdx === LEVELS.length - 1){
        finishRun();
      } else {
        levelIdx += 1;
        tries = 0;
        loadLevel();
      }
    };
  }

  function finishRun(){
    cancelAnimationFrame(raf);
    raf = null;
    document.removeEventListener('keydown', onKey);
    const stats = recordBestScore(KEY, totalScore);
    const isBest = stats.bestScore === totalScore && totalScore > 0;
    clear(app);
    const r = $el('div', 'result-card');
    r.innerHTML = `
      <div class="result-emoji">${totalScore >= 1400 ? '🏆' : totalScore >= 1000 ? '🎉' : '👏'}</div>
      <div class="result-title">5레벨 완주</div>
      <div class="result-big">${totalScore}점</div>
      <div class="result-sub">${isBest ? '🌟 최고 기록' : '잘했어요'}</div>
      ${isBest ? '<div class="ribbon">NEW BEST</div>' : ''}
      <div class="btn-row">
        <button class="btn" id="s">공유</button>
        <button class="btn secondary" id="a">다시</button>
        <button class="btn ghost" id="h">홈</button>
      </div>
    `;
    app.appendChild(r);
    document.getElementById('a').onclick = ()=>startRun();
    document.getElementById('h').onclick = showTitle;
    document.getElementById('s').onclick = (e)=>shareToClipboard(
      '그라비티 슬링샷\n🪐 ' + totalScore + '점' + (isBest ? ' 🌟' : '') +
      '\nhttps://games.jdgrid.com/brain/games/gravity-slingshot/',
      e.target
    );
  }

  function simulateShip(s, planets, dt){
    for (const p of planets){
      const dx = p.x - s.x, dy = p.y - s.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < 1) continue;
      const d = Math.sqrt(d2);
      const force = G * p.m / d2;
      s.vx += (dx / d) * force * dt;
      s.vy += (dy / d) * force * dt;
    }
    const sp = Math.hypot(s.vx, s.vy);
    if (sp > SPEED_CAP){
      s.vx *= SPEED_CAP / sp;
      s.vy *= SPEED_CAP / sp;
    }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
  }

  function predictTrajectory(){
    const lvl = LEVELS[levelIdx];
    if (!aimStart || !aimCurrent) return [];
    const dx = aimStart.x - aimCurrent.x;
    const dy = aimStart.y - aimCurrent.y;
    const mag = Math.hypot(dx, dy);
    if (mag < 8) return [];
    const limited = Math.min(mag, MAX_DRAG);
    const k = (limited / mag) * POWER_SCALE;
    const test = { x: ship.x, y: ship.y, vx: dx * k, vy: dy * k };
    const pts = [];
    for (let i = 0; i < TRAJ_STEPS; i++){
      simulateShip(test, lvl.planets, SIM_DT);
      if (i % 3 === 0) pts.push({ x: test.x, y: test.y });
      let stop = false;
      for (const p of lvl.planets){
        const ddx = test.x - p.x, ddy = test.y - p.y;
        if (ddx*ddx + ddy*ddy < (p.r + SHIP_R) * (p.r + SHIP_R)){ stop = true; break; }
      }
      if (stop) break;
      if (test.x < -40 || test.x > W+40 || test.y < -40 || test.y > H+40) break;
      const ggx = test.x - lvl.goal.x, ggy = test.y - lvl.goal.y;
      if (ggx*ggx + ggy*ggy < (GOAL_R + SHIP_R) * (GOAL_R + SHIP_R)) break;
    }
    return pts;
  }

  function explosion(x, y, count, life){
    for (let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        size: 1 + Math.random() * 3,
        hue: Math.random() * 360,
        life: life + Math.random() * 20,
        maxLife: life + 20
      });
    }
  }

  function step(){
    frame += 1;
    if (phase === 'fly'){
      simulateShip(ship, LEVELS[levelIdx].planets, SIM_DT);
      trail.push({ x: ship.x, y: ship.y });
      if (trail.length > TRAIL_MAX) trail.shift();

      const lvl = LEVELS[levelIdx];
      for (const p of lvl.planets){
        const dx = ship.x - p.x, dy = ship.y - p.y;
        if (dx*dx + dy*dy < (p.r + SHIP_R) * (p.r + SHIP_R)){
          return failLevel();
        }
      }
      if (ship.x < -80 || ship.x > W+80 || ship.y < -80 || ship.y > H+80){
        return failLevel();
      }
      const dxg = ship.x - lvl.goal.x, dyg = ship.y - lvl.goal.y;
      if (dxg*dxg + dyg*dyg < (GOAL_R + SHIP_R) * (GOAL_R + SHIP_R)){
        return clearLevel();
      }
    }

    for (const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= 1;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function render(){
    ctx.fillStyle = '#02010a';
    ctx.fillRect(0, 0, W, H);

    for (const s of stars){
      const tw = 0.5 + 0.5 * Math.sin(frame * 0.04 + s.tw);
      ctx.fillStyle = `rgba(255,255,255,${0.25 + tw * 0.55})`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    const lvl = LEVELS[levelIdx];

    // 행성 중력 표시 (얇은 헤일로 추가됨)
    for (const p of lvl.planets) drawPlanet(ctx, p);

    drawGoal(ctx, lvl.goal, frame);

    // ship trail
    if (trail.length > 1){
      ctx.save();
      ctx.shadowColor = 'rgba(255,200,100,.85)';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(255,200,100,.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
      ctx.stroke();
      ctx.restore();
    }

    // 궤적 예측 + 발사 화살표
    if (phase === 'aim' && aiming && aimCurrent){
      const pts = predictTrajectory();
      ctx.save();
      for (let i = 0; i < pts.length; i++){
        const fade = 1 - i / pts.length;
        ctx.fillStyle = `rgba(255,255,255,${0.55 * fade})`;
        ctx.beginPath();
        ctx.arc(pts[i].x, pts[i].y, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      const dx = aimStart.x - aimCurrent.x;
      const dy = aimStart.y - aimCurrent.y;
      const mag = Math.hypot(dx, dy);
      if (mag > 8){
        const limited = Math.min(mag, MAX_DRAG);
        const px = ship.x + (dx / mag) * limited;
        const py = ship.y + (dy / mag) * limited;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,184,77,.8)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(ship.x, ship.y);
        ctx.lineTo(px, py);
        ctx.stroke();
        ctx.restore();

        // 세기 게이지 (반지름으로 표시)
        const power = limited / MAX_DRAG;
        ctx.save();
        ctx.strokeStyle = `hsla(${30 + power * 30}, 95%, 60%, .8)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ship.x, ship.y, 14 + power * 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // ship
    if (phase !== 'end' || trail.length > 0){
      const ang = phase === 'aim'
        ? (aiming && aimCurrent
            ? Math.atan2(aimStart.y - aimCurrent.y, aimStart.x - aimCurrent.x)
            : -Math.PI / 2)
        : Math.atan2(ship.vy, ship.vx);
      drawShip(ctx, ship.x, ship.y, ang, phase === 'fly');
    }

    // particles
    for (const p of particles){
      const a = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${a})`;
      ctx.shadowColor = `hsla(${p.hue}, 100%, 70%, ${a})`;
      ctx.shadowBlur = 10;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.shadowBlur = 0;
  }

  function loop(){
    if (raf === null) return;
    step();
    render();
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
}

function drawPlanet(ctx, p){
  ctx.save();
  const halo = ctx.createRadialGradient(p.x, p.y, p.r * 0.9, p.x, p.y, p.r * 2.2);
  halo.addColorStop(0, `hsla(${p.hue}, 80%, 55%, .35)`);
  halo.addColorStop(1, `hsla(${p.hue}, 80%, 55%, 0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const grad = ctx.createRadialGradient(p.x - p.r * 0.4, p.y - p.r * 0.4, p.r * 0.1, p.x, p.y, p.r);
  grad.addColorStop(0, `hsl(${p.hue}, 85%, 75%)`);
  grad.addColorStop(0.55, `hsl(${p.hue}, 75%, 45%)`);
  grad.addColorStop(1, `hsl(${(p.hue + 20) % 360}, 60%, 18%)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = `hsla(${p.hue}, 100%, 80%, .35)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.stroke();
}

function drawGoal(ctx, goal, frame){
  const pulse = 1 + Math.sin(frame * 0.08) * 0.12;
  const r = GOAL_R * pulse;
  ctx.save();
  const halo = ctx.createRadialGradient(goal.x, goal.y, r * 0.3, goal.x, goal.y, r * 3);
  halo.addColorStop(0, 'rgba(255,255,200,.55)');
  halo.addColorStop(1, 'rgba(255,255,200,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(goal.x, goal.y, r * 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(goal.x, goal.y);
  ctx.rotate(frame * 0.004);
  ctx.fillStyle = '#ffea7d';
  ctx.shadowColor = '#fff5b8';
  ctx.shadowBlur = 24;
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const ang = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 === 0 ? r : r * 0.45;
    const x = Math.cos(ang) * rr;
    const y = Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawShip(ctx, x, y, ang, withFlame){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang + Math.PI / 2);
  if (withFlame){
    ctx.fillStyle = 'rgba(255,180,80,.85)';
    ctx.shadowColor = 'rgba(255,180,80,.8)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.lineTo(0, 14 + Math.random() * 4);
    ctx.lineTo(4, 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.lineTo(6, 6);
  ctx.lineTo(0, 3);
  ctx.lineTo(-6, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

showTitle();
window.__GAME__ = { KEY };
</script>
