<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자모 조합 | 5분 퍼즐</title>
<meta property="og:title" content="자모 조합">
<meta property="og:description" content="주어진 자음들로 시작하는 단어를 제한시간 안에 떠올리세요.">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#8c6cb6;--accent-dark:#634888;--accent-soft:#ccbce3; }
  .prompt{ text-align:center;padding:24px;background:var(--accent-soft);border-radius:14px;margin-bottom:14px; }
  .jamo-list{ font-size:52px;font-weight:800;color:var(--accent-dark);letter-spacing:.2em;line-height:1;margin-bottom:6px; }
  .prompt .hint{ color:var(--ink-dim);font-size:13px;margin-top:6px; }
  .timer-bar{ height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow); }
  .timer-fill{ height:100%;background:linear-gradient(to right,var(--accent),var(--accent-dark)); }
  .input-row{ background:var(--card);border-radius:10px;padding:12px;display:flex;gap:8px;box-shadow:var(--shadow); }
  .input-row input{ flex:1;padding:12px;border:2px solid var(--ink-faint);border-radius:8px;font:inherit;font-size:22px;font-weight:700;text-align:center;background:var(--bg); }
  .input-row button{ background:var(--accent);color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer; }
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="../../shared/engine.js"></script>
<script>
const { $el, clear, loadStats, recordBestScore, shuffle, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');

// Dictionary of valid words indexed by chosung sequence
const DICT = [
  '사과','사랑','사자','서울','선생','선물','소금','사진','사슴','사탕',
  '바다','바람','비누','배추','백합','병원','보석','부엉','불꽃','빨래',
  '가지','가방','가위','감자','강아','거울','고양','고구','공원','과일',
  '나비','나무','노래','눈사','느낌','냉장',
  '다리','도시','도마','달력','대문','돈가','동네','드림','딸기',
  '라면','로봇','레몬','리본',
  '마을','마차','모자','목걸','문어','물고','미소',
  '학교','한강','해바','행복','호떡','호랑','화살','회장','홍차',
  '오리','옷장','요리','우산','원숭','음악','의자','이불'
];
const JAMO = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(ch){
  const code = ch.charCodeAt(0) - 0xac00;
  if(code < 0 || code > 11171) return null;
  const idx = Math.floor(code / 588);
  const table = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  return table[idx];
}
function matches(word, jamos){
  if([...word].length < jamos.length) return false;
  for(let i=0;i<jamos.length;i++){
    const cs = chosung([...word][i]);
    const target = jamos[i];
    // treat ㄲ as ㄱ, ㄸ as ㄷ, etc.
    const normalized = { 'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ' }[cs] || cs;
    if(normalized !== target) return false;
  }
  return true;
}
function pickJamoPair(){
  for(let tries=0;tries<50;tries++){
    const a = JAMO[Math.floor(Math.random()*JAMO.length)];
    const b = JAMO[Math.floor(Math.random()*JAMO.length)];
    const solutions = DICT.filter(w => matches(w, [a,b]));
    if(solutions.length >= 2) return { jamos:[a,b], solutions };
  }
  return { jamos:['ㅅ','ㄱ'], solutions: DICT.filter(w => matches(w, ['ㅅ','ㄱ'])) };
}
const TOTAL = 5;
const TIMELIMIT = 15000;
const KEY = 'jamo_combine_stats';
const app = document.getElementById('app');

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id='title-screen';
  ts.innerHTML = `
    <div class="brand-icon">ㅈㅁ</div>
    <h1 class="hero-title">자모 <span style="color:var(--accent);">조합</span></h1>
    <div class="hero-sub">주어진 자음들로 시작하는<br>2글자 단어를 ${TIMELIMIT/1000}초 안에 떠올리세요.</div>
    ${stats.bestScore>0?`<div class="today-card"><div class="today-label">B E S T</div><div class="today-date">${stats.bestScore}/${TOTAL}</div></div>`:''}
    <div class="btn-row"><button class="btn" id="btn-start">시 작 하 기</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  const state = { i:0, correct:0 };
  next();
  function next(){
    if(state.i >= TOTAL) return finish();
    const q = pickJamoPair();
    clear(app);
    const top = $el('div','topbar');
    top.innerHTML = `<div class="stat">${state.i+1}/${TOTAL}</div><div class="stat">✓ ${state.correct}</div>`;
    app.appendChild(top);
    const card = $el('div','card');
    card.innerHTML = `
      <div class="prompt">
        <div class="jamo-list">${q.jamos.join(' · ')}</div>
        <div class="hint">이 자음들로 시작하는 두 글자 단어</div>
      </div>
      <div class="timer-bar"><div class="timer-fill" id="fill" style="width:100%"></div></div>
      <div class="input-row">
        <input id="ans" autocomplete="off" autofocus placeholder="단어">
        <button id="sub">→</button>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    app.appendChild(card);
    const start = performance.now();
    let done = false;
    const iv = setInterval(()=>{
      if(done) return;
      const rem = Math.max(0, TIMELIMIT-(performance.now()-start));
      document.getElementById('fill').style.width = (rem/TIMELIMIT*100)+'%';
      if(rem <= 0){
        done = true; clearInterval(iv);
        document.getElementById('fb').className='feedback wrong';
        document.getElementById('fb').textContent='시간 초과! 예: '+q.solutions[0];
        setTimeout(()=>{ state.i++; next(); }, 1400);
      }
    }, 100);
    const input = document.getElementById('ans');
    input.focus();
    function check(){
      if(done) return;
      const v = input.value.trim();
      if(!v) return;
      if(matches(v, q.jamos) && DICT.includes(v)){
        done = true; clearInterval(iv);
        document.getElementById('fb').className='feedback right';
        document.getElementById('fb').textContent='✓ 정답: '+v;
        state.correct++;
        setTimeout(()=>{ state.i++; next(); }, 900);
      } else if(!DICT.includes(v)){
        document.getElementById('fb').className='feedback wrong';
        document.getElementById('fb').textContent='사전에 없는 단어예요.';
      } else {
        document.getElementById('fb').className='feedback wrong';
        document.getElementById('fb').textContent='초성이 맞지 않아요.';
      }
    }
    document.getElementById('sub').onclick = check;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
  }
  function finish(){
    const stats = recordBestScore(KEY, state.correct, {});
    const isBest = stats.bestScore === state.correct;
    clear(app);
    const r = $el('div','result-card');
    r.innerHTML = `
      <div class="result-emoji">${state.correct===TOTAL?'🏆':state.correct>=3?'🎉':'👏'}</div>
      <div class="result-title">자모 조합 끝</div>
      <div class="result-big">${state.correct}/${TOTAL}</div>
      ${isBest?'<div class="ribbon">🌟 최고</div>':''}
      <div class="btn-row">
        <button class="btn" id="s">공유</button>
        <button class="btn secondary" id="a">다시</button>
        <button class="btn ghost" id="h">홈</button>
      </div>
    `;
    app.appendChild(r);
    document.getElementById('a').onclick=startGame;
    document.getElementById('h').onclick=showTitle;
    document.getElementById('s').onclick=(e)=>shareToClipboard(`자모 조합\nㅈㅁ ${state.correct}/${TOTAL}${isBest?' 🌟':''}`, e.target);
  }
}
showTitle();
window.__GAME__ = { DICT, TOTAL, TIMELIMIT, KEY, chosung, matches, pickJamoPair };
</script>
</body>
</html>
