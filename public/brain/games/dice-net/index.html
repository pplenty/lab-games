<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주사위 전개도 | 5분 퍼즐</title>
<meta property="og:title" content="주사위 전개도">
<meta property="og:description" content="주사위를 접었을 때 마주보는 면의 눈을 맞추세요.">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#6d8c5b;--accent-dark:#4a6a38;--accent-soft:#bcd6a5; }
  .info{ text-align:center;color:var(--ink-dim);font-size:14px;margin-bottom:12px; }
  .q-area{ text-align:center;padding:22px;background:var(--accent-soft);border-radius:14px;margin-bottom:14px; }
  .dice-big{ font-size:76px;line-height:1;color:var(--accent-dark); }
  .hint{ color:var(--ink-dim);font-size:13px;margin-top:8px; }
  .opts{ display:grid;grid-template-columns:repeat(3,1fr);gap:10px; }
  .opt{ aspect-ratio:1;background:white;border:2px solid var(--ink-faint);border-radius:12px;font-size:40px;font-weight:800;color:var(--accent-dark);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s; }
  .opt:hover:not(:disabled){ border-color:var(--accent);background:var(--accent-soft); }
  .opt.correct{ background:var(--green);color:white; }
  .opt.wrong{ background:var(--red);color:white; }
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="../../shared/engine.js"></script>
<script>
const { $el, clear, loadStats, recordBestScore, shuffle, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');
const DICE = ['⚀','⚁','⚂','⚃','⚄','⚅'];
// On a standard die, opposite faces sum to 7.
const TOTAL = 6;
const KEY = 'dice_net_stats';
const app = document.getElementById('app');

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id='title-screen';
  ts.innerHTML = `
    <div class="brand-icon">🎲</div>
    <h1 class="hero-title">주사위 <span style="color:var(--accent);">전개도</span></h1>
    <div class="hero-sub">표준 주사위에서 마주 보는 두 면의 합은 <b>7</b>.<br>제시된 면의 반대쪽은?</div>
    <div class="rule-card">1↔6, 2↔5, 3↔4 — 이 규칙으로 ${TOTAL}문제.<br>일부는 추가 정보 힌트가 섞여 있어요.${stats.bestScore>0?`<div class="best">🌟 최고 ${stats.bestScore}/${TOTAL}</div>`:''}</div>
    <div class="btn-row"><button class="btn" id="btn-start">시 작 하 기</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  const faces = shuffle([1,2,3,4,5,6,1,2,3,4,5,6]).slice(0, TOTAL);
  const state = { faces, i:0, correct:0 };
  next();
  function next(){
    if(state.i >= TOTAL) return finish();
    const face = state.faces[state.i];
    const opposite = 7 - face;
    const wrongs = shuffle([1,2,3,4,5,6].filter(x => x !== opposite)).slice(0, 2);
    const opts = shuffle([opposite, ...wrongs]);
    clear(app);
    const top = $el('div','topbar');
    top.innerHTML = `<div class="stat">${state.i+1}/${TOTAL}</div><div class="stat">✓ ${state.correct}</div>`;
    app.appendChild(top);
    const card = $el('div','card');
    card.innerHTML = `
      <div class="q-area">
        <div class="dice-big">${DICE[face-1]}</div>
        <div class="hint">이 면의 반대쪽 면은?</div>
      </div>
      <div class="opts">
        ${opts.map(o=>`<button class="opt" data-v="${o}">${DICE[o-1]}<br><span style="font-size:14px;color:var(--ink-dim);">${o}</span></button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    `;
    app.appendChild(card);
    card.querySelectorAll('.opt').forEach(b=>{
      b.onclick = ()=>{
        card.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        const v = +b.dataset.v;
        const fb = document.getElementById('fb');
        if(v === opposite){ b.classList.add('correct'); fb.className='feedback right'; fb.textContent='✓ 1+6=2+5=3+4=7'; state.correct++; }
        else { b.classList.add('wrong'); [...card.querySelectorAll('.opt')].find(x=>+x.dataset.v===opposite).classList.add('correct'); fb.className='feedback wrong'; fb.textContent='반대쪽은 '+DICE[opposite-1]+' ('+opposite+')'; }
        setTimeout(()=>{ state.i++; next(); }, 1100);
      };
    });
  }
  function finish(){
    const stats = recordBestScore(KEY, state.correct, {});
    const isBest = stats.bestScore === state.correct;
    clear(app);
    const r = $el('div','result-card');
    r.innerHTML = `
      <div class="result-emoji">${state.correct===TOTAL?'🏆':state.correct>=4?'🎉':'👏'}</div>
      <div class="result-title">주사위 퀴즈 종료</div>
      <div class="result-big">${state.correct}/${TOTAL}</div>
      ${isBest?'<div class="ribbon">🌟 최고</div>':''}
      <div class="btn-row">
        <button class="btn" id="s">공유</button>
        <button class="btn secondary" id="a">다시</button>
        <button class="btn ghost" id="h">홈</button>
      </div>
    `;
    app.appendChild(r);
    document.getElementById('a').onclick=startGame;
    document.getElementById('h').onclick=showTitle;
    document.getElementById('s').onclick=(e)=>shareToClipboard(`주사위 전개도\n🎲 ${state.correct}/${TOTAL}${isBest?' 🌟':''}`, e.target);
  }
}
showTitle();
window.__GAME__ = { DICE, TOTAL, KEY };
</script>
</body>
</html>
