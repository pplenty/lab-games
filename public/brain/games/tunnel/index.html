<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>터널 런 | 5분 퍼즐</title>
<meta name="description" content="회전하는 가짜 3D 터널을 달려 장애물을 피하기">
<meta property="og:title" content="터널 런">
<meta property="og:description" content="회전하는 가짜 3D 터널을 달려 장애물을 피하기">
<link rel="canonical" href="https://games.jdgrid.com/brain/games/tunnel/">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#9c5cff; --accent-dark:#6f3acf; --accent-soft:#cbb0ff; }
  main{ max-width: 520px; }
  .arena-wrap{ position:relative; margin: 0 auto; max-width: 480px; }
  canvas#stage{
    display:block;
    width: 100%;
    height: auto;
    background: #04020a;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(80,30,180,.25), 0 4px 14px rgba(0,0,0,.4);
    touch-action: none;
  }
  .hud{ display:flex; gap:8px; margin-bottom:10px; }
  .hud .stat{
    background:var(--card); padding:8px 10px; border-radius:20px;
    box-shadow:var(--shadow); flex:1; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .hud .stat .label{
    color: var(--ink-faint); font-size:10px;
    letter-spacing:.18em; display:block; font-weight:700;
  }
  .hud .stat .value{
    color: var(--accent-dark); font-size: 18px;
    font-weight: 800; line-height: 1.1;
  }
  .hint{ text-align:center; color:var(--ink-dim); font-size: 13px; margin-top: 10px; }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(10, 4, 28, .55);
    color: white; border-radius: 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    text-align:center; padding: 18px;
    pointer-events: none;
  }
  .overlay:empty{ display: none; }
  .overlay.interactive{ pointer-events: auto; }
  .overlay h2{ font-size:22px; margin-bottom: 8px; letter-spacing: .04em; }
  .overlay p{ opacity:.85; font-size:14px; margin-bottom: 14px; line-height: 1.6; }
  .overlay .countdown{
    font-size: 84px; font-weight: 900;
    text-shadow: 0 0 30px var(--accent-soft);
    letter-spacing: 0;
    line-height: 1;
  }
  .tap-zone{
    position: absolute; top: 0; bottom: 0; width: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>
<main>
  <div id="app"></div>
</main>
<script src="../../shared/engine.js"></script>
<script>
'use strict';
const { $el, clear, loadStats, recordBestScore, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');

const KEY = 'tunnel_stats';
const app = document.getElementById('app');

const W = 480;
const H = 640;
const CX = W / 2;
const CY = H / 2 + 30;
const N = 10;
const TUNNEL_R = 320;
const Z_STEP = 90;
const RINGS = 22;
const PLAYER_Z = 90;
const FOCAL = 380;

function project(angle, z){
  const scale = FOCAL / (z + FOCAL);
  const r = TUNNEL_R * scale;
  return {
    x: CX + Math.cos(angle) * r,
    y: CY + Math.sin(angle) * r,
    scale
  };
}

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id = 'title-screen';
  ts.innerHTML = `
    <div class="brand-icon">🌀</div>
    <h1 class="hero-title">터널 <span style="color:var(--accent);">런</span></h1>
    <div class="hero-sub">회전하는 터널 안에서 장애물을 피하세요.<br>← → · A D · 화면 좌우 탭으로 칸 이동.</div>
    ${stats.bestScore>0 ? `<div class="today-card"><div class="today-label">B E S T</div><div class="today-date">${stats.bestScore}점</div></div>` : ''}
    <div class="rule-card">
      <h3>R U L E S</h3>
      <div>· 발광 장애물이 다가오면 비어있는 칸으로 이동.</div>
      <div>· 한 번 부딪히면 끝. 카메라는 플레이어를 따라 회전.</div>
      <div>· 통과한 장애물 한 개당 +10점. 시간이 갈수록 가속.</div>
    </div>
    <div class="btn-row"><button class="btn" id="btn-start">출 발</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  clear(app);

  const hud = $el('div', 'hud');
  hud.innerHTML = `
    <div class="stat"><span class="label">SCORE</span><span class="value" id="hud-score">0</span></div>
    <div class="stat"><span class="label">DIST</span><span class="value" id="hud-dist">0</span></div>
    <div class="stat"><span class="label">SPEED</span><span class="value" id="hud-speed">5.0</span></div>
  `;
  app.appendChild(hud);

  const arenaWrap = $el('div', 'arena-wrap');
  arenaWrap.innerHTML = `
    <canvas id="stage" width="${W}" height="${H}"></canvas>
    <div class="tap-zone" id="zone-l" style="left:0"></div>
    <div class="tap-zone" id="zone-r" style="right:0"></div>
    <div class="overlay" id="overlay"></div>
  `;
  app.appendChild(arenaWrap);

  const hint = $el('div', 'hint', '← → / A D / 화면 좌우 탭 · P = 일시정지');
  app.appendChild(hint);

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const overlay = document.getElementById('overlay');
  const hudScore = document.getElementById('hud-score');
  const hudDist = document.getElementById('hud-dist');
  const hudSpeed = document.getElementById('hud-speed');

  const state = {
    scrollOffset: 0,
    tunnelRotation: -Math.PI / 2,
    playerSegment: 0,
    obstacles: [],
    particles: [],
    score: 0,
    distance: 0,
    speed: 5.0,
    baseHue: 270,
    spawnCountdown: Z_STEP * 2,
    running: true,
    paused: false,
    shake: 0,
    flash: 0,
    countdownT: 3,
  };

  function targetRotation(){
    return -Math.PI / 2 - (state.playerSegment + 0.5) * (Math.PI * 2 / N);
  }

  function moveLeft(){
    if (!state.running || state.paused || state.countdownT > 0) return;
    state.playerSegment = (state.playerSegment - 1 + N) % N;
  }
  function moveRight(){
    if (!state.running || state.paused || state.countdownT > 0) return;
    state.playerSegment = (state.playerSegment + 1) % N;
  }

  function onKeyDown(e){
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ moveLeft(); e.preventDefault(); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD'){ moveRight(); e.preventDefault(); }
    else if (e.code === 'KeyP' || e.code === 'Escape'){ togglePause(); e.preventDefault(); }
  }
  document.addEventListener('keydown', onKeyDown);

  function tapHandler(side){
    return (e)=>{ e.preventDefault(); side === 'l' ? moveLeft() : moveRight(); };
  }
  const zL = document.getElementById('zone-l');
  const zR = document.getElementById('zone-r');
  zL.style.pointerEvents = 'auto';
  zR.style.pointerEvents = 'auto';
  zL.addEventListener('touchstart', tapHandler('l'), { passive: false });
  zR.addEventListener('touchstart', tapHandler('r'), { passive: false });
  zL.addEventListener('mousedown', tapHandler('l'));
  zR.addEventListener('mousedown', tapHandler('r'));

  function togglePause(){
    if (!state.running) return;
    if (state.countdownT > 0) return;
    state.paused = !state.paused;
    if (state.paused){
      overlay.classList.add('interactive');
      overlay.innerHTML = '<h2>일시정지</h2><p>P 또는 버튼으로 재개</p><button class="btn" id="ov-resume">재 개</button>';
      document.getElementById('ov-resume').onclick = togglePause;
    } else {
      overlay.classList.remove('interactive');
      overlay.innerHTML = '';
    }
  }

  function showCountdownOverlay(){
    overlay.classList.remove('interactive');
    overlay.innerHTML = `<div class="countdown" id="cd">${Math.ceil(state.countdownT)}</div><p>준비!</p>`;
  }
  showCountdownOverlay();

  let raf = null;
  let last = performance.now();
  function loop(t){
    if (!state.running) return;
    const dt = Math.min(50, t - last) / 16.6667;
    last = t;
    if (!state.paused){
      step(dt);
      render();
    }
    raf = requestAnimationFrame(loop);
  }

  function step(dt){
    if (state.countdownT > 0){
      state.countdownT -= dt / 60;
      const v = Math.ceil(state.countdownT);
      const cd = document.getElementById('cd');
      if (cd){
        if (v <= 0){ overlay.innerHTML = ''; }
        else cd.textContent = String(v);
      }
      if (state.countdownT <= 0) state.countdownT = 0;
      // hue 변화는 진행
      state.baseHue = (state.baseHue + 0.4 * dt) % 360;
      return;
    }

    state.scrollOffset += state.speed * dt;
    state.distance += state.speed * dt;
    state.baseHue = (state.baseHue + 0.4 * dt) % 360;

    // 카메라 roll
    let tgt = targetRotation();
    let diff = tgt - state.tunnelRotation;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    state.tunnelRotation += diff * Math.min(1, 0.20 * dt);

    // 장애물 진행 + 통과/충돌
    for (const ob of state.obstacles){
      ob.z -= state.speed * dt;
      if (!ob.passed && ob.z <= PLAYER_Z){
        ob.passed = true;
        if (ob.segments.has(state.playerSegment)){
          die(ob);
          return;
        } else {
          state.score += 10;
        }
      }
    }
    state.obstacles = state.obstacles.filter(ob => ob.z > -Z_STEP * 0.5);

    // 스폰
    state.spawnCountdown -= state.speed * dt;
    if (state.spawnCountdown <= 0){
      spawnObstacle();
      const gap = 1.4 + Math.random() * 1.3;
      state.spawnCountdown = Z_STEP * gap;
    }

    // 가속
    state.speed = Math.min(13.0, 5.0 + state.distance * 0.0008);

    // 파티클
    for (const p of state.particles){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.97;
      p.vy *= 0.97;
      p.life -= dt;
    }
    state.particles = state.particles.filter(p => p.life > 0);

    if (state.shake > 0) state.shake -= dt;
    if (state.flash > 0) state.flash -= 0.04 * dt;

    // HUD
    hudScore.textContent = state.score;
    hudDist.textContent = Math.floor(state.distance / 10);
    hudSpeed.textContent = state.speed.toFixed(1);
  }

  function spawnObstacle(){
    const pattern = Math.random();
    const segs = new Set();
    if (pattern < 0.4){
      segs.add(Math.floor(Math.random() * N));
    } else if (pattern < 0.7){
      const s = Math.floor(Math.random() * N);
      segs.add(s);
      segs.add((s + 1) % N);
    } else if (pattern < 0.9){
      // 두 개의 통로
      const gap1 = Math.floor(Math.random() * N);
      const gap2 = (gap1 + 3 + Math.floor(Math.random() * 4)) % N;
      for (let s = 0; s < N; s++) if (s !== gap1 && s !== gap2) segs.add(s);
    } else {
      // 한 칸 통로
      const gap = Math.floor(Math.random() * N);
      for (let s = 0; s < N; s++) if (s !== gap) segs.add(s);
    }
    state.obstacles.push({
      z: PLAYER_Z + Z_STEP * RINGS * 0.9,
      segments: segs,
      hue: (state.baseHue + 40 + Math.random() * 60) % 360,
      passed: false
    });
  }

  function die(ob){
    state.flash = 1.0;
    state.shake = 30;
    // 폭발 파티클
    const a = (state.playerSegment + 0.5) * (Math.PI * 2 / N) + state.tunnelRotation;
    const p = project(a, PLAYER_Z);
    for (let i = 0; i < 60; i++){
      const ang = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 5;
      state.particles.push({
        x: p.x, y: p.y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        size: 2 + Math.random() * 3,
        hue: (state.baseHue + Math.random() * 360) % 360,
        life: 30 + Math.random() * 30,
        maxLife: 60
      });
    }
    // 0.6초 후 결과
    setTimeout(() => {
      state.running = false;
      cancelAnimationFrame(raf);
      document.removeEventListener('keydown', onKeyDown);
      finishUI();
    }, 600);
  }

  function render(){
    ctx.save();
    if (state.shake > 0){
      const s = state.shake;
      ctx.translate((Math.random()-0.5) * s * 0.7, (Math.random()-0.5) * s * 0.7);
    }

    // 배경 라디얼 그라데이션
    const bg = ctx.createRadialGradient(CX, CY, 20, CX, CY, 380);
    const bgInner = `hsl(${(state.baseHue + 30) % 360}, 70%, 12%)`;
    bg.addColorStop(0, bgInner);
    bg.addColorStop(0.55, '#06030f');
    bg.addColorStop(1, '#02010a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawTunnel();
    drawObstacles();
    drawPlayer();
    drawParticles();

    // flash overlay (충돌)
    if (state.flash > 0){
      ctx.fillStyle = `hsla(${state.baseHue}, 100%, 80%, ${state.flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  function drawTunnel(){
    const so = state.scrollOffset % Z_STEP;
    const rot = state.tunnelRotation;

    // 각 ring의 z를 미리 계산
    const ringZ = [];
    for (let i = 0; i < RINGS; i++){
      const z = i * Z_STEP - so;
      ringZ.push(z);
    }

    // 종단(z 방향) 라인 — 각 segment edge 한 줄
    for (let s = 0; s < N; s++){
      const a = (s / N) * Math.PI * 2 + rot;
      ctx.beginPath();
      let moved = false;
      for (let i = 0; i < RINGS; i++){
        const z = ringZ[i];
        if (z < -10) continue;
        const p = project(a, z);
        if (!moved){ ctx.moveTo(p.x, p.y); moved = true; }
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = `hsla(${(state.baseHue + 200) % 360}, 60%, 45%, .35)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // ring 라인 (둘레)
    for (let i = 0; i < RINGS; i++){
      const z = ringZ[i];
      if (z < -10) continue;
      const scale = FOCAL / (z + FOCAL);
      const alpha = Math.min(1, scale * 1.6) * 0.9;
      const lineW = 0.6 + scale * 2.5;
      const h = (state.baseHue + z * 0.06) % 360;

      ctx.beginPath();
      for (let s = 0; s <= N; s++){
        const a = (s / N) * Math.PI * 2 + rot;
        const p = project(a, z);
        if (s === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = `hsla(${h}, 85%, ${50 + scale * 18}%, ${alpha})`;
      ctx.lineWidth = lineW;
      ctx.shadowColor = `hsla(${h}, 95%, 70%, ${alpha})`;
      ctx.shadowBlur = 8 * scale;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  function drawObstacles(){
    const rot = state.tunnelRotation;
    // 멀리부터 그려 z-order 유지
    const sorted = [...state.obstacles].sort((a, b) => b.z - a.z);
    for (const ob of sorted){
      if (ob.z < -Z_STEP || ob.z > Z_STEP * (RINGS - 1)) continue;
      const zFront = ob.z;
      const zBack = ob.z + Z_STEP * 0.45;
      const scaleFront = FOCAL / (zFront + FOCAL);
      const alpha = Math.min(1, scaleFront * 1.4);
      for (const s of ob.segments){
        const a1 = (s / N) * Math.PI * 2 + rot;
        const a2 = ((s + 1) / N) * Math.PI * 2 + rot;
        const p1f = project(a1, zFront);
        const p2f = project(a2, zFront);
        const p2b = project(a2, zBack);
        const p1b = project(a1, zBack);

        // 채움
        const grad = ctx.createLinearGradient(p1f.x, p1f.y, p1b.x, p1b.y);
        grad.addColorStop(0, `hsla(${ob.hue}, 95%, 60%, ${alpha * 0.92})`);
        grad.addColorStop(1, `hsla(${(ob.hue + 30) % 360}, 95%, 35%, ${alpha * 0.6})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(p1f.x, p1f.y);
        ctx.lineTo(p2f.x, p2f.y);
        ctx.lineTo(p2b.x, p2b.y);
        ctx.lineTo(p1b.x, p1b.y);
        ctx.closePath();
        ctx.fill();

        // 외곽 글로우
        ctx.strokeStyle = `hsla(${(ob.hue + 50) % 360}, 100%, 75%, ${alpha})`;
        ctx.lineWidth = 1.5 + scaleFront * 1.2;
        ctx.shadowColor = `hsla(${(ob.hue + 50) % 360}, 100%, 70%, ${alpha})`;
        ctx.shadowBlur = 14 * scaleFront;
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
  }

  function drawPlayer(){
    const a = (state.playerSegment + 0.5) * (Math.PI * 2 / N) + state.tunnelRotation;
    // 살짝 안쪽 (TUNNEL_R * 0.88)
    const scale = FOCAL / (PLAYER_Z + FOCAL);
    const r = TUNNEL_R * 0.86 * scale;
    const x = CX + Math.cos(a) * r;
    const y = CY + Math.sin(a) * r;
    const facing = a;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(facing + Math.PI / 2);
    // 꼬리 화염
    ctx.fillStyle = `hsla(${(state.baseHue + 180) % 360}, 100%, 65%, .55)`;
    ctx.beginPath();
    ctx.moveTo(-5 * scale, 6 * scale);
    ctx.lineTo(0, 18 * scale);
    ctx.lineTo(5 * scale, 6 * scale);
    ctx.closePath();
    ctx.fill();
    // 본체
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(0, -12 * scale);
    ctx.lineTo(8 * scale, 8 * scale);
    ctx.lineTo(0, 5 * scale);
    ctx.lineTo(-8 * scale, 8 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    for (const p of state.particles){
      const a = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${a})`;
      ctx.shadowColor = `hsla(${p.hue}, 100%, 70%, ${a})`;
      ctx.shadowBlur = 10;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.shadowBlur = 0;
  }

  function finishUI(){
    const final = state.score;
    const dist = Math.floor(state.distance / 10);
    const stats = recordBestScore(KEY, final);
    const isBest = stats.bestScore === final && final > 0;
    clear(app);
    const r = $el('div', 'result-card');
    r.innerHTML = `
      <div class="result-emoji">${final >= 1000 ? '🏆' : final >= 400 ? '🎉' : '👏'}</div>
      <div class="result-title">충돌!</div>
      <div class="result-big">${final}점</div>
      <div class="result-sub">DIST ${dist} · SPEED ${state.speed.toFixed(1)}${isBest ? ' · 🌟 최고 기록' : ''}</div>
      ${isBest ? '<div class="ribbon">NEW BEST</div>' : ''}
      <div class="btn-row">
        <button class="btn" id="s">공유</button>
        <button class="btn secondary" id="a">다시</button>
        <button class="btn ghost" id="h">홈</button>
      </div>
    `;
    app.appendChild(r);
    document.getElementById('a').onclick = startGame;
    document.getElementById('h').onclick = showTitle;
    document.getElementById('s').onclick = (e)=>shareToClipboard(
      '터널 런\n🌀 ' + final + '점 · DIST ' + dist + (isBest ? ' 🌟' : '') +
      '\nhttps://games.jdgrid.com/brain/games/tunnel/',
      e.target
    );
  }

  raf = requestAnimationFrame(loop);
}

showTitle();
window.__GAME__ = { KEY };
</script>
</body>
</html>
