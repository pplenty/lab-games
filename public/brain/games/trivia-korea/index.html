<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 상식 퀴즈 | 5분 퍼즐</title>
<meta property="og:title" content="한국 상식 퀴즈">
<meta property="og:description" content="한국에 대한 일반 상식 10문제.">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#2e74a8;--accent-dark:#1e547d;--accent-soft:#b5cfe0; }
  .q{ background:var(--accent-soft);padding:18px;border-radius:14px;font-size:16px;font-weight:700;line-height:1.6;margin-bottom:12px;color:var(--accent-dark); }
  .opts{ display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px; }
  .opt{ padding:12px 16px;background:white;border:2px solid var(--ink-faint);border-radius:10px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:all .1s; }
  .opt:hover:not(:disabled){ border-color:var(--accent);background:var(--accent-soft); }
  .opt.correct{ background:var(--green);color:white;border-color:var(--green-dark); }
  .opt.wrong{ background:var(--red);color:white;border-color:#a43232; }
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="../../shared/engine.js"></script>
<script>
const { $el, clear, loadStats, recordBestScore, shuffle, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');

const BANK = [
  // 지리
  { q:'한국의 수도는?', opts:['서울','부산','인천','광주'], ans:'서울' },
  { q:'남한에서 가장 긴 강은?', opts:['낙동강','한강','금강','대동강'], ans:'낙동강' },
  { q:'한국의 가장 큰 섬은?', opts:['거제도','울릉도','제주도','강화도'], ans:'제주도' },
  { q:'한국의 최고봉은?', opts:['지리산','한라산','설악산','태백산'], ans:'한라산' },
  { q:'한국의 국제공항 중 가장 큰 것은?', opts:['김포국제공항','제주국제공항','인천국제공항','김해국제공항'], ans:'인천국제공항' },
  { q:'한국에서 두 번째로 큰 도시는?', opts:['대전','대구','부산','인천'], ans:'부산' },
  { q:'독도는 어느 바다에 있나?', opts:['서해','동해','남해','제주해협'], ans:'동해' },
  { q:'한국의 북쪽 국경과 접한 나라는?', opts:['중국과 러시아','중국만','일본','몽골'], ans:'중국과 러시아' },
  // 역사·인물
  { q:'훈민정음을 창제한 왕은?', opts:['태조','세종대왕','정조','영조'], ans:'세종대왕' },
  { q:'한국이 일제로부터 광복된 해는?', opts:['1920','1945','1950','1960'], ans:'1945' },
  { q:'한국전쟁이 발발한 해는?', opts:['1948','1950','1953','1945'], ans:'1950' },
  { q:'이순신 장군이 활약한 시대는?', opts:['고려','조선','삼국','대한제국'], ans:'조선' },
  { q:'한국의 대표 궁궐(경복궁 포함 5대 궁궐 중 정궁)은?', opts:['창덕궁','덕수궁','경복궁','창경궁'], ans:'경복궁' },
  // 문화·상징
  { q:'한국의 국화는?', opts:['무궁화','벚꽃','진달래','매화'], ans:'무궁화' },
  { q:'한국의 국기는?', opts:['태극기','욱일기','오성홍기','성조기'], ans:'태극기' },
  { q:'한국의 대표 민속놀이는?', opts:['윷놀이','주사위놀이','체스','포커'], ans:'윷놀이' },
  { q:'한국의 통화는?', opts:['엔','달러','원','위안'], ans:'원' },
  { q:'한국의 대표 명절 중 추수감사에 해당하는 것은?', opts:['설날','단오','추석','동지'], ans:'추석' },
  { q:'한복에서 여성이 입는 치마의 이름은?', opts:['두루마기','치마','도포','저고리'], ans:'치마' },
  { q:'한국의 전통 가옥은?', opts:['이글루','한옥','아파트','초가집도 한옥'], ans:'한옥' },
  // 음식
  { q:'김치의 주 재료는?', opts:['무','배추','오이','양배추'], ans:'배추' },
  { q:'비빔밥에 주로 얹는 것이 아닌 것은?', opts:['고추장','나물','달걀','치즈'], ans:'치즈' },
  { q:'한국의 전통주는?', opts:['사케','막걸리','소주','와인'], ans:'막걸리' },
  { q:'불고기에 주로 쓰이는 고기는?', opts:['닭고기','돼지고기','소고기','생선'], ans:'소고기' },
  // 현대 문화
  { q:'2020년 아카데미 작품상을 받은 한국 영화는?', opts:['올드보이','기생충','설국열차','극한직업'], ans:'기생충' },
  { q:'BTS가 데뷔한 연도는?', opts:['2011','2013','2015','2017'], ans:'2013' },
  { q:'한국의 대표 포털 사이트는?', opts:['네이버','구글','야후','바이두'], ans:'네이버' },
  { q:'한국에서 시작된 글로벌 메신저는?', opts:['왓츠앱','카카오톡','라인','텔레그램'], ans:'카카오톡' },
  // 스포츠·일상
  { q:'2018 동계올림픽이 열린 한국의 도시는?', opts:['평창','서울','부산','강릉'], ans:'평창' },
  { q:'한국인이 평균적으로 즐겨 먹는 야식은?', opts:['치킨','스테이크','샐러드','파스타'], ans:'치킨' }
];

const TOTAL = 8;
const KEY = 'trivia_korea_stats';
const app = document.getElementById('app');

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id='title-screen';
  ts.innerHTML = `
    <div class="brand-icon">🇰🇷</div>
    <h1 class="hero-title">한국 상식 <span style="color:var(--accent);">퀴즈</span></h1>
    <div class="hero-sub">한국에 대한 일반 상식 ${TOTAL}문제.<br>4지선다.</div>
    ${stats.bestScore>0?`<div class="today-card"><div class="today-label">B E S T</div><div class="today-date">${stats.bestScore}/${TOTAL}</div></div>`:''}
    <div class="btn-row"><button class="btn" id="btn-start">시 작 하 기</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  const qs = shuffle(BANK).slice(0, TOTAL);
  const state = { qs, i:0, correct:0 };
  next();
  function next(){
    if(state.i >= TOTAL) return finish();
    const q = state.qs[state.i];
    const opts = shuffle(q.opts);
    clear(app);
    const top = $el('div','topbar');
    top.innerHTML = `<div class="stat">${state.i+1}/${TOTAL}</div><div class="stat">✓ ${state.correct}</div>`;
    app.appendChild(top);
    const card = $el('div','card');
    card.innerHTML = `
      <div class="q">${Brain.escapeHtml(q.q)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-v="${Brain.escapeHtml(o)}">${Brain.escapeHtml(o)}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
    `;
    app.appendChild(card);
    card.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        card.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        const fb = document.getElementById('fb');
        if(b.dataset.v === q.ans){ b.classList.add('correct'); fb.className='feedback right'; fb.textContent='✓'; state.correct++; }
        else { b.classList.add('wrong'); [...card.querySelectorAll('.opt')].find(x=>x.dataset.v===q.ans).classList.add('correct'); fb.className='feedback wrong'; fb.textContent='정답: '+q.ans; }
        setTimeout(()=>{ state.i++; next(); }, 1200);
      };
    });
  }
  function finish(){
    const stats = recordBestScore(KEY, state.correct, {});
    const isBest = stats.bestScore === state.correct;
    clear(app);
    const r = $el('div','result-card');
    r.innerHTML = `
      <div class="result-emoji">${state.correct===TOTAL?'🏆':state.correct>=6?'🎉':'👏'}</div>
      <div class="result-title">상식 퀴즈 종료</div>
      <div class="result-big">${state.correct}/${TOTAL}</div>
      ${isBest?'<div class="ribbon">🌟 최고</div>':''}
      <div class="btn-row">
        <button class="btn" id="s">공유</button>
        <button class="btn secondary" id="a">다시</button>
        <button class="btn ghost" id="h">홈</button>
      </div>
    `;
    app.appendChild(r);
    document.getElementById('a').onclick=startGame;
    document.getElementById('h').onclick=showTitle;
    document.getElementById('s').onclick=(e)=>shareToClipboard(`한국 상식 퀴즈\n🇰🇷 ${state.correct}/${TOTAL}${isBest?' 🌟':''}`, e.target);
  }
}
showTitle();
window.__GAME__ = { BANK, TOTAL, KEY };
</script>
</body>
</html>
