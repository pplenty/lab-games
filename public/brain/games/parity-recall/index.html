<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짝홀 기억 | 5분 퍼즐</title>
<meta property="og:title" content="짝홀 기억">
<meta property="og:description" content="숫자들을 본 뒤 각 위치의 짝수·홀수를 맞추세요.">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#5b7ccc;--accent-dark:#3a5aa5;--accent-soft:#b9c9eb; }
  .flash{ text-align:center;padding:40px;background:var(--accent-soft);border-radius:14px;font-size:52px;font-weight:800;color:var(--accent-dark);letter-spacing:.12em;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:14px; }
  .q-block{ background:var(--bg-2);padding:14px;border-radius:10px;margin-bottom:10px; }
  .q-block .q{ font-weight:700;margin-bottom:8px;color:var(--accent-dark); }
  .yn{ display:grid;grid-template-columns:1fr 1fr;gap:8px; }
  .yn button{ padding:14px;background:white;border:2px solid var(--ink-faint);border-radius:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer; }
  .yn button.even{ color:var(--accent); }
  .yn button.odd{ color:var(--accent-dark); }
  .yn button:hover:not(:disabled){ background:var(--accent-soft); }
  .yn button.correct{ background:var(--green);color:white; }
  .yn button.wrong{ background:var(--red);color:white; }
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="../../shared/engine.js"></script>
<script>
const { $el, clear, loadStats, recordBestScore, shuffle, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');
const LEN = 6;
const SHOW_MS = 5000;
const QUESTIONS = 4;
const KEY = 'parity_stats';
const app = document.getElementById('app');

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id='title-screen';
  ts.innerHTML = `
    <div class="brand-icon">🔢</div>
    <h1 class="hero-title">짝홀 <span style="color:var(--accent);">기억</span></h1>
    <div class="hero-sub">${LEN}자리 숫자를 ${SHOW_MS/1000}초 동안 외운 뒤<br>각 위치가 짝수인지 홀수인지 맞혀보세요.</div>
    ${stats.bestScore>0?`<div class="today-card"><div class="today-label">B E S T</div><div class="today-date">${stats.bestScore}/${QUESTIONS}</div></div>`:''}
    <div class="btn-row"><button class="btn" id="btn-start">시 작 하 기</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}
function startGame(){
  let seq = '';
  for(let i=0;i<LEN;i++) seq += Math.floor(Math.random()*10);
  clear(app);
  const top = $el('div','topbar');
  top.innerHTML = `<div class="stat">외우기</div><div class="stat" id="t">${SHOW_MS/1000}s</div>`;
  app.appendChild(top);
  const card = $el('div','card');
  card.innerHTML = `<div class="flash">${seq}</div>`;
  app.appendChild(card);
  const start = performance.now();
  const iv = setInterval(()=>{
    const rem = Math.max(0, SHOW_MS - (performance.now()-start));
    document.getElementById('t').textContent = (rem/1000).toFixed(1)+'s';
    if(rem <= 0){ clearInterval(iv); quiz(seq); }
  }, 100);
}
function quiz(seq){
  const positions = shuffle(Array.from({length:LEN},(_,i)=>i)).slice(0, QUESTIONS);
  const state = { i:0, correct:0 };
  next();
  function next(){
    if(state.i >= positions.length){
      const stats = Brain.recordBestScore(KEY, state.correct, {});
      const isBest = stats.bestScore === state.correct;
      clear(app);
      const r = $el('div','result-card');
      r.innerHTML = `
        <div class="result-emoji">${state.correct===QUESTIONS?'🏆':state.correct>=3?'🎉':'👏'}</div>
        <div class="result-title">종료</div>
        <div class="result-big">${state.correct}/${QUESTIONS}</div>
        <div class="result-sub">원래 숫자: ${seq}</div>
        ${isBest?'<div class="ribbon">🌟 최고</div>':''}
        <div class="btn-row">
          <button class="btn" id="s">공유</button>
          <button class="btn secondary" id="a">다시</button>
          <button class="btn ghost" id="h">홈</button>
        </div>
      `;
      app.appendChild(r);
      document.getElementById('a').onclick=startGame;
      document.getElementById('h').onclick=showTitle;
      document.getElementById('s').onclick=(e)=>Brain.shareToClipboard(`짝홀 기억\n🔢 ${state.correct}/${QUESTIONS}${isBest?' 🌟':''}`, e.target);
      return;
    }
    const pos = positions[state.i];
    const n = parseInt(seq[pos], 10);
    const isEven = n % 2 === 0;
    clear(app);
    const top = $el('div','topbar');
    top.innerHTML = `<div class="stat">질문 ${state.i+1}/${QUESTIONS}</div><div class="stat">✓ ${state.correct}</div>`;
    app.appendChild(top);
    const card = $el('div','card');
    card.innerHTML = `
      <div class="q-block">
        <div class="q">${pos+1}번째 자리의 숫자는?</div>
        <div class="yn">
          <button class="even" data-v="even">짝수 (0·2·4·6·8)</button>
          <button class="odd" data-v="odd">홀수 (1·3·5·7·9)</button>
        </div>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    app.appendChild(card);
    card.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{
        card.querySelectorAll('button').forEach(x=>x.disabled=true);
        const ans = b.dataset.v === 'even' ? isEven : !isEven;
        const fb = document.getElementById('fb');
        if(ans){ b.classList.add('correct'); fb.className='feedback right'; fb.textContent='✓'; state.correct++; }
        else { b.classList.add('wrong'); fb.className='feedback wrong'; fb.textContent=`해당 숫자는 ${n} (${isEven?'짝수':'홀수'})`; }
        setTimeout(()=>{ state.i++; next(); }, 1100);
      };
    });
  }
}
showTitle();
window.__GAME__ = { LEN, SHOW_MS, QUESTIONS, KEY };
</script>
</body>
</html>
