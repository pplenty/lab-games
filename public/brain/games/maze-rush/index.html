<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미로 러시 · 30초 | 5분 퍼즐</title>
<meta property="og:title" content="미로 러시 30초">
<meta property="og:description" content="30초 안에 미로를 몇 개 탈출할 수 있나요?">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#7a5e9e;--accent-dark:#563d74;--accent-soft:#c9b5dd; }
  .maze-grid{ display:grid;gap:1px;background:#2a2030;padding:2px;border-radius:6px;margin:0 auto 10px; }
  .maze-cell{ aspect-ratio:1;background:white; }
  .maze-cell.wall{ background:#2a2030; }
  .maze-cell.start{ background:var(--green);color:white;display:flex;align-items:center;justify-content:center;font-size:12px; }
  .maze-cell.end{ background:#f08a3e;color:white;display:flex;align-items:center;justify-content:center;font-size:12px; }
  .maze-cell.path{ background:var(--accent-soft); }
  .maze-cell.current{ background:var(--accent); }
  .controls{ display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:4px;justify-content:center;margin-top:8px; }
  .controls button{ border:0;border-radius:8px;background:var(--accent-soft);font:inherit;font-size:18px;cursor:pointer; }
  .controls button:hover{ background:var(--accent);color:white; }
  .timer-bar{ height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow); }
  .timer-fill{ height:100%;background:linear-gradient(to right,var(--accent),var(--accent-dark)); }
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="../../shared/engine.js"></script>
<script>
const { $el, clear, loadStats, recordBestScore, mulberry32, shuffle, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');
const SIZE = 7;
const DURATION = 30000;
const KEY = 'maze_rush_stats';
const app = document.getElementById('app');

function genMaze(seed){
  const rng = mulberry32(seed);
  const maze = Array.from({length:SIZE}, ()=>Array(SIZE).fill(1));
  const stack = [[0,0]];
  maze[0][0] = 0;
  while(stack.length){
    const [x,y] = stack[stack.length-1];
    const dirs = shuffle([[2,0],[-2,0],[0,2],[0,-2]], rng);
    let moved = false;
    for(const [dx,dy] of dirs){
      const nx=x+dx, ny=y+dy;
      if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE && maze[ny][nx]===1){
        maze[ny][nx] = 0;
        maze[y+dy/2][x+dx/2] = 0;
        stack.push([nx,ny]); moved = true; break;
      }
    }
    if(!moved) stack.pop();
  }
  return maze;
}

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id='title-screen';
  ts.innerHTML = `
    <div class="brand-icon">🌀</div>
    <h1 class="hero-title">미로 <span style="color:var(--accent);">러시</span></h1>
    <div class="hero-sub">30초 안에 7×7 미로를<br>몇 개 연속 탈출할 수 있을까?</div>
    ${stats.bestScore>0?`<div class="today-card"><div class="today-label">B E S T</div><div class="today-date">${stats.bestScore}개</div></div>`:''}
    <div class="btn-row"><button class="btn" id="btn-start">시 작 하 기</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  const startedAt = performance.now();
  const state = { solved:0, px:0, py:0, maze:null, timer:null, finished:false };
  newMaze();
  function newMaze(){
    state.maze = genMaze((Date.now()&0xffff) + state.solved*13);
    state.px = 0; state.py = 0;
    render();
  }
  function render(){
    clear(app);
    const top = $el('div','topbar');
    top.innerHTML = `<div class="stat">🌀 <span id="sol">${state.solved}</span>개</div><div class="stat" id="time">30.0s</div>`;
    app.appendChild(top);
    const bar = $el('div','timer-bar');
    bar.innerHTML = `<div class="timer-fill" id="fill" style="width:100%"></div>`;
    app.appendChild(bar);
    const card = $el('div','card');
    const cellPx = 34;
    card.innerHTML = `
      <div class="maze-grid" id="grid" style="grid-template-columns:repeat(${SIZE},1fr);max-width:${SIZE*cellPx}px;"></div>
      <div class="controls">
        <div></div><button data-d="up">↑</button><div></div>
        <button data-d="left">←</button><div></div><button data-d="right">→</button>
        <div></div><button data-d="down">↓</button><div></div>
      </div>
    `;
    app.appendChild(card);
    const grid = document.getElementById('grid');
    for(let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++){
      const cell = $el('div','maze-cell');
      if(state.maze[y][x]===1) cell.classList.add('wall');
      else if(x===0&&y===0 && !(x===state.px&&y===state.py)) cell.classList.add('start');
      else if(x===SIZE-1&&y===SIZE-1) cell.classList.add('end');
      if(x===state.px&&y===state.py) cell.classList.add('current');
      grid.appendChild(cell);
    }
    card.querySelectorAll('.controls button').forEach(b=>{
      b.onclick = ()=>move(b.dataset.d);
    });
  }
  function move(d){
    if(state.finished) return;
    let nx = state.px, ny = state.py;
    if(d==='up') ny--; else if(d==='down') ny++;
    else if(d==='left') nx--; else if(d==='right') nx++;
    if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) return;
    if(state.maze[ny][nx]===1) return;
    state.px = nx; state.py = ny;
    if(state.px===SIZE-1 && state.py===SIZE-1){
      state.solved++;
      document.getElementById('sol').textContent = state.solved;
      setTimeout(newMaze, 300);
      return;
    }
    render();
  }
  function onKey(e){
    if(state.finished) return;
    if(e.key==='ArrowUp'){ e.preventDefault(); move('up'); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); move('down'); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); move('left'); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); move('right'); }
  }
  document.addEventListener('keydown', onKey);
  function tick(){
    const elapsed = performance.now() - startedAt;
    const rem = Math.max(0, DURATION - elapsed);
    const tEl = document.getElementById('time');
    const fEl = document.getElementById('fill');
    if(tEl) tEl.textContent = (rem/1000).toFixed(1)+'s';
    if(fEl) fEl.style.width = (rem/DURATION*100)+'%';
    if(rem <= 0){ state.finished = true; clearInterval(state.timer); document.removeEventListener('keydown', onKey); finish(); }
  }
  state.timer = setInterval(tick, 80);
  function finish(){
    const stats = recordBestScore(KEY, state.solved, {});
    const isBest = stats.bestScore === state.solved && state.solved > 0;
    clear(app);
    const r = $el('div','result-card');
    r.innerHTML = `
      <div class="result-emoji">${state.solved>=5?'🏆':state.solved>=3?'🎉':'👏'}</div>
      <div class="result-title">30초 종료</div>
      <div class="result-big">${state.solved}개</div>
      ${isBest?'<div class="ribbon">🌟 최고</div>':''}
      <div class="btn-row">
        <button class="btn" id="s">공유</button>
        <button class="btn secondary" id="a">다시</button>
        <button class="btn ghost" id="h">홈</button>
      </div>
    `;
    app.appendChild(r);
    document.getElementById('a').onclick = startGame;
    document.getElementById('h').onclick = showTitle;
    document.getElementById('s').onclick = (e)=>shareToClipboard(`미로 러시\n🌀 ${state.solved}개${isBest?' 🌟':''}`, e.target);
  }
}
showTitle();
window.__GAME__ = { SIZE, DURATION, KEY, genMaze };
</script>
</body>
</html>
