<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬라이딩 퍼즐 · 3x3</title>
<meta property="og:title" content="슬라이딩 퍼즐 · 3x3">
<meta property="og:description" content="여덟 조각을 순서대로 정렬하는 공간 퍼즐. 빈칸을 움직여 최소 이동수로 완성하세요.">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#f6f1fa;
    --bg-2:#ece4f2;
    --card:#ffffff;
    --ink:#2a1f35;
    --ink-dim:#6d6078;
    --ink-faint:#b5a9c0;
    --accent:#a177bc;
    --accent-dark:#7e5598;
    --accent-soft:#d9c4e4;
    --green:#7db167;
    --red:#d06060;
    --shadow:0 4px 14px rgba(0,0,0,.08);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:linear-gradient(135deg,var(--bg) 0%,var(--bg-2) 100%);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:480px;margin:0 auto;padding:4vh 20px 12vh;}
  h1.title{font-size:24px;font-weight:800;text-align:center;color:var(--accent-dark);margin-bottom:4px;}
  .subtitle{text-align:center;color:var(--ink-dim);font-size:13px;letter-spacing:.15em;margin-bottom:22px;}
  .topbar{display:flex;justify-content:space-between;margin-bottom:16px;font-size:14px;color:var(--ink-dim);}
  .topbar .stat{background:var(--card);padding:6px 12px;border-radius:20px;font-weight:600;color:var(--accent-dark);box-shadow:var(--shadow);}

  .card{background:var(--card);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);margin-bottom:18px;}

  /* Puzzle */
  .puzzle-wrap{display:flex;flex-direction:column;align-items:center;}
  .puzzle{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    width:300px;max-width:100%;margin-bottom:18px;
    padding:12px;background:var(--accent-soft);border-radius:14px;
  }
  .tile{
    aspect-ratio:1;border-radius:10px;background:white;
    display:flex;align-items:center;justify-content:center;
    font-size:42px;font-weight:800;color:var(--accent-dark);
    cursor:pointer;transition:transform .18s ease;
    box-shadow:0 2px 6px rgba(0,0,0,.08);user-select:none;
  }
  .tile.movable:hover{transform:scale(1.04);background:var(--accent);color:white;}
  .tile.blank{background:transparent;box-shadow:none;cursor:default;}
  .tile.correct{color:var(--green);}

  .goal-preview{display:flex;gap:10px;align-items:center;color:var(--ink-dim);font-size:13px;margin-bottom:14px;}
  .goal-grid{display:grid;grid-template-columns:repeat(3,14px);gap:2px;}
  .goal-cell{width:14px;height:14px;background:var(--accent-soft);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--accent-dark);}
  .goal-cell.blank{background:transparent;}

  .btn{
    background:var(--accent);color:white;border:0;border-radius:10px;
    padding:12px 26px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;
    transition:all .2s;box-shadow:0 2px 8px rgba(161,119,188,.3);letter-spacing:.08em;
  }
  .btn:hover:not(:disabled){background:var(--accent-dark);transform:translateY(-1px);}
  .btn.secondary{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none;}
  .btn.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--ink-faint);box-shadow:none;padding:10px 18px;font-size:13px;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}

  #title-screen{text-align:center;padding-top:8vh;}
  .phone-icon{font-size:46px;margin-bottom:12px;}
  .hero-title{font-size:30px;font-weight:800;margin-bottom:10px;}
  .hero-sub{color:var(--ink-dim);font-size:15px;margin:0 auto 24px;max-width:330px;line-height:1.8;}
  .today-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:18px;box-shadow:var(--shadow);font-size:13px;}
  .today-label{color:var(--ink-dim);letter-spacing:.2em;}
  .today-date{font-weight:700;font-size:18px;margin-top:2px;}
  .best{color:var(--accent-dark);margin-top:4px;font-weight:600;}

  .result-card{text-align:center;}
  .result-emoji{font-size:48px;margin-bottom:8px;}
  .result-title{font-size:24px;font-weight:800;margin-bottom:14px;}
  .stats-row{display:flex;gap:14px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
  .stat-item{background:var(--bg);padding:10px 18px;border-radius:10px;}
  .stat-item .label{color:var(--ink-dim);font-size:12px;letter-spacing:.1em;}
  .stat-item .value{font-weight:800;font-size:22px;color:var(--accent-dark);}

  .credits{color:var(--ink-faint);font-size:11px;text-align:center;margin-top:26px;letter-spacing:.15em;}

  @media(max-width:480px){
    .puzzle{width:280px;}
    .tile{font-size:36px;}
  }
</style>
</head>
<body>
<a class="nav-back" href="../../" style="position:fixed;top:16px;left:16px;background:#fff;color:#666;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.07);z-index:10;">← 홈</a>
<main id="app"></main>
<script>
/* =========================================================
   『슬라이딩 퍼즐 · 3×3』 — game6
   ========================================================= */

const SIZE = 3;
const TILES = SIZE*SIZE; // 9; 8 numbered tiles + 1 blank
const GOAL = Array.from({length:TILES}, (_,i) => (i+1) % TILES); // [1,2,3,4,5,6,7,8,0]

/* PRNG */
function todaySeed(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
function mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t>>>15, t | 1);
    t ^= t + Math.imul(t ^ t>>>7, t | 61);
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* Generate solvable puzzle via reverse-random-moves from GOAL */
function shufflePuzzle(moves, rng){
  const state = GOAL.slice();
  let blankIdx = state.indexOf(0);
  let lastMove = -1;
  for(let i=0;i<moves;i++){
    const neighbors = neighborsOf(blankIdx).filter(n => n !== lastMove);
    const pick = neighbors[Math.floor(rng()*neighbors.length)];
    // swap
    [state[blankIdx], state[pick]] = [state[pick], state[blankIdx]];
    lastMove = blankIdx;
    blankIdx = pick;
  }
  // ensure not already solved
  if(state.every((v,i)=>v===GOAL[i])){
    // trivial adjust: swap first two neighbors of blank
    const bi = state.indexOf(0);
    const nb = neighborsOf(bi)[0];
    [state[bi], state[nb]] = [state[nb], state[bi]];
  }
  return state;
}

function neighborsOf(idx){
  const r = Math.floor(idx/SIZE), c = idx%SIZE;
  const list = [];
  if(r > 0) list.push(idx - SIZE);
  if(r < SIZE-1) list.push(idx + SIZE);
  if(c > 0) list.push(idx - 1);
  if(c < SIZE-1) list.push(idx + 1);
  return list;
}

function isSolved(state){
  return state.every((v,i)=>v===GOAL[i]);
}

function canMove(state, idx){
  if(state[idx] === 0) return false;
  const blank = state.indexOf(0);
  return neighborsOf(idx).includes(blank);
}
function doMove(state, idx){
  const blank = state.indexOf(0);
  if(!neighborsOf(idx).includes(blank)) return state;
  const next = state.slice();
  [next[idx], next[blank]] = [next[blank], next[idx]];
  return next;
}

/* BFS for minimum moves (state space only 9!/2 = 181440) */
function minMoves(startState){
  const key = s => s.join(',');
  const goalKey = key(GOAL);
  if(key(startState) === goalKey) return 0;
  const visited = new Set([key(startState)]);
  const queue = [[startState, 0]];
  const LIMIT = 200000;
  let cnt = 0;
  while(queue.length){
    if(++cnt > LIMIT) return -1;
    const [state, d] = queue.shift();
    const blank = state.indexOf(0);
    for(const n of neighborsOf(blank)){
      const next = state.slice();
      [next[blank], next[n]] = [next[n], next[blank]];
      const k = key(next);
      if(k === goalKey) return d+1;
      if(!visited.has(k)){
        visited.add(k);
        queue.push([next, d+1]);
      }
    }
  }
  return -1;
}

/* Persistence */
const STATS_KEY = 'slide3_stats';
function loadStats(){
  try{ return JSON.parse(localStorage.getItem(STATS_KEY)||'{"played":0,"won":0,"bestMoves":null,"bestTimeMs":null}'); }
  catch(e){ return {played:0,won:0,bestMoves:null,bestTimeMs:null}; }
}
function saveStats(s){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }catch(e){} }

/* State */
const state = {
  board: [],
  moves: 0,
  startedAt: 0,
  finished: false,
  minMoves: null
};

const app = document.getElementById('app');
function clear(){ app.innerHTML = ''; }
function $el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

function showTitle(){
  clear();
  const stats = loadStats();
  const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'.');
  const ts = $el('div'); ts.id = 'title-screen';
  ts.innerHTML = `
    <div class="phone-icon">🧩</div>
    <h1 class="hero-title">슬라이딩 퍼즐 · <span style="color:var(--accent);">3×3</span></h1>
    <div class="hero-sub">여덟 조각을 순서대로 맞추세요.<br>빈 칸과 맞닿은 조각만 움직입니다.</div>
    <div class="today-card">
      <div class="today-label">T O D A Y</div>
      <div class="today-date">${dateStr}</div>
      ${stats.bestMoves ? `<div class="best">최소 이동  ${stats.bestMoves}회</div>` : ''}
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-start">시 작 하 기</button>
    </div>
    <div class="credits">built by Claude · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  const rng = mulberry32(todaySeed() ^ 0xa6a6);
  // 35 random moves keeps the BFS optimal around 15~22 moves
  state.board = shufflePuzzle(35, rng);
  state.moves = 0;
  state.startedAt = performance.now();
  state.finished = false;
  state.minMoves = null;
  // Compute optimal in background (small puzzle, fast)
  setTimeout(()=>{ state.minMoves = minMoves(state.board); updateTopbar(); }, 30);
  render();
}

function updateTopbar(){
  const el = document.getElementById('topbar');
  if(!el) return;
  const elapsed = Math.floor((performance.now() - state.startedAt)/1000);
  const mm = Math.floor(elapsed/60), ss = (elapsed%60).toString().padStart(2,'0');
  el.innerHTML = `
    <div class="stat">⏱ ${mm}:${ss}</div>
    <div class="stat">👣 ${state.moves}${state.minMoves!=null?' / '+state.minMoves+' 최소':''}</div>
  `;
}
let timerInterval = null;

function render(){
  clear();

  const topbar = $el('div','topbar'); topbar.id='topbar';
  app.appendChild(topbar);
  updateTopbar();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{ if(!state.finished) updateTopbar(); }, 500);

  const card = $el('div','card');
  card.innerHTML = `<div class="puzzle-wrap">
    <div class="goal-preview">
      목표 <div class="goal-grid">
        ${GOAL.map(v => `<div class="goal-cell${v===0?' blank':''}">${v||''}</div>`).join('')}
      </div>
    </div>
    <div class="puzzle" id="puzzle"></div>
    <div class="btn-row">
      <button class="btn ghost" id="btn-reset">재섞기</button>
      <button class="btn ghost" id="btn-home">홈으로</button>
    </div>
  </div>`;
  app.appendChild(card);

  renderBoard();

  document.getElementById('btn-reset').onclick = startGame;
  document.getElementById('btn-home').onclick = ()=>{
    if(timerInterval) clearInterval(timerInterval);
    showTitle();
  };
}

function renderBoard(){
  const board = document.getElementById('puzzle');
  board.innerHTML = '';
  state.board.forEach((v, idx) => {
    const tile = $el('div', 'tile');
    if(v === 0){
      tile.classList.add('blank');
    } else {
      tile.textContent = v;
      if(canMove(state.board, idx)) tile.classList.add('movable');
      if(GOAL[idx] === v) tile.classList.add('correct');
      tile.onclick = ()=>{
        if(state.finished) return;
        if(!canMove(state.board, idx)) return;
        state.board = doMove(state.board, idx);
        state.moves++;
        if(isSolved(state.board)){
          state.finished = true;
          if(timerInterval) clearInterval(timerInterval);
          const elapsed = performance.now() - state.startedAt;
          persist(elapsed);
          setTimeout(()=>renderBoard(), 50);
          setTimeout(()=>showWin(elapsed), 400);
          return;
        }
        renderBoard();
        updateTopbar();
      };
    }
    board.appendChild(tile);
  });
}

function persist(elapsedMs){
  const stats = loadStats();
  stats.played++;
  stats.won++;
  if(stats.bestMoves == null || state.moves < stats.bestMoves) stats.bestMoves = state.moves;
  if(stats.bestTimeMs == null || elapsedMs < stats.bestTimeMs) stats.bestTimeMs = elapsedMs;
  saveStats(stats);
}

function showWin(elapsedMs){
  const stats = loadStats();
  const elapsed = Math.floor(elapsedMs/1000);
  const mm = Math.floor(elapsed/60), ss = (elapsed%60).toString().padStart(2,'0');
  const efficiency = state.minMoves != null && state.minMoves > 0
    ? Math.round(state.minMoves / state.moves * 100)
    : null;
  const card = $el('div', 'card result-card');
  card.innerHTML = `
    <div class="result-emoji">${efficiency && efficiency >= 95 ? '🏆' : efficiency && efficiency >= 80 ? '🎉' : '👏'}</div>
    <div class="result-title">완성!</div>
    <div class="stats-row">
      <div class="stat-item"><div class="label">이동</div><div class="value">${state.moves}</div></div>
      <div class="stat-item"><div class="label">시간</div><div class="value">${mm}:${ss}</div></div>
      ${efficiency!=null ? `<div class="stat-item"><div class="label">효율</div><div class="value">${efficiency}%</div></div>` : ''}
    </div>
    ${state.minMoves != null ? `<div style="color:var(--ink-dim);font-size:13px;">최소 이동수 ${state.minMoves}회</div>` : ''}
    <div class="btn-row">
      <button class="btn" id="btn-share">결과 공유</button>
      <button class="btn secondary" id="btn-again">다시</button>
      <button class="btn ghost" id="btn-home">홈으로</button>
    </div>
  `;
  app.appendChild(card);
  document.getElementById('btn-again').onclick = startGame;
  document.getElementById('btn-home').onclick = showTitle;
  document.getElementById('btn-share').onclick = ()=>{
    const date = new Date().toISOString().slice(0,10);
    const txt = `슬라이딩 퍼즐 3×3 — ${date}\n이동 ${state.moves} / 시간 ${mm}:${ss}${efficiency?'\n효율 '+efficiency+'%':''}`;
    if(navigator.clipboard){
      navigator.clipboard.writeText(txt).then(()=>{
        const btn = document.getElementById('btn-share');
        const orig = btn.textContent;
        btn.textContent='✓ 복사됨';
        setTimeout(()=>btn.textContent=orig, 1500);
      });
    }
  };
}

/* Boot */
showTitle();
</script>
</body>
</html>
