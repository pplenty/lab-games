<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세 | 5분 퍼즐</title>
<meta property="og:title" content="오늘의 운세">
<meta property="og:description" content="오늘의 작은 기운과 행운의 단어 뽑기.">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#d49f3b;--accent-dark:#a07a1e;--accent-soft:#f0d68a; }
  .card-fortune{ text-align:center;padding:28px 18px;background:linear-gradient(135deg,var(--accent-soft),#fff3c4);border-radius:18px;margin-bottom:14px;box-shadow:var(--shadow); }
  .fortune-label{ color:var(--accent-dark);letter-spacing:.3em;font-size:12px;margin-bottom:10px; }
  .fortune-big{ font-size:28px;font-weight:800;color:var(--accent-dark);margin-bottom:12px;line-height:1.4; }
  .fortune-score{ font-size:62px;font-weight:800;color:var(--accent-dark);line-height:1;margin-bottom:10px; }
  .categories{ display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px; }
  .cat{ background:var(--card);padding:14px 12px;border-radius:12px;box-shadow:var(--shadow);text-align:center; }
  .cat .ttl{ font-size:11px;color:var(--ink-dim);letter-spacing:.1em;margin-bottom:4px; }
  .cat .value{ font-weight:700;color:var(--accent-dark); }
  .cat .stars{ color:var(--accent);font-size:15px;margin-top:4px; }
  .lucky-items{ display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px; }
  .item-chip{ background:var(--accent-soft);padding:6px 14px;border-radius:18px;font-size:13px;color:var(--accent-dark);font-weight:700; }
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="../../shared/engine.js"></script>
<script>
const { $el, clear, injectBackLink, shareToClipboard, mulberry32, todaySeed, todayPretty } = Brain;
injectBackLink('../../');
const app = document.getElementById('app');

const MESSAGES = [
  '오늘은 생각보다 일이 잘 풀리는 날이에요.',
  '작은 시도가 큰 변화로 이어질 수 있어요.',
  '평소 챙기지 않던 친구에게 연락해보세요.',
  '익숙한 장소에서 새로운 시선을 찾게 될 거예요.',
  '오늘은 결정을 하루 미뤄도 괜찮아요.',
  '간단한 정리가 하루의 리듬을 바꿔줍니다.',
  '계획보다 즉흥이 더 잘 맞는 하루일 수 있어요.',
  '작은 호기심이 오늘의 동력이 됩니다.',
  '조용한 한 시간이 당신을 회복시킵니다.',
  '평범한 대화에 뜻밖의 힌트가 있어요.'
];
const COLORS = [
  { name:'연노랑', hex:'#f0e4a0' }, { name:'하늘색', hex:'#a8cfe8' },
  { name:'민트', hex:'#a8e0c3' }, { name:'코랄', hex:'#f0a8a8' },
  { name:'라벤더', hex:'#cfb7e0' }, { name:'연분홍', hex:'#f5c5d5' },
  { name:'올리브', hex:'#b8c07c' }, { name:'연회색', hex:'#d0d5da' }
];
const NUMBERS = [3,7,8,11,13,17,21,27,33,42];
const FOODS = ['국밥','비빔밥','샐러드','치킨','파스타','떡볶이','된장찌개','김치전','카레','초밥'];
const DIRECTIONS = ['동쪽','서쪽','남쪽','북쪽','남동쪽','남서쪽','북동쪽','북서쪽'];
const ACTIVITIES = ['산책','독서','카페 방문','영화 감상','공원 나들이','요리','음악 감상','글쓰기','운동','친구 만남'];

function showFortune(){
  clear(app);
  const rng = mulberry32(todaySeed() ^ 0xf00d);
  const pick = (arr) => arr[Math.floor(rng()*arr.length)];
  const msg = pick(MESSAGES);
  const lucky = {
    love:   1 + Math.floor(rng()*5),
    money:  1 + Math.floor(rng()*5),
    work:   1 + Math.floor(rng()*5),
    health: 1 + Math.floor(rng()*5)
  };
  const total = lucky.love + lucky.money + lucky.work + lucky.health;
  const overall = Math.round(total / 4 * 20); // 20~100
  const color = pick(COLORS);
  const number = pick(NUMBERS);
  const food = pick(FOODS);
  const direction = pick(DIRECTIONS);
  const activity = pick(ACTIVITIES);

  const stars = (n) => '★'.repeat(n) + '☆'.repeat(5-n);

  const ts = $el('div');
  ts.innerHTML = `
    <div style="text-align:center;margin-bottom:14px;"><div class="today-label" style="color:var(--ink-dim);letter-spacing:.2em;font-size:12px;">T O D A Y</div><div style="font-size:18px;font-weight:700;">${todayPretty()}</div></div>
    <div class="card-fortune">
      <div class="fortune-label">오 늘 의  운 세</div>
      <div class="fortune-score">${overall}<span style="font-size:24px;">/100</span></div>
      <div class="fortune-big">${msg}</div>
    </div>
    <div class="categories">
      <div class="cat"><div class="ttl">연 애</div><div class="stars">${stars(lucky.love)}</div></div>
      <div class="cat"><div class="ttl">재 물</div><div class="stars">${stars(lucky.money)}</div></div>
      <div class="cat"><div class="ttl">일 · 학 업</div><div class="stars">${stars(lucky.work)}</div></div>
      <div class="cat"><div class="ttl">건 강</div><div class="stars">${stars(lucky.health)}</div></div>
    </div>
    <div class="card" style="padding:14px;">
      <div style="text-align:center;color:var(--ink-dim);font-size:13px;margin-bottom:8px;letter-spacing:.1em;">오 늘 의  행 운</div>
      <div class="lucky-items">
        <div class="item-chip">🎨 ${color.name}</div>
        <div class="item-chip">🔢 ${number}</div>
        <div class="item-chip">🍚 ${food}</div>
        <div class="item-chip">🧭 ${direction}</div>
        <div class="item-chip">✨ ${activity}</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="s">결과 공유</button>
      <button class="btn ghost" id="h">홈</button>
    </div>
    <div style="text-align:center;color:var(--ink-faint);font-size:11px;margin-top:16px;">※ 재미로 보는 운세입니다. 같은 날은 같은 결과가 나와요.</div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('h').onclick = showFortune; // refresh
  document.getElementById('s').onclick = (e)=>{
    const txt = `${todayPretty()} 오늘의 운세\n🌟 ${overall}/100\n${msg}\n행운: ${color.name}, ${number}, ${food}`;
    shareToClipboard(txt, e.target);
  };
}
showFortune();
window.__GAME__ = { MESSAGES, COLORS, NUMBERS, FOODS, DIRECTIONS, ACTIVITIES };
</script>
</body>
</html>
