<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거울상 찾기 | 5분 퍼즐</title>
<meta property="og:title" content="거울상 찾기">
<meta property="og:description" content="원본과 정확한 거울상 쌍을 찾으세요.">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  :root{ --accent:#5f8f98;--accent-dark:#3c6b72;--accent-soft:#bcd6db; }
  .q-area{ display:flex;gap:12px;align-items:center;justify-content:center;padding:16px;background:var(--accent-soft);border-radius:14px;margin-bottom:14px; }
  .shape-box{ width:80px;height:80px;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1; }
  .shape-box.flipped{ transform:scaleX(-1); }
  .opts{ display:grid;grid-template-columns:repeat(4,1fr);gap:8px; }
  .opt-shape{ aspect-ratio:1;background:white;border:2px solid var(--ink-faint);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;transition:all .1s;line-height:1; }
  .opt-shape.flipped{ transform:scaleX(-1); }
  .opt-shape:hover:not(:disabled){ border-color:var(--accent);background:var(--accent-soft); }
  .opt-shape.correct{ background:var(--green);color:white; }
  .opt-shape.wrong{ background:var(--red);color:white; }
  .vs{ font-weight:800;color:var(--accent-dark); }
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="../../shared/engine.js"></script>
<script>
const { $el, clear, loadStats, recordBestScore, shuffle, injectBackLink, shareToClipboard } = Brain;
injectBackLink('../../');
const SHAPES = ['🏹','🚀','⛵','🎸','🎺','🔑','🏀','🚲','🌀','🎯','🐦','🦋','✂️','🎈','🕯️','🏄'];
const TOTAL = 6;
const KEY = 'mirror_match_stats';
const app = document.getElementById('app');

function showTitle(){
  clear(app);
  const stats = loadStats(KEY, { played:0, bestScore:0 });
  const ts = $el('div'); ts.id='title-screen';
  ts.innerHTML = `
    <div class="brand-icon">🪞</div>
    <h1 class="hero-title">거울상 <span style="color:var(--accent);">찾기</span></h1>
    <div class="hero-sub">왼쪽 도형의 좌우 뒤집힌 모양을<br>4개 중에서 고르세요. ${TOTAL}문제.</div>
    ${stats.bestScore>0?`<div class="today-card"><div class="today-label">B E S T</div><div class="today-date">${stats.bestScore}/${TOTAL}</div></div>`:''}
    <div class="btn-row"><button class="btn" id="btn-start">시 작 하 기</button></div>
    <div class="credits">5분 퍼즐 · 2026</div>
  `;
  app.appendChild(ts);
  document.getElementById('btn-start').onclick = startGame;
}

function startGame(){
  const qs = shuffle(SHAPES).slice(0, TOTAL);
  const state = { qs, i:0, correct:0 };
  next();
  function next(){
    if(state.i >= TOTAL) return finish();
    const target = state.qs[state.i];
    // options: target (same, not flipped), target (flipped - correct), 2 distractors (not flipped)
    const others = shuffle(SHAPES.filter(s => s !== target)).slice(0, 2);
    const opts = shuffle([
      { shape:target, flipped:true, isAns:true },
      { shape:target, flipped:false },
      { shape:others[0], flipped:false },
      { shape:others[1], flipped:true }
    ]);
    clear(app);
    const top = $el('div','topbar');
    top.innerHTML = `<div class="stat">${state.i+1}/${TOTAL}</div><div class="stat">✓ ${state.correct}</div>`;
    app.appendChild(top);
    const card = $el('div','card');
    card.innerHTML = `
      <div class="q-area">
        <div class="shape-box">${target}</div>
        <div class="vs">→ 거울상은?</div>
      </div>
      <div class="opts">
        ${opts.map((o,i)=>`<div class="opt-shape${o.flipped?' flipped':''}" data-i="${i}">${o.shape}</div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    `;
    app.appendChild(card);
    card.querySelectorAll('.opt-shape').forEach(b=>{
      b.onclick = ()=>{
        card.querySelectorAll('.opt-shape').forEach(x=>x.onclick=null);
        const idx = +b.dataset.i;
        const fb = document.getElementById('fb');
        if(opts[idx].isAns){ b.classList.add('correct'); fb.className='feedback right'; fb.textContent='✓'; state.correct++; }
        else { b.classList.add('wrong'); const ansEl = [...card.querySelectorAll('.opt-shape')].find((x,i)=>opts[i].isAns); ansEl.classList.add('correct'); fb.className='feedback wrong'; fb.textContent='거울상은 반드시 좌우 반전된 같은 도형이어야 해요.'; }
        setTimeout(()=>{ state.i++; next(); }, 1200);
      };
    });
  }
  function finish(){
    const stats = recordBestScore(KEY, state.correct, {});
    const isBest = stats.bestScore === state.correct;
    clear(app);
    const r = $el('div','result-card');
    r.innerHTML = `
      <div class="result-emoji">${state.correct===TOTAL?'🏆':state.correct>=4?'🎉':'👏'}</div>
      <div class="result-title">거울상 찾기 종료</div>
      <div class="result-big">${state.correct}/${TOTAL}</div>
      ${isBest?'<div class="ribbon">🌟 최고</div>':''}
      <div class="btn-row">
        <button class="btn" id="s">공유</button>
        <button class="btn secondary" id="a">다시</button>
        <button class="btn ghost" id="h">홈</button>
      </div>
    `;
    app.appendChild(r);
    document.getElementById('a').onclick=startGame;
    document.getElementById('h').onclick=showTitle;
    document.getElementById('s').onclick=(e)=>shareToClipboard(`거울상 찾기\n🪞 ${state.correct}/${TOTAL}${isBest?' 🌟':''}`, e.target);
  }
}
showTitle();
window.__GAME__ = { SHAPES, TOTAL, KEY };
</script>
</body>
</html>
